/* ---------- actions handed over from the main switch ---------- */
function accountsAct(a, el){
  const id = el.dataset.id;
  const inv = id ? (S.invoices||[]).find(i=>i.id===id) : null;
  switch(a){
    case 'party-open': ui.partyId=id; go('party1'); break;
    case 'party-back': go('party'); break;
    case 'quote-bill': quoteToInvoice(); break;
    case 'quote-wa': waQuote(); break;
    case 'bill-pdf': invoicePDF(inv); break;
    case 'bill-wa': waInvoice(inv); break;
    case 'bill-pay': paymentDialog(inv.partyId, inv.id); break;
    case 'bill-cancel':
      if(inv.cancelled){ inv.cancelled=false; }
      else if(confirm('Cancel bill '+inv.no+'? The stock goes back and the khata drops this amount.')){
        inv.cancelled=true;
        inv.items.forEach(i=>{ const p=S.products.find(x=>x.id===i.id); if(p) p.stock=(+p.stock||0)+i.qty; });
      }
      save(); render(); break;
    case 'pay-add': paymentDialog(id); break;
    case 'pay-any': {
      if(!S.parties.length) return toast('Add a party first');
      const name = prompt('Payment from which party?\n\n'+S.parties.map(p=>p.name).join('\n'));
      const p = S.parties.find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());
      if(p) paymentDialog(p.id); else if(name) toast('No party by that name');
      break; }
    case 'pay-del': if(confirm('Remove this payment entry?')){ S.payments=S.payments.filter(p=>p.id!==id); save(); render(); } break;
    case 'stmt-pdf': statementPDF(id); break;
    case 'ledger-wa': waLedger(id); break;
  }
}
</script>



<script id="pm-pro-enhancements-script">
(()=>{
  const PM_VERSION='2.1 Pro';
  const oldHandleAct=handleAct, oldAccountsAct=accountsAct, oldViewSet=viewSet;

  function ensureProState(){
    S.quotes=S.quotes||[]; S.audit=S.audit||[];
    S.settings={...DEF_SETTINGS,nextQuoteNo:1,quotePrefix:'QT-',stockPolicy:'warn',...S.settings};
    S.parties.forEach(p=>{ if(p.archived==null) p.archived=false; });
    ui.quote=ui.quote||{};
    const qDefaults={party:'',items:[],gst:false,extraPct:'',validDays:7,note:'',savedId:null};
    Object.keys(qDefaults).forEach(k=>{ if(ui.quote[k]===undefined) ui.quote[k]=qDefaults[k]; });
    ui.rateParty=ui.rateParty||''; ui.rateQ=ui.rateQ||''; ui.rateCat=ui.rateCat||''; ui.rateLimit=ui.rateLimit||120; ui.showArchived=!!ui.showArchived;
  }
  ensureProState();

  function audit(type,text,meta){ S.audit=S.audit||[]; S.audit.unshift({id:uid(),at:Date.now(),type,text,meta:meta||{}}); S.audit=S.audit.slice(0,500); }

  window.pmAudit284=audit;
  /* More durable local fallback: window.storage when present + localStorage mirror. */
  save=scheduleLocalSave284;
  try{
    if(!(window.storage&&window.storage.get)){
      const local=localStorage.getItem('tpm:data:local');
      if(local){ const d=JSON.parse(local); if(d&&d.__pmVault===1){ window.__PM_VAULT_PENDING=d; } else { S={...S,...d,settings:{...DEF_SETTINGS,...(d.settings||{})}}; ensureProState(); } }
    }
  }catch(e){}

  /* Real stacking: party/general rule first, then the ad-hoc extra discount. */
  profileFor=function(partyId,extraPct){
    return {rules:[...S.rules.filter(r=>!r.party),...(partyId?S.rules.filter(r=>r.party===partyId):[])],extraPct:nz(extraPct)};
  };
  priceOf=function(p,profile){
    const base=p.price;
    const rule=p.discount?{...p.discount,scope:'product',src:'item'}:resolveRule(p,(profile&&profile.rules)||S.rules);
    if(base==null) return {base:null,net:null,rule,off:null,offPct:null,extraPct:profile&&profile.extraPct||0,beforeExtra:null};
    let net=base;
    if(rule){ if(rule.type==='pct') net=base*(1-(+rule.value||0)/100); else if(rule.type==='flat') net=base-(+rule.value||0); else if(rule.type==='set') net=+rule.value||0; }
    const beforeExtra=Math.max(0,roundPrice(net));
    const extra=profile&&profile.extraPct!=null?+profile.extraPct:0;
    if(extra) net=beforeExtra*(1-extra/100); else net=beforeExtra;
    net=Math.max(0,roundPrice(net));
    const off=base-net;
    return {base,net,rule,off,offPct:base?(off/base*100):0,extraPct:extra,beforeExtra};
  };

  function activeParties(){ return S.parties.filter(p=>!p.archived); }
  function quoteDefaults(){ ensureProState(); return ui.quote; }
  function quoteRows(){
    const Q=quoteDefaults(), prof=profileFor(Q.party,Q.extraPct);
    return Q.items.map(it=>{ const p=S.products.find(x=>x.id===it.id); if(!p)return null; const calc=priceOf(p,prof); const partyCalc=priceOf(p,profileFor(Q.party)); const rate=it.rateOverride!=null?+it.rateOverride:(calc.net||0); const qty=+it.qty||0; return {p,it,qty,base:p.price,partyRate:partyCalc.net,calcRate:calc.net,rate,amt:rate*qty}; }).filter(Boolean);
  }
  function quoteTotals(){ const Q=quoteDefaults(),rows=quoteRows(); const subtotal=rows.reduce((a,r)=>a+r.amt,0); const gst=Q.gst?rows.reduce((a,r)=>a+r.amt*((r.p.gst??S.settings.gstDefault)/100),0):0; return {rows,subtotal,gst,total:subtotal+gst}; }
  function newQuoteNo(){
    const existing=new Set((S.quotes||[]).map(x=>x.no));
    let n=S.settings.nextQuoteNo||1, no=(S.settings.quotePrefix||'QT-')+String(n).padStart(4,'0');
    while(existing.has(no)){ n++; no=(S.settings.quotePrefix||'QT-')+String(n).padStart(4,'0'); }
    S.settings.nextQuoteNo=n+1;
    return no;
  }
  function quoteValidTs(q){ return q.validTill||((q.date||Date.now())+(+(q.validDays||7))*86400000); }
  function saveCurrentQuote(silent,status){
    const Q=quoteDefaults(), party=partyOf(Q.party), T=quoteTotals();
    if(!Q.party){ if(!silent)toast('Choose a party first'); return null; }
    if(!T.rows.length){ if(!silent)toast('Add at least one item'); return null; }
    let q=Q.savedId?(S.quotes||[]).find(x=>x.id===Q.savedId):null, isNew=!q;
    if(!q){ q={id:uid(),no:newQuoteNo(),date:Date.now()}; S.quotes.unshift(q); Q.savedId=q.id; }
    Object.assign(q,{partyId:Q.party,partyName:party?party.name:'',validDays:+Q.validDays||7,validTill:(q.date||Date.now())+(+Q.validDays||7)*86400000,
      gst:!!Q.gst,extraPct:nz(Q.extraPct)||0,note:Q.note||'',status:status||q.status||'Draft',updatedAt:Date.now(),subtotal:Math.round(T.subtotal*100)/100,gstAmt:Math.round(T.gst*100)/100,total:Math.round(T.total*100)/100,
      items:T.rows.map(r=>({productId:r.p.id,code:r.p.code,name:r.p.name,size:r.p.size||'',qty:r.qty,baseRate:r.base,rate:r.rate,gst:r.p.gst??S.settings.gstDefault,amount:Math.round(r.amt*100)/100}))});
    audit(isNew?'quote-created':'quote-updated',`${q.no} · ${q.partyName} · ${S.settings.currency}${money(q.total)}`,{quoteId:q.id}); save();
    if(!silent) toast((isNew?'Saved ':'Updated ')+q.no); return q;
  }
  function loadQuote(id,duplicate){
    const q=(S.quotes||[]).find(x=>x.id===id); if(!q)return;
    ui.quote={party:q.partyId,gst:!!q.gst,extraPct:q.extraPct||'',validDays:q.validDays||7,note:q.note||'',savedId:duplicate?null:q.id,
      items:(q.items||[]).map(x=>{ const p=S.products.find(p=>p.id===x.productId)||findByCode(x.code); return p?{id:p.id,qty:x.qty,rateOverride:x.rate,rateSource26:'manual'}:null; }).filter(Boolean)};
    go('quote'); toast(duplicate?'Quotation duplicated':'Loaded '+q.no);
  }

  renderNav=function(){
    ensureProState();
    const groups=[
      ['','dash','Overview'],
      ['Sales','quote','Quotations'],['Sales','bills','Bills & khata'],
      ['Customers','party','Parties'],['Customers','rate','Rate matrix'],
      ['Products','inv','Inventory'],['Products','list','Make price list'],['Products','import','Import PDF'],
      ['Pricing','disc','Discounts'],['Pricing','hist','Rate history'],
      ['','set','Settings']
    ];
    let last=null,out='';
    groups.forEach(([g,id,label])=>{ if(g&&g!==last){out+=`<div class="nav-section">${g}</div>`;last=g;} if(!g)last=null; const count=id==='party'?activeParties().length:id==='inv'?S.products.length:id==='quote'?(S.quotes||[]).filter(q=>q.status!=='Converted').length:0; out+=`<button data-nav="${id}" class="${page===id?'on':''}"><span>${label}</span>${count?`<span class="pill">${count}</span>`:''}</button>`; });
    $('#nav').innerHTML=out;
  };
  render=function(){
    ensureProState(); renderNav(); $('#brandName').textContent='CA';
    const v=$('#view'),t=$('#pgTitle'),sub=$('#pgSub'),act=$('#topActions'); act.innerHTML='';sub.textContent='';
    const views={dash:viewDash,import:viewImport,inv:viewInv,disc:viewDisc,hist:viewHist,list:viewList,party:viewParty,party1:viewPartyAccount,quote:viewQuote,bills:viewBills,rate:viewRateMatrix,set:viewSet};
    (views[page]||viewDash)(v,t,sub,act);
  };

  viewDash=function(v,t,sub){
    ensureProState(); t.textContent='Business overview'; sub.textContent=`${activeParties().length} active parties · ${S.products.length} products`;
    const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    const bills=(S.invoices||[]).filter(i=>!i.cancelled), monthBills=bills.filter(i=>i.date>=start); const sales=monthBills.reduce((a,i)=>a+i.total,0); const due=totalReceivable();
    const overdue=bills.filter(i=>invDue(i)>0.5&&overdueDays(i)>0).reduce((a,i)=>a+invDue(i),0); const low=S.products.filter(p=>+p.minStock>0&&(+p.stock||0)<=+p.minStock).length; const openQuotes=(S.quotes||[]).filter(q=>!['Converted','Rejected','Expired'].includes(q.status)).length;
    const activities=[];
    bills.slice(0,6).forEach(i=>activities.push({at:i.date,text:`Bill ${i.no} · ${i.partyName}`,amt:i.total,type:'Bill'}));
    (S.payments||[]).slice(0,6).forEach(x=>activities.push({at:x.date,text:`Payment · ${(partyOf(x.partyId)||{}).name||'Party'}`,amt:x.amount,type:'Payment'}));
    (S.quotes||[]).slice(0,6).forEach(q=>activities.push({at:q.updatedAt||q.date,text:`${q.no} · ${q.partyName}`,amt:q.total,type:'Quote'})); activities.sort((a,b)=>b.at-a.at);
    v.innerHTML=`
      <div class="grid stats" style="margin-bottom:16px">
        <div class="stat"><b class="num">${CUR()}${money(sales)}</b><span>sales this month</span><div class="metric-sub">${monthBills.length} invoice(s)</div></div>
        <div class="stat ${due?'alert':''}"><b class="num">${CUR()}${money(due)}</b><span>total receivable</span><div class="metric-sub">across ${activeParties().filter(p=>partyBalance(p.id)>0).length} parties</div></div>
        <div class="stat ${overdue?'alert':''}"><b class="num">${CUR()}${money(overdue)}</b><span>overdue receivable</span><div class="metric-sub">needs collection follow-up</div></div>
        <div class="stat ${low?'alert':''}"><b class="num">${low}</b><span>low stock items</span><div class="metric-sub">minimum stock threshold</div></div>
        <div class="stat"><b class="num">${openQuotes}</b><span>open quotations</span><div class="metric-sub">draft / sent / accepted</div></div>
      </div>
      <div class="section-title">Quick actions</div>
      <div class="quick-grid">
        <button class="quick-card" data-nav="quote"><b>＋ New quotation</b><span>Create a party-specific quote</span></button>
        <button class="quick-card" data-act="pay-any"><b>₹ Record payment</b><span>Update party khata</span></button>
        <button class="quick-card" data-act="add-party"><b>＋ Add party</b><span>Customer + credit + pricing</span></button>
        <button class="quick-card" data-nav="rate"><b>Rate matrix</b><span>Edit one customer’s rates fast</span></button>
        <button class="quick-card" data-nav="inv"><b>Inventory</b><span>Stock, MRP and base rates</span></button>
      </div>
      <div class="split" style="margin-top:18px">
        <div class="card"><div class="hd"><h2>Receivable health</h2></div><div class="bd">
          ${activeParties().filter(p=>partyBalance(p.id)>0).sort((a,b)=>partyBalance(b.id)-partyBalance(a.id)).slice(0,8).map(p=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)"><button class="link" data-act="party-open" data-id="${p.id}">${esc(p.name)}</button><b class="num ${partyBalance(p.id)>0?'bad':''}">${CUR()}${money(partyBalance(p.id))}</b></div>`).join('')||'<div class="empty-mini">No outstanding receivables.</div>'}
        </div></div>
        <div class="card"><div class="hd"><h2>Recent activity</h2></div><div class="bd activity">
          ${activities.slice(0,9).map(a=>`<div class="activity-row"><span class="status ${a.type==='Payment'?'good':a.type==='Quote'?'info':''}">${a.type}</span><span>${esc(a.text)}<div class="metric-sub">${dstr(a.at)}</div></span><b class="num">${CUR()}${money(a.amt)}</b></div>`).join('')||'<div class="empty-mini">Activity will appear here.</div>'}
        </div></div>
      </div>`;
  };

  viewParty=function(v,t,sub,act){
    ensureProState(); const parties=S.parties.filter(p=>ui.showArchived?true:!p.archived); t.textContent='Parties'; sub.textContent='Customer, credit, rates and account in one place';
    act.innerHTML=`<button class="btn ghost sm" data-act="toggle-archived">${ui.showArchived?'Hide archived':'Show archived'}</button><button class="btn primary sm" data-act="add-party">Add party</button>`;
    v.innerHTML=parties.length?`<div class="tbl-wrap"><table><thead><tr><th>Party</th><th>Type / Place</th><th>Pricing</th><th class="r">Due</th><th>Credit</th><th></th></tr></thead><tbody>
      ${parties.map(p=>{const bal=partyBalance(p.id),rules=S.rules.filter(r=>r.party===p.id),limit=+p.creditLimit||0;return `<tr class="${p.archived?'archived-row':''}"><td><button class="link" data-act="party-open" data-id="${p.id}"><b>${esc(p.name)}</b></button><div class="metric-sub">${esc(p.phone||'No phone')}${p.archived?' · Archived':''}</div></td><td>${esc(p.type||'')}<div class="metric-sub">${esc(p.city||'')}</div></td><td>${rules.length?`<span class="status info">${rules.length} custom rule${rules.length>1?'s':''}</span>`:'<span class="status">General rates</span>'}</td><td class="r num ${bal>0?'bad':'mut'}"><b>${bal?CUR()+money(Math.abs(bal))+(bal<0?' adv':''):'—'}</b></td><td>${limit?`<span class="${bal>limit?'bad':''}">${CUR()}${money(limit)}</span>`:'<span class="mut">No limit</span>'}<div class="metric-sub">${p.creditDays??S.settings.creditDays} days</div></td><td class="r row-actions"><button class="btn ghost sm" data-act="party-quote" data-id="${p.id}">+ Quote</button> <button class="link" data-act="party-rules" data-id="${p.id}">Rates</button> · <button class="link" data-act="edit-party" data-id="${p.id}">Edit</button> · <button class="link" data-act="${p.archived?'unarchive-party':'del-party'}" data-id="${p.id}">${p.archived?'restore':'archive'}</button></td></tr>`}).join('')}
      </tbody></table></div>`:`<div class="card"><div class="bd empty"><b>No ${ui.showArchived?'':'active '}parties</b>Add your first customer to create rates, quotations and khata.</div></div>`;
  };

  function viewRateMatrix(v,t,sub,act){
    ensureProState();
    t.textContent='Customer rate matrix';
    sub.textContent='See base rate → customer rate and set exceptions without editing the master list';
    const party=partyOf(ui.rateParty)||activeParties()[0];
    if(party&&!ui.rateParty) ui.rateParty=party.id;
    act.innerHTML=party?`<button class="btn ghost sm" data-act="party-rules" data-id="${party.id}">Pricing rules</button><button class="btn primary sm" data-act="party-list" data-id="${party.id}">Customer price list</button>`:'';
    const q=(ui.rateQ||'').toLowerCase(),cat=ui.rateCat||'';
    let products=S.products.filter(p=>(!q||(p.code+' '+p.name+' '+p.category).toLowerCase().includes(q))&&(!cat||p.category===cat));
    const total=products.length; products=products.slice(0,ui.rateLimit);
    const filters=`<div class="filters"><select id="RM_party" style="min-width:220px"><option value="">Select party</option>${activeParties().map(p=>`<option value="${p.id}" ${party&&p.id===party.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input type="search" id="RM_q" value="${esc(ui.rateQ)}" placeholder="Search code, product or category"><select id="RM_cat"><option value="">All categories</option>${categories().map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`;
    let body='<div class="card"><div class="bd empty"><b>Select a party</b>Customer-specific rates will appear here.</div></div>';
    if(party){
      const rows=products.map(p=>{
        const r=priceOf(p,profileFor(party.id));
        const pr=S.rules.find(x=>x.party===party.id&&x.scope==='product'&&String(x.target).toUpperCase()===String(p.code).toUpperCase());
        const source=r.rule?`<span class="status info">${esc(ruleLabel(r.rule))}</span>`:'<span class="status">Base rate</span>';
        return `<tr><td class="num mut">${esc(p.code)}</td><td><b>${esc(p.name)}</b><div class="metric-sub">${esc(p.size||'')} · ${esc(p.category||'')}</div></td><td class="r num">${p.price==null?'—':CUR()+money(p.price)}</td><td class="price-source">${source}</td><td class="r"><input class="inline-rate num" data-rate-product="${p.id}" value="${r.net==null?'':r.net}" ${p.price==null?'disabled':''}></td><td class="r"><button class="link" data-act="rate-inherit" data-id="${p.id}" ${pr?'':'disabled'}>inherit</button></td></tr>`;
      }).join('');
      const more=total>products.length?`<div style="margin-top:10px;text-align:center"><button class="btn ghost sm" data-act="rate-more">Show more (${total-products.length} left)</button></div>`:'';
      body=`<div class="warning-strip"><b>${esc(party.name)}</b> — type a net rate to create a fixed product-level customer rate. “Inherit” removes only that product override and falls back to the customer/category/general rule.</div><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Product</th><th class="r">Base</th><th>Applied pricing</th><th class="r">Customer net</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${more}`;
    }
    v.innerHTML=filters+body;
    const ps=$('#RM_party'),qs=$('#RM_q'),cs=$('#RM_cat');
    if(ps) ps.onchange=e=>{ui.rateParty=e.target.value;render()};
    if(qs) qs.onchange=e=>{ui.rateQ=e.target.value;render()};
    if(cs) cs.onchange=e=>{ui.rateCat=e.target.value;render()};
    v.querySelectorAll('[data-rate-product]').forEach(inp=>inp.onchange=e=>{
      const p=S.products.find(x=>x.id===e.target.dataset.rateProduct),val=nz(e.target.value);
      if(!p||val==null) return toast('Enter a valid rate');
      let r=S.rules.find(x=>x.party===party.id&&x.scope==='product'&&String(x.target).toUpperCase()===String(p.code).toUpperCase());
      if(r){r.type='set';r.value=val;r.off=false}else S.rules.push({id:uid(),scope:'product',target:p.code,type:'set',value:val,party:party.id,off:false});
      audit('rate-override',`${party.name}: ${p.code} fixed at ${CUR()}${money(val)}`); save(); toast('Customer rate saved'); render();
    });
  }

  viewQuote=function(v,t,sub,act){
    ensureProState(); const Q=quoteDefaults(),T=quoteTotals(),party=partyOf(Q.party); const saved=Q.savedId?(S.quotes||[]).find(q=>q.id===Q.savedId):null; t.textContent=saved?`Quotation ${saved.no}`:'New quotation'; sub.textContent=`${T.rows.length} items · ${CUR()}${money(T.total)}`;
    act.innerHTML=`<button class="btn ghost sm" data-act="quote-clear">New / clear</button><button class="btn ghost sm" data-act="quote-save">Save</button><button class="btn ghost sm" data-act="quote-wa">WhatsApp</button><button class="btn ghost sm" data-act="quote-pdf">PDF</button><button class="btn primary sm" data-act="quote-bill">Make bill</button>`;
    const shortage=T.rows.filter(r=>(+r.p.stock||0)<r.qty);
    v.innerHTML=`
      <div class="quote-meta">
        <div class="field"><label>Party</label><select id="Q_party"><option value="">Select customer</option>${activeParties().map(p=>`<option value="${p.id}" ${Q.party===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Extra deal discount %</label><input id="Q_extra" class="num" value="${esc(Q.extraPct||'')}" placeholder="on top of customer rate"></div>
        <div class="field"><label>Validity (days)</label><input id="Q_valid" class="num" value="${Q.validDays||7}"></div>
        <div class="field"><label>GST</label><select id="Q_gst"><option value="0" ${!Q.gst?'selected':''}>Without GST</option><option value="1" ${Q.gst?'selected':''}>Add GST</option></select></div>
      </div>
      <div class="filters"><input type="search" id="Q_add" placeholder="Search product code or name and press Enter" style="min-width:360px" list="qlist"><datalist id="qlist">${S.products.filter(p=>!p.status||['active','on demand'].includes(p.status)).slice(0,1000).map(p=>`<option value="${esc(p.code)} — ${esc(p.name)}">`).join('')}</datalist>${party?`<span class="status info">${esc(party.name)} rates</span>`:''}${saved?`<span class="status ${saved.status==='Sent'?'good':'info'}">${esc(saved.status||'Draft')}</span>`:''}</div>

  /* ---------- validation layer for dynamically-created modals ---------- */
  function enhanceModal(modal){

  /* ---------- cooperative PDF import: pdf.js worker + yield between pages ---------- */
  parsePriceListPDF=async function(file,onProgress){
    if(!window.pdfjsLib)throw new Error('PDF reader could not load. Check the internet connection, or import a CSV instead.');

      const recs=recordsFromPage(items,vp.width,state);if(recs.length)all=all.concat(recordsToProducts(recs,catalog).map(x=>({...x,page:p})));if(onProgress)onProgress(p,pdf.numPages);

  };

  viewSet=function(v,t,sub){previousViewSet(v,t,sub);const box=document.createElement('div');box.className='card';box.style.marginTop='14px';box.innerHTML=`<div class="hd"><h2>Architecture & performance</h2></div><div class="bd"><div class="cols2"><div><b>Virtual inventory rendering</b><div class="note">Only visible rows plus a small buffer are mounted in the DOM.</div></div><div><b>Central state dispatcher</b><div class="note">Inventory mutations route through PriceManagerStore for consistent saving/history.</div></div><div><b>Native validation</b><div class="note">Required and numeric constraints are applied to dynamic data-entry dialogs.</div></div><div><b>Responsive PDF import</b><div class="note">pdf.js worker remains active and the main thread yields after every parsed page.</div></div></div><div class="note" style="margin-top:10px">${PM_VERSION_23} · single-file portable build. Cloud sync remains adapter-based so credentials are never embedded in this HTML.</div></div>`;v.appendChild(box)};

  render=function(){return previousRender()};

<script id="pm-v25-price-intelligence-script">

  function currentCost(p){try{return window.PriceManagerAPI&&window.PriceManagerAPI.costCalc?window.PriceManagerAPI.costCalc(p):fallbackCost(p)}catch(e){return fallbackCost(p)}}

async function runBulk28(){

<script id="pm-v30-list-exclude-script">
(()=>{
  const PM_VERSION_30 = '2.10 List builder — exclude products';

  function ensure30(){
    ui.list = ui.list || {};
    if(!Array.isArray(ui.list.excluded)) ui.list.excluded = [];
    if(ui.list.exSearch == null) ui.list.exSearch = '';
  }

  /* Everything that matches the current filters, before exclusions are applied.
     Used by the search/restore panel so a removed product can still be found again. */
  const listItemsBeforeExclude30 = listItems;
  function matchedBeforeExclude30(){ ensure30(); return listItemsBeforeExclude30(); }

  listItems = function(){
    ensure30();
    const base = listItemsBeforeExclude30();
    if(!ui.list.excluded.length) return base;
    const ex = new Set(ui.list.excluded);
    return base.filter(p => !ex.has(p.id));
  };

  const prevViewList30 = viewList;
  viewList = function(v,t,sub,act){
    ensure30();
    prevViewList30(v,t,sub,act);
    const L = ui.list;
    const allMatching = matchedBeforeExclude30();
    const exSet = new Set(L.excluded);
    const excludedProducts = allMatching.filter(p => exSet.has(p.id));

    /* Add a small "remove from this list" link beside every visible rate/reset row,
       wherever the current viewList build renders one (id may be on `data-list-rate`
       or, on simpler builds, there is no per-row rate editor at all). */
    v.querySelectorAll('[data-list-rate]').forEach(inp=>{
      const id = inp.dataset.listRate;
      const row = inp.closest('tr');
      const actionCell = row ? row.lastElementChild : null;
      if(actionCell && !actionCell.querySelector('[data-act="list-exclude"]')){
        const b = document.createElement('button');
        b.className = 'link'; b.dataset.act = 'list-exclude'; b.dataset.id = id;
        b.style.marginLeft = '8px'; b.style.color = 'var(--kumkum)';
        b.textContent = 'remove';
        actionCell.appendChild(b);
      }
    });

    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginTop = '14px';
    card.innerHTML = `
      <div class="hd"><h2>Exclude products from this list</h2><div class="spacer"></div>
        ${excludedProducts.length ? `<span class="tag">${excludedProducts.length} removed</span>` : ''}</div>
      <div class="bd">
        <div class="note" style="margin-bottom:8px">Removing a product here only affects this printed/downloaded list. Stock and the product master are not touched, and other price lists are unaffected.</div>
        <input type="search" id="LX_q" placeholder="Search a product to remove or restore" value="${esc(L.exSearch)}" style="width:100%;margin-bottom:8px">
        <div id="LX_results" style="max-height:240px;overflow:auto"></div>
        ${excludedProducts.length ? `<div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span class="note">${excludedProducts.length} product${excludedProducts.length===1?'':'s'} removed from this list</span>
          <button class="btn ghost sm" data-act="list-exclude-restore-all">Restore all</button></div>` : ''}
      </div>`;

    const splitEl = v.querySelector('.split');
    const firstCard = splitEl ? splitEl.firstElementChild : null;
    if(firstCard) firstCard.appendChild(card); else v.appendChild(card);

    const renderResults = ()=>{
      const q = (L.exSearch||'').toLowerCase().trim();
      let list = allMatching;
      if(q) list = list.filter(p => (p.name+' '+p.code+' '+(p.size||'')).toLowerCase().includes(q));
      list = list.slice(0, 60);
      const box = card.querySelector('#LX_results');
      box.innerHTML = list.length ? list.map(p=>{
        const isOut = exSet.has(p.id);
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)} <span class="mut">${esc(p.code)}</span></span>
          <button class="link" data-act="${isOut?'list-exclude-restore':'list-exclude'}" data-id="${p.id}" style="flex:none;${isOut?'':'color:var(--kumkum)'}">${isOut?'restore':'remove'}</button>
        </div>`;
      }).join('') : (q ? '<div class="note">No match.</div>' : '<div class="note">Type to find a product.</div>');
    };
    renderResults();
    card.querySelector('#LX_q').oninput = e=>{ L.exSearch = e.target.value; renderResults(); };
  };

  /* Changing to a different price list makes the old exclusions stale — clear them
     the same way the existing code already clears the category picks on catalog change. */
  document.addEventListener('change', e=>{
    if(e.target && e.target.id === 'L_catalog'){ ensure30(); ui.list.excluded = []; }
  }, true);

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="list-exclude"],[data-act="list-exclude-restore"],[data-act="list-exclude-restore-all"]');
    if(!b) return;
    ensure30();
    const a = b.dataset.act, id = b.dataset.id;
    if(a === 'list-exclude'){ if(!ui.list.excluded.includes(id)) ui.list.excluded.push(id); }
    else if(a === 'list-exclude-restore'){ ui.list.excluded = ui.list.excluded.filter(x=>x!==id); }
    else if(a === 'list-exclude-restore-all'){ ui.list.excluded = []; }
    render();
  }, true);

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_30};
})();
</script>
<script id="pm-v31-units-and-fixes-script">
(()=>{
  const PM_VERSION_31 = '2.11 Per-piece rates, WhatsApp fix, autosave guard';

  /* ---------- fix: correct WhatsApp number normalisation ----------
     The old pattern (`.replace(/^(?!91)/,'91')`) skipped adding the country
     code whenever the raw 10-digit number itself happened to start with the
     digits "91" (e.g. 9166xxxxxx, 9198xxxxxx — both real Indian mobile
     ranges), producing a 10-digit wa.me link that WhatsApp rejects.
     Fix: always work from the last 10 digits, then prefix 91 once. */
  window.waPhone30 = function(phone){
    let digits = String(phone||'').replace(/\D/g,'');
    digits = digits.replace(/^0+/,'');
    if(digits.length > 10) digits = digits.slice(-10);
    if(digits.length === 10) digits = '91' + digits;
    return digits;
  };

  /* ---------- fix: warn before closing/reloading with unsaved changes ---------- */
  window.addEventListener('beforeunload', (e)=>{
    if(typeof dirty !== 'undefined' && dirty){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ---------- feature: per-piece rate conversion for customer price lists ----------
     Dozen-priced and Kg-priced items are common in this catalog (agarbatti/dhoop
     sold per dozen sticks, hawan samagri sold per kg but packed in small pouches).
     A retailer buying single packets often wants the per-piece price, not the
     wholesale unit price. This converts only where the conversion factor is
     unambiguous (Doz = 12; Kg uses the pack weight already on the product) and
     leaves everything else exactly as it was. */
  function sizeGrams30(size){
    const s = String(size||'').trim();
    let m = s.match(/^([\d.]+)\s*(kg)\b/i); if(m) return parseFloat(m[1]) * 1000;
    m = s.match(/^([\d.]+)\s*(gm|gms|g)\b/i); if(m) return parseFloat(m[1]);
    return null;
  }
  function perPieceFactor30(p){
    const u = String(p.priceUnit||'').trim().toLowerCase();
    if(u === 'doz' || u === 'dozen') return 1/12;
    if(u === 'kg'){ const g = sizeGrams30(p.size); if(g) return g/1000; }
    return null;
  }
  function parseRateCell30(cell){
    if(typeof cell !== 'string') return null;
    const m = cell.match(/[\d,]+(\.\d+)?/);
    return m ? parseFloat(m[0].replace(/,/g,'')) : null;
  }

  ui.list = ui.list || {};
  if(ui.list.perPiece30 == null) ui.list.perPiece30 = false;

  const prevListConfig30 = listConfig;
  listConfig = function(){
    return prevListConfig30(); // global per-piece toggle retired -- see the per-product "price list unit" setting instead
  };

  const prevViewList31 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList31(v,t,sub,act);
    // old global per-piece checkbox retired -- see the per-product "units" dialog instead
  };

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_31, waPhone: window.waPhone30, perPieceFactor: perPieceFactor30};
})();
</script>
<script id="pm-v32-workflow-script">
(()=>{
  const PM_VERSION_32 = '2.12 Version regen, party column presets, fresh start, today panel';
  const d2 = ts => ts ? new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';

  /* ---------- item 6 (continued): costPeriods also reads S.costHistory directly,
     bypassing the costCalc guard, so it needs its own staff check. SEC lives in a
     different closure, so we use the same staff-chip the UI already renders as the
     signal -- it is present in the DOM for the whole staff session. ---------- */
  function isStaffSession32(){ return !!document.querySelector('.staff-chip'); }
  if(window.PriceManagerAPI && window.PriceManagerAPI.costPeriods){
    const realCostPeriods = window.PriceManagerAPI.costPeriods;
    window.PriceManagerAPI.costPeriods = function(p){
      if(isStaffSession32()) return [];
      return realCostPeriods(p);
    };
  }

  /* ---------- item 2: regenerate an old price-list version as a real PDF ----------
     The saved version only stores productId/code/name/rate (the rate frozen at
     generation time). Category, size, packing, MRP etc. are pulled from the current
     product record -- those rarely change -- while the rate itself always comes
     from the snapshot, so what gets printed is exactly what was sent back then. */
  window.regenerateVersionPDF = function(versionId){
    const v = (S.priceListVersions||[]).find(x=>x.id===versionId);
    if(!v) return toast('That version could not be found');
    const cols = v.customerCols || (ui.list && ui.list.customerCols) || {code:true,size:true,packing:true,mrp:true};
    const defs = [];
    if(cols.code) defs.push(['code','Code','left',1]);
    defs.push(['name','Product','left',3.8]);
    if(cols.size) defs.push(['size','Size','left',1.2]);
    if(cols.packing) defs.push(['packing','Packing','left',2.2]);
    if(cols.barcode) defs.push(['barcode','Barcode','left',1.3]);
    if(cols.netWt) defs.push(['netWt','Net Wt','right',0.8]);
    if(cols.mrp) defs.push(['mrp','MRP','right',1]);
    defs.push(['final','Rate','right',1.25]);
    const columns = defs.map(([key,label,align,w])=>({key,label,align,w,bold:key==='final'}));
    const groups = []; let cur = null;
    (v.items||[]).forEach(vi=>{
      const p = S.products.find(x=>x.id===vi.productId) || (findByCode ? findByCode(vi.code) : null) || {};
      const category = p.category || 'Other';
      if(!cur || cur.name !== category){ cur = {name:category, rows:[]}; groups.push(cur); }
      const map = {
        code: vi.code || p.code || '',
        name: vi.name || p.name || '',
        size: p.size || '',
        packing: p.packing || '',
        barcode: p.barcode || '',
        netWt: p.netWt || '',
        mrp: p.mrp ? S.settings.currency+money(p.mrp) : '—',
        final: vi.rate == null ? '—' : S.settings.currency+money(vi.rate) + (p.priceUnit ? '/'+p.priceUnit : '')
      };
      cur.rows.push(columns.map(c=>map[c.key]));
    });
    const st = S.settings;
    const party = v.partyId ? S.parties.find(x=>x.id===v.partyId) : null;
    const cfg = {
      columns, groups, landscape: v.landscape!=null ? v.landscape : true, firm: st.firm,
      meta: [st.address, st.phone, st.email, st.gstin?'GSTIN '+st.gstin:''].filter(Boolean).join('  ·  '),
      title: v.title || 'Price list',
      count: (v.items||[]).length,
      sub: [(party?party.name:v.partyName)?'For '+(party?party.name:v.partyName):'', 'Archived copy · originally generated '+d2(v.at), v.catalog||''].filter(Boolean).join('  ·  '),
      footer: st.footer
    };
    try{
      buildPDF(cfg).save((v.filename||'price-list-archive').replace(/\.pdf$/i,'')+'-regenerated.pdf');
      toast('Recreated the '+d2(v.at)+' price list');
    }catch(e){
      if(typeof htmlDoc==='function') download('price-list-archive.html', htmlDoc(cfg), 'text/html');
      toast(e.message||'Could not rebuild that version');
    }
  };

  /* ---------- item 3: remember a party's preferred columns for next time ---------- */
  document.addEventListener('change', e=>{
    if(e.target && e.target.id === 'L_party'){
      const party = S.parties.find(p => p.id === e.target.value);
      if(party && party.listCols){
        ui.list.customerCols = {...party.listCols};
        toast('Using the saved column layout for ' + party.name);
        render();
      }
    }
  }, true);

  document.addEventListener('click', e=>{
    const save = e.target.closest('[data-act="save-party-cols"]');
    if(save){
      const party = S.parties.find(p => p.id === (ui.list && ui.list.party));
      if(!party) return toast('Pick a party first');
      party.listCols = {...ui.list.customerCols};
      save2();
      toast('Saved as the default columns for ' + party.name);
      render();
      return;
    }
    const forget = e.target.closest('[data-act="forget-party-cols"]');
    if(forget){
      const party = S.parties.find(p => p.id === (ui.list && ui.list.party));
      if(party){ delete party.listCols; save2(); toast('Removed the saved layout for ' + party.name); render(); }
      return;
    }
  }, true);
  function save2(){ if(typeof save === 'function') save(); }

  const prevViewList32 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList32(v,t,sub,act);
    const colsLabel = [...v.querySelectorAll('.field label')].find(l => /Visible customer columns/i.test(l.textContent));
    const field = colsLabel ? colsLabel.closest('.field') : null;
    if(!field || field.querySelector('[data-act="save-party-cols"]')) return;
    const party = S.parties.find(p => p.id === (ui.list && ui.list.party));
    const row = document.createElement('div');
    row.style.marginTop = '6px';
    if(party){
      row.innerHTML = party.listCols
        ? `<span class="note">Using ${esc(party.name)}'s saved columns · <button class="link" data-act="save-party-cols">update</button> · <button class="link" data-act="forget-party-cols">forget</button></span>`
        : `<button class="link" data-act="save-party-cols">Save these columns as ${esc(party.name)}'s default</button>`;
      field.appendChild(row);
    }
  };

  /* ---------- item 4: let the existing owner clear the sample catalog and start fresh ---------- */
  function isStillSample32(){
    return (S.imports||[]).length === 1 && S.imports[0].catalog === 'sample import'
      && !(S.invoices||[]).length && !(S.parties||[]).length && !(S.quotes||[]).length;
  }
  window.clearSampleData30 = function(){
    const used = new Set();
    (S.invoices||[]).forEach(inv => (inv.items||[]).forEach(i => used.add(i.id)));
    (S.quotes||[]).forEach(q => (q.items||[]).forEach(i => used.add(i.id)));
    const blocked = S.products.filter(p => p.isSample && used.has(p.id));
    if(blocked.length) return toast(blocked.length + ' sample product(s) are already used on a bill or quotation — remove those first');
    if(!confirm('Remove all sample products and start with an empty catalog? Import your own price list PDF right after.')) return;
    S.products = S.products.filter(p => !p.isSample);
    S.settings.dismissedSampleBanner = true;
    save2();
    render();
    toast('Sample catalog cleared');
  };
  window.dismissSampleBanner30 = function(){
    S.settings.dismissedSampleBanner = true;
    save2();
    render();
  };

  /* ---------- item 5: a compact "today" panel on the dashboard ---------- */
  function todayStats32(){
    const low = S.products.filter(p => +p.minStock>0 && (+p.stock||0) <= +p.minStock).length;
    const openInv = (S.invoices||[]).filter(i => !i.cancelled && invDue(i) > 0.5);
    const overdue = openInv.filter(i => overdueDays(i) > 0);
    const overdueAmt = overdue.reduce((a,i) => a + invDue(i), 0);
    const pendingQ = (S.quotes||[]).filter(q => q.status !== 'Converted').length;
    const weekAgo = Date.now() - 7*86400000;
    const recentChanges = (S.history||[]).filter(h => h.at > weekAgo).length;
    return {low, overdueCount: overdue.length, overdueAmt, pendingQ, recentChanges};
  }
  const prevViewDash32 = viewDash;
  viewDash = function(v,t,sub,act){
    prevViewDash32(v,t,sub,act);
    if(!isStillSample32() || !S.settings.dismissedSampleBanner){
      if(isStillSample32() && !S.settings.dismissedSampleBanner){
        const banner = document.createElement('div');
        banner.className = 'card';
        banner.style.marginBottom = '14px';
        banner.innerHTML = `<div class="bd" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><b>This catalog is sample data</b><div class="note">${S.products.length} Rangoli/Pooja products came pre-loaded so you could try the app. Clear them and import your own price list whenever you're ready.</div></div>
          <div style="display:flex;gap:8px;flex:none"><button class="btn ghost sm" onclick="dismissSampleBanner30()">Keep it, it's fine</button><button class="btn primary sm" onclick="clearSampleData30()">Clear sample data</button></div>
        </div>`;
        v.insertBefore(banner, v.firstChild);
      }
    }
    const st = todayStats32();
    const items = [
      {n: st.low, label: 'low stock', nav: 'inv', tone: st.low ? 'bad' : ''},
      {n: st.overdueCount, label: 'bills overdue' + (st.overdueAmt ? ' · '+S.settings.currency+money(st.overdueAmt) : ''), nav: 'bills', tone: st.overdueCount ? 'bad' : ''},
      {n: st.pendingQ, label: 'quotations pending', nav: 'quote', tone: ''},
      {n: st.recentChanges, label: 'rate changes this week', nav: 'hist', tone: ''}
    ];
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '14px';
    card.innerHTML = `<div class="hd"><h2>Today</h2></div><div class="bd">
      <div class="grid stats">${items.map(it=>`
        <button class="stat ${it.tone}" style="text-align:left;cursor:pointer;border:1px solid var(--line)" data-nav="${it.nav}">
          <b class="num">${it.n}</b><span>${esc(it.label)}</span>
        </button>`).join('')}</div></div>`;
    v.insertBefore(card, v.firstChild);
  };

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_32};
})();
</script>
<script id="pm-v34-uom-share-script">
(()=>{
  const PM_VERSION_34 = '2.14 UOM master, share register, active-only lists';

  /* ================= status filter: price lists default to active-only ================= */
  ui.list = ui.list || {};
  if(ui.list.includeOnDemand == null) ui.list.includeOnDemand = false;
  if(ui.list.includeComingSoon == null) ui.list.includeComingSoon = false;

  const prevListItemsStatus34 = listItems;
  listItems = function(){
    const base = prevListItemsStatus34();
    const L = ui.list;
    return base.filter(p=>{
      const st = p.status || 'active';
      if(st === 'active') return true;
      if(st === 'on demand') return L.includeOnDemand;
      if(st === 'coming soon') return L.includeComingSoon;
      return false; // discontinued and anything else stays out unless explicitly requested
    });
  };

  const prevViewList34 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList34(v,t,sub,act);
    const anchor = v.querySelector('#L_stock');
    if(anchor && !v.querySelector('#L_onDemand')){
      const stockLabelEl = anchor.closest('label');
      if(stockLabelEl){
        const wrap = document.createElement('div');
        wrap.innerHTML = `<label class="note" style="display:block;margin-top:4px"><input type="checkbox" id="L_onDemand" ${ui.list.includeOnDemand?'checked':''}> Also include "on demand" products</label><label class="note" style="display:block;margin-top:2px"><input type="checkbox" id="L_comingSoon" ${ui.list.includeComingSoon?'checked':''}> Also include "coming soon" products</label>`;
        stockLabelEl.after(...wrap.children);
      }
    }
  };
  document.addEventListener('change', e=>{
    if(e.target && e.target.id === 'L_onDemand'){ ui.list.includeOnDemand = e.target.checked; render(); }
    if(e.target && e.target.id === 'L_comingSoon'){ ui.list.includeComingSoon = e.target.checked; render(); }
  }, true);

  /* ================= UOM / packing conversion master ================= */
  const PIECE_UNITS = new Set(['pc','pcs','piece','pieces','']);
  function isPieceUnit34(u){ return PIECE_UNITS.has(String(u||'').trim().toLowerCase()); }
  function guessPerUnit34(p){
    const u = String(p.priceUnit||'').trim().toLowerCase();
    if(u==='doz'||u==='dozen') return 12;
    if(u==='kg'){ const s=String(p.size||'').trim(); const m=s.match(/^([\d.]+)\s*(gm|gms|g)\b/i); if(m){ const g=parseFloat(m[1]); return g>0?Math.round((1000/g)*100)/100:null; } return null; }
    const m = String(p.packing||'').match(/(?:x|X|×)\s*(\d+)/);
    return m ? parseInt(m[1],10) : null;
  }
  window.piecesPerUnit34 = function(p){
    if(p.uom && p.uom.perUnit) return p.uom.perUnit;
    return guessPerUnit34(p);
  };
  window.uomSourceLabel34 = function(p){
    if(p.uom && p.uom.perUnit) return 'confirmed';
    const g = guessPerUnit34(p);
    return g ? 'guessed from packing' : 'not set';
  };

  window.bulkGuessUom34 = function(){
    const targets = S.products.filter(p=>!isPieceUnit34(p.priceUnit) && (!p.uom || !p.uom.perUnit));
    let filled = 0;
    targets.forEach(p=>{
      const g = guessPerUnit34(p);
      if(g){ p.uom = {perUnit: g, source: 'guessed'}; filled++; }
    });
    if(!filled) return toast('Nothing could be auto-filled — packing text did not have a clear "A X B" pattern. Fill these in one by one on each product.');
    save();
    render();
    toast(filled + ' products filled from their packing text — please skim through and correct any that look wrong');
  };

  const prevOpenProduct34 = openProduct;
  openProduct = function(p, isNew){
    prevOpenProduct34(p, isNew);
    if(isPieceUnit34(p.priceUnit)) return;
    const box = [...document.querySelectorAll('.modal .box')].pop();
    if(!box || box.querySelector('#e_uom') || box.querySelector('#e_pcsPerUnit')) return;
    const priceField = [...box.querySelectorAll('.field')].find(f => f.querySelector('#e_price'));
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const guess = guessPerUnit34(p);
    const current = p.uom && p.uom.perUnit;
    wrap.innerHTML = `<label>Pieces per ${esc(p.priceUnit||'unit')}</label>
      <input id="e_uom" class="num" value="${current || ''}" placeholder="${guess ? 'guessed: '+guess : 'e.g. 12'}">`;
    if(priceField && priceField.parentElement) priceField.parentElement.after(wrap);
    else box.querySelector('.bd').appendChild(wrap);
    const saveBtn = box.querySelector('[data-x="save"]');
    if(saveBtn){
      saveBtn.addEventListener('click', ()=>{
        const val = nz(box.querySelector('#e_uom') ? box.querySelector('#e_uom').value : '');
        if(val && val>0) p.uom = {perUnit: val, source: 'manual'};
      }, true); // capture: runs before the base save handler removes/reads the modal
    }
  };

  /* extend the price list's "show per-piece rate" conversion to use the confirmed/guessed
     UOM master for every unit type, not just Dozen/Kg */
  const prevListConfig34 = listConfig;
  listConfig = function(){
    return prevListConfig34(); // global per-piece toggle retired -- see the per-product "price list unit" setting instead
  };

  /* ================= price-list share register ================= */
  S.shareLog = S.shareLog || [];
  function logShare34(channel){
    const L = ui.list || {};
    const party = L.party ? S.parties.find(x=>x.id===L.party) : null;
    const latestVersion = (S.priceListVersions||[])[0];
    const linked = latestVersion && (Date.now()-latestVersion.at) < 4000 ? latestVersion.id : null;
    S.shareLog.unshift({
      id: uid(), at: Date.now(), partyId: L.party||'', partyName: party?party.name:'General list',
      catalog: L.catalog||'All price lists', channel, versionId: linked
    });
    if(S.shareLog.length>300) S.shareLog.length=300;
    save();
  }
  window.logShare34 = logShare34;
  const prevHandleAct34 = handleAct;
  handleAct = function(a, el){
    const r = prevHandleAct34(a, el);
    if(a==='make-pdf' || a==='make-html') logShare34(a==='make-pdf' ? 'pdf download' : 'html download');
    if(a==='c29-download') logShare34('whatsapp card (download)');
    if(a==='c29-share') logShare34('whatsapp card (share)');
    return r;
  };

  function shareChangedSince34(entry){
    if(!entry.versionId) return null;
    const v = (S.priceListVersions||[]).find(x=>x.id===entry.versionId);
    if(!v) return null;
    const prof = window.PriceManagerAPI && window.PriceManagerAPI.pricing26 ? null : null;
    let changed = 0;
    (v.items||[]).forEach(vi=>{
      const p = S.products.find(x=>x.id===vi.productId);
      if(!p) return;
      let now;
      try{ now = window.PriceManagerAPI.pricing26(p, entry.partyId||'', 1, 0).final; }catch(e){ now = priceOf(p, profileFor(entry.partyId||'')).net; }
      if(now!=null && vi.rate!=null && Math.abs(now-vi.rate)>0.009) changed++;
    });
    return changed;
  }

  window.resendShare34 = function(entryId){
    const entry = S.shareLog.find(x=>x.id===entryId);
    if(!entry) return;
    if(entry.versionId){ window.regenerateVersionPDF(entry.versionId); logShare34('resend'); }
    else toast('No saved snapshot for this entry — make a fresh price list instead');
  };

  const prevVHFn34 = window.versionHistoryDialog;
  // versionHistoryDialog is private to its own module and not reachable here, so the share
  // register gets its own compact panel instead, opened from the price-list screen.
  window.shareRegisterDialog34 = function(){
    const m = document.createElement('div'); m.className='modal';
    const rows = (S.shareLog||[]).slice(0,150);
    m.innerHTML = `<div class="box" style="max-width:900px"><div class="hd"><h2 style="margin:0">Price-list share register</h2><div class="spacer"></div><span class="note">${rows.length} sent</span></div>
    <div class="bd">
      <div class="note" style="margin-bottom:8px">Every time a price list PDF, web page, or WhatsApp card is generated, it is logged here — so you always know what was last sent to whom.</div>
      ${rows.length? `<div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th>When</th><th>Party</th><th>Price list</th><th>Channel</th><th>Since sent</th><th></th></tr></thead><tbody>
        ${rows.map(r=>{
          const changed = shareChangedSince34(r);
          return `<tr><td>${new Date(r.at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})}<div class="metric-sub">${new Date(r.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></td>
          <td><b>${esc(r.partyName)}</b></td><td>${esc(r.catalog)}</td><td><span class="tag">${esc(r.channel)}</span></td>
          <td>${changed==null?'—':changed>0?`<span class="tag bad">${changed} rate(s) changed</span>`:'<span class="tag">unchanged</span>'}</td>
          <td class="r">${r.versionId?`<button class="link" onclick="resendShare34('${r.id}')">resend</button>`:''}</td></tr>`;
        }).join('')}
      </tbody></table></div>` : '<div class="empty"><b>Nothing sent yet</b>Generate a price-list PDF or WhatsApp card and it will show up here.</div>'}
    </div><div class="ft"><button class="btn primary" data-x="close">Close</button></div></div>`;
    document.body.appendChild(m);
    m.onclick = e=>{ const b=e.target.closest('[data-x]'); if(b&&b.dataset.x==='close') m.remove(); else if(e.target===m) m.remove(); };
  };

  const prevViewList34b = viewList;
  viewList = function(v,t,sub,act){
    prevViewList34b(v,t,sub,act);
    if(act && !act.querySelector('[data-act="share-register"]')){
      const b = document.createElement('button');
      b.className = 'btn ghost sm'; b.dataset.act = 'share-register'; b.textContent = 'Share register';
      act.appendChild(b);
    }
  };
  document.addEventListener('click', e=>{
    if(e.target.closest('[data-act="share-register"]')) window.shareRegisterDialog34();
  }, true);

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_34};
})();
</script>
<script id="pm-v33-uom-share-decimal-script">
(()=>{
  const PM_VERSION_33 = '2.13 UOM master, share register, exact price-list decimals';

  // localISODate30 is initialized before the early state migrations in <head>.

  /* ================= exact 2-decimal price-list rates ================= */
  /* Discounts naturally land on odd paise (e.g. 8% off 115 = 105.80). The
     global rounding setting is meant for billing, not for a rate sheet you
     might hand-round yourself. This shows the exact figure on price lists,
     always to 2 decimal places, and can be switched back to the normal
     rounded display per list if you want it. */
  function money2dp33(n){
    if(n==null||isNaN(n)) return '—';
    return (Math.round(n*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  window.money2dp33 = money2dp33;
  ui.list = ui.list || {};
  if(ui.list.exactDecimal30 == null) ui.list.exactDecimal30 = true;

  const prevListConfig33 = listConfig;
  listConfig = function(){
    if(!ui.list.exactDecimal30) return prevListConfig33();
    const savedRounding = S.settings.rounding;
    S.settings.rounding = 'none';
    let cfg;
    try{ cfg = prevListConfig33(); } finally { S.settings.rounding = savedRounding; }
    const finalIdx = cfg.columns.findIndex(c=>c.key==='final');
    if(finalIdx>=0){
      cfg.groups.forEach(g=>g.rows.forEach(row=>{
        const cell = row[finalIdx];
        if(typeof cell !== 'string') return;
        const m = cell.match(/[\d,]+(\.\d+)?/);
        if(!m) return;
        row[finalIdx] = cell.replace(m[0], money2dp33(parseFloat(m[0].replace(/,/g,''))));
      }));
    }
    return cfg;
  };

  const prevViewList33c = viewList;
  viewList = function(v,t,sub,act){
    prevViewList33c(v,t,sub,act);
    const perPieceLabel0 = [...v.querySelectorAll('label')].find(l=>/Show per-piece rate/i.test(l.textContent));
    if(perPieceLabel0 && !document.getElementById('L_exactDecimal30')){
      const dw = document.createElement('label');
      dw.className = 'note'; dw.style.display = 'block'; dw.style.marginTop = '4px';
      dw.innerHTML = `<input type="checkbox" id="L_exactDecimal30" ${ui.list.exactDecimal30?'checked':''}> Show the exact discounted price (2 decimals) instead of rounding it`;
      perPieceLabel0.before(dw);
      dw.querySelector('#L_exactDecimal30').onchange = e=>{ ui.list.exactDecimal30 = e.target.checked; render(); };
    }
  };


  /* Per product: how many base pieces make up each named unit, e.g.
     { unit:'Box', pcsPerUnit:16 }, { unit:'Carton', pcsPerUnit:320 }.
     Kept separate from the price-list's Dozen/Kg heuristic -- when a
     structured entry exists here it always wins; the heuristic is only
     a fallback for products nobody has set up yet. */
  function uomList30(productId){ return (S.uomMaster||[]).filter(x=>x.productId===productId); }
  function uomFactor30(productId, unit){
    const row = uomList30(productId).find(x=>x.unit.toLowerCase()===String(unit||'').toLowerCase());
    return row ? row.pcsPerUnit : null;
  }
  function suggestUom30(p){
    const out = [];
    const pack = String(p.packing||'');
    // "1 Box X 16 Pcs", "20 BOX X 10 Bottle", "1 Tray X 8 Bottle" etc.
    let m = pack.match(/1\s*(box|tray|jar|pack|set|dibbi|bottle|packet)\s*x\s*(\d+)/i);
    if(m) out.push({unit: m[1][0].toUpperCase()+m[1].slice(1).toLowerCase(), pcsPerUnit: +m[2]});
    // "20 BOX" alone with no inner count -- not enough info, skip
    const u = String(p.priceUnit||'').trim().toLowerCase();
    if(u==='doz'||u==='dozen') out.push({unit:'Dozen', pcsPerUnit:12});
    if(u==='kg'){ const g = sizeGrams30ForUom(p.size); if(g) out.push({unit:'Kg', pcsPerUnit: Math.round(1000/g*100)/100}); }
    return out;
  }
  function sizeGrams30ForUom(size){
    const s = String(size||'').trim();
    let m = s.match(/^([\d.]+)\s*(kg)\b/i); if(m) return parseFloat(m[1])*1000;
    m = s.match(/^([\d.]+)\s*(gm|gms|g)\b/i); if(m) return parseFloat(m[1]);
    return null;
  }

  function uomDialog30(productId){
    const p = S.products.find(x=>x.id===productId); if(!p) return;
    S.uomMaster = S.uomMaster || [];
    const m = document.createElement('div'); m.className = 'modal';
    const draw = ()=>{
      const rows = uomList30(productId);
      const suggestions = suggestUom30(p).filter(s=>!rows.some(r=>r.unit.toLowerCase()===s.unit.toLowerCase()));
      m.innerHTML = `<div class="box" style="max-width:560px"><div class="hd"><div><h2 style="margin:0">Unit conversions · ${esc(p.code)}</h2><div class="note">${esc(p.name)} — base rate is per ${esc(p.priceUnit||'unit')}</div></div></div>
      <div class="bd">
        <table><thead><tr><th>Unit</th><th class="r">= how many pieces</th><th></th></tr></thead><tbody>
        ${rows.length?rows.map(r=>`<tr><td><b>${esc(r.unit)}</b></td><td class="r num">${r.pcsPerUnit}</td><td class="r"><button class="link" data-del-uom="${r.id}">remove</button></td></tr>`).join(''):'<tr><td colspan="3" class="empty-mini">No units defined yet.</td></tr>'}
        </tbody></table>
        ${suggestions.length?`<div class="note" style="margin-top:10px">Guessed from packing/size — check and add:</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${suggestions.map(s=>`<button class="btn ghost sm" data-add-suggest="${esc(s.unit)}" data-pcs="${s.pcsPerUnit}">${esc(s.unit)} = ${s.pcsPerUnit} pcs</button>`).join('')}</div>`:''}
        <div class="section-title" style="margin-top:14px">Add a unit</div>
        <div class="cols3"><div class="field"><label>Unit name</label><input id="U30_unit" placeholder="Box, Carton, Dozen…"></div>
        <div class="field"><label>= how many pieces</label><input id="U30_pcs" type="number" min="0.01" step="0.01"></div>
        <div class="field" style="justify-content:flex-end"><button class="btn primary" data-x="add">Add</button></div></div>
      </div>
      <div class="ft"><button class="btn ghost" data-x="close">Close</button></div></div>`;
    };
    document.body.appendChild(m); draw();
    m.onclick = e=>{
      const del = e.target.closest('[data-del-uom]');
      if(del){ S.uomMaster = S.uomMaster.filter(x=>x.id!==del.dataset.delUom); save(); draw(); return; }
      const sug = e.target.closest('[data-add-suggest]');
      if(sug){ S.uomMaster.push({id:uid(), productId, unit:sug.dataset.addSuggest, pcsPerUnit:+sug.dataset.pcs}); save(); draw(); return; }
      const b = e.target.closest('[data-x]');
      if(!b){ if(e.target===m) m.remove(); return; }
      if(b.dataset.x==='close') return m.remove();
      if(b.dataset.x==='add'){
        const unit = m.querySelector('#U30_unit').value.trim(), pcs = nz(m.querySelector('#U30_pcs').value);
        if(!unit) return toast('Name the unit');
        if(!pcs || pcs<=0) return toast('Enter how many pieces that unit equals');
        if(uomList30(productId).some(x=>x.unit.toLowerCase()===unit.toLowerCase())) return toast('That unit is already defined — remove it first to change it');
        S.uomMaster.push({id:uid(), productId, unit, pcsPerUnit:pcs});
        save(); draw();
      }
    };
  }
  window.uomDialog30 = uomDialog30;

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="uom-edit"]');
    if(b) uomDialog30(b.dataset.id);
  }, true);

  /* Add a small "units" link next to each product row in Inventory */
  const prevViewInv33 = viewInv;
  viewInv = function(v,t,sub,act){
    prevViewInv33(v,t,sub,act);
    v.querySelectorAll('tr[data-id]').forEach(row=>{
      const id = row.dataset.id;
      const editLink = [...row.querySelectorAll('button.link')].find(b=>/^edit$/i.test(b.textContent.trim()));
      if(editLink && !row.querySelector('[data-act="uom-edit"]')){
        const b = document.createElement('button');
        b.className='link'; b.dataset.act='uom-edit'; b.dataset.id=id; b.style.marginLeft='6px';
        b.textContent='units';
        editLink.after(document.createTextNode(' · '), b);
      }
    });
  };

  /* Extend the price-list "per-piece" conversion into a full unit picker
     that prefers the structured UOM master, falling back to the existing
     Dozen/Kg heuristic (perPieceFactor30, from the v2.11 layer) when a
     product has no master entry. */
  ui.list.targetUnit30 = ui.list.targetUnit30 || ''; // '' = leave as-is / use the plain per-piece toggle

  function convFactorFor30(p, targetUnit){
    if(!targetUnit) return null;
    if(targetUnit==='Pc'){
      const f = uomFactor30(p.id, p.priceUnit);
      if(f) return f; // e.g. base is "Box", convert Box-rate to per-piece using master
      if(typeof window.PriceManagerAPI?.perPieceFactor==='function'){ const h = window.PriceManagerAPI.perPieceFactor(p); if(h) return 1/h; } // heuristic returns rate multiplier, invert to pcs-per-unit shape
      return null;
    }
    return uomFactor30(p.id, targetUnit);
  }

  const prevListConfig33b = listConfig;
  listConfig = function(){
    return prevListConfig33b(); // global target-unit dropdown retired -- see the per-product "price list unit" setting instead
  };

  const prevViewList33 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList33(v,t,sub,act);
    // old global target-unit dropdown retired -- see the per-product "units" dialog instead
  };

  /* ================= share register ================= */
  S.shareLog = S.shareLog || [];

  function lastShare30(partyId){
    return (S.shareLog||[]).filter(x=>x.partyId===partyId).sort((a,b)=>b.at-a.at)[0] || null;
  }
  function changedSince30(partyId){
    const last = lastShare30(partyId);
    if(!last || !last.versionId) return null;
    const version = (S.priceListVersions||[]).find(x=>x.id===last.versionId);
    if(!version) return null;
    const prof = (typeof profileFor==='function') ? profileFor(partyId) : {rules:S.rules};
    let changed = 0;
    (version.items||[]).forEach(vi=>{
      const p = S.products.find(x=>x.id===vi.productId);
      if(!p) return;
      const now = (typeof priceOf==='function') ? priceOf(p, prof).net : null;
      if(now!=null && vi.rate!=null && Math.abs(now - vi.rate) > 0.009) changed++;
    });
    return changed;
  }

  function logSendDialog30(){
    const L = ui.list;
    const party = S.parties.find(p=>p.id===L.party);
    const m = document.createElement('div'); m.className='modal';
    m.innerHTML = `<div class="box" style="max-width:440px"><div class="hd"><h2 style="margin:0">Log this price list as sent</h2></div>
    <div class="bd">

<script id="pm-v34-more-fixes-script">
(()=>{
  const PM_VERSION_34 = '2.14 status filters, single standing discount, stock moves, future-payment guard';

  /* NOTE: an "active/on-demand/coming-soon" filter with its own UI toggles
     already exists earlier in the file (search "includeOnDemand") — it is
     more complete than a first draft added here, so nothing is added for
     that in this layer. Kept as a comment so this is not rediscovered as a
     gap by a future pass. */
  /* Quotation product search: only offer active products by default */
  document.addEventListener('focus', e=>{
    const el = e.target;
    if(el && el.id === 'Q_add'){
      const dl = document.getElementById('qlist');
      if(dl && !dl.dataset.filtered34){
        const active = S.products.filter(p => !p.status || p.status==='active');
        dl.innerHTML = active.slice(0,900).map(p=>`<option value="${esc(p.code)} — ${esc(p.name)}">`).join('');
        dl.dataset.filtered34 = '1';
      }
    }
  }, true);

  /* ---------- fix: archived party must not get a working "+ Quote" shortcut ---------- */
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="party-quote"]');
    if(!b) return;
    const party = S.parties.find(p=>p.id===b.dataset.id);
    if(party && party.archived){
      e.stopImmediatePropagation(); e.preventDefault();
      toast('This party is archived — restore them first to make a new quotation');
    }
  }, true);
  const prevViewParty34 = viewParty;
  if(typeof prevViewParty34 === 'function'){
    viewParty = function(v,t,sub,act){
      prevViewParty34(v,t,sub,act);
      v.querySelectorAll('tr.archived-row [data-act="party-quote"]').forEach(b=>{
        b.disabled = true; b.title = 'Archived — restore to quote';
        b.style.opacity = '.5'; b.style.cursor = 'not-allowed';
      });
    };
  }

  /* ---------- fix: one standing discount per party, not a growing pile ----------
     Every time a party is saved with a "standing discount %", the old code pushed
     a brand new scope:'all' rule instead of updating the existing one. Cleaning
     this up on every save() means whichever rule was written last (the one the
     owner just set) is the one that survives, and stale earlier pushes disappear. */
  const prevSave34 = save;
  save = function(){
    const lastIndexForParty = {};
    (S.rules||[]).forEach((r,i)=>{ if(r.scope==='all' && !r.target && r.party) lastIndexForParty[r.party] = i; });
    S.rules = (S.rules||[]).filter((r,i)=>{
      if(r.scope==='all' && !r.target && r.party) return lastIndexForParty[r.party] === i;
      return true;
    });
    return prevSave34();
  };

  /* ---------- fix: validate discount values so a typo cannot become a price increase ---------- */
  function validRuleValue30(type, value){
    if(value==null || isNaN(value)) return 'Enter a number';
    if(type==='pct' && (value<0 || value>100)) return 'Percentage discount must be between 0 and 100';
    if(type==='flat' && value<0) return 'Amount off cannot be negative';
    if(type==='set' && value<0) return 'Fixed rate cannot be negative';
    return null;
  }
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-x="add"]');
    if(!b) return;
    const box = b.closest('.box');
    const typeSel = box && box.querySelector('#r_type');
    const valInput = box && box.querySelector('#r_value');
    if(!typeSel || !valInput) return;
    const err = validRuleValue30(typeSel.value, nz(valInput.value));
    if(err){ e.stopImmediatePropagation(); e.preventDefault(); toast(err); }
  }, true);
  document.addEventListener('click', e=>{
    const b = e.target.closest('.modal [data-x="save"]');
    if(!b) return;
    const box = b.closest('.box');
    const dtypeSel = box && box.querySelector('#e_dtype');
    const dvalInput = box && box.querySelector('#e_dval');
    if(dtypeSel && dtypeSel.value && dvalInput){
      const err = validRuleValue30(dtypeSel.value, nz(dvalInput.value));
      if(err){ e.stopImmediatePropagation(); e.preventDefault(); toast(err); }
    }
  }, true);

  /* ---------- fix: sale invoices should leave a stock-movement trail like every other stock event ---------- */
  const prevQuoteToInvoice34 = quoteToInvoice;
  quoteToInvoice = function(){
    const before = new Set((S.invoices||[]).map(x=>x.id));
    const out = prevQuoteToInvoice34();
    const inv = (S.invoices||[]).find(x=>!before.has(x.id));
    if(inv){
      S.stockMoves = S.stockMoves || [];
      (inv.items||[]).forEach(i=>{
        const p = S.products.find(x=>x.id===i.id);
        const after = p ? (+p.stock||0) : null;
        const beforeQty = after!=null ? after + (+i.qty||0) : null;
        S.stockMoves.unshift({id:uid(), at:inv.date||Date.now(), productId:i.id, code:i.code, type:'Sale', qty:-(+i.qty||0), before:beforeQty, after, ref:inv.no, party:inv.partyName});
      });
      save();
    }
    return out;
  };
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="bill-cancel"]');
    if(!b) return;
    setTimeout(()=>{
      const inv = (S.invoices||[]).find(x=>x.id===b.dataset.id);
      if(!inv) return;
      S.stockMoves = S.stockMoves || [];
      const already = S.stockMoves.some(m=>m.ref===inv.no && m.type===(inv.cancelled?'Sale cancelled':'Sale restored') && Math.abs(m.at-Date.now())<2000);
      if(already) return;
      (inv.items||[]).forEach(i=>{
        const p = S.products.find(x=>x.id===i.id);
        const after = p ? (+p.stock||0) : null;
        const beforeQty = after!=null ? (inv.cancelled ? after - (+i.qty||0) : after + (+i.qty||0)) : null;
        S.stockMoves.unshift({id:uid(), at:Date.now(), productId:i.id, code:i.code, type: inv.cancelled?'Sale cancelled':'Sale restored', qty: inv.cancelled?(+i.qty||0):-(+i.qty||0), before:beforeQty, after, ref:inv.no, party:inv.partyName});
      });
      save();
    }, 60);
  }, true);

  /* ---------- fix: a future-dated payment should not reduce today's outstanding yet ---------- */
  const prevPartyBalance34 = partyBalance;
  partyBalance = function(pid){
    const party = partyOf(pid); if(!party) return 0;
    const bills = (S.invoices||[]).filter(i=>i.partyId===pid && !i.cancelled).reduce((a,i)=>a+i.total,0);
    const paid = (S.payments||[]).filter(p=>p.partyId===pid && p.date<=Date.now()).reduce((a,p)=>a+p.amount,0);
    return Math.round(((+party.openingBalance||0) + bills - paid)*100)/100;
  };
  const prevGetLedger34 = getLedger;
  getLedger = function(pid, from, to){
    const result = prevGetLedger34(pid, from, to);
    if(!result) return result;
    // annotate future-dated payment rows so the ledger UI can show them distinctly
    result.rows.forEach(r=>{ if(r.type==='Payment' && r.date>Date.now()) r.futureDated = true; });
    return result;
  };


  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_34};
})();
</script>
<script id="pm-v35-final-fixes-script">
(()=>{
  const PM_VERSION_35 = '2.15 owner-approval PIN limiter, scheduled-rate guard, return-date bounds, GSTIN check, paid-cancel warning';

  /* ---------- fix: brute-force limiter on the Owner Approval PIN, not just the lock screen ---------- */
  let oaAttempts30 = 0, oaBlockedUntil30 = 0;
  document.addEventListener('click', e=>{
    const b = e.target.closest('.modal [data-x="approve"]');
    if(!b) return;
    const box = b.closest('.box');
    if(!box || !box.querySelector('#oa_pin')) return;
    const now = Date.now();
    if(now < oaBlockedUntil30){
      e.stopImmediatePropagation(); e.preventDefault();
      const msg = box.querySelector('#oa_msg');
      if(msg) msg.textContent = 'Too many wrong PINs. Try again in ' + Math.ceil((oaBlockedUntil30-now)/1000) + ' seconds.';
      return;
    }
  }, true);
  // Count failures by watching for the existing "Incorrect owner PIN" message the dialog already shows.
  document.addEventListener('click', e=>{
    const b = e.target.closest('.modal [data-x="approve"]');
    if(!b) return;
    const box = b.closest('.box');
    if(!box || !box.querySelector('#oa_pin')) return;
    setTimeout(()=>{
      const msg = box.querySelector('#oa_msg');
      if(msg && /incorrect/i.test(msg.textContent||'')){
        oaAttempts30++;
        if(oaAttempts30 >= 5){ oaBlockedUntil30 = Date.now() + 30000; oaAttempts30 = 0; msg.textContent = 'Locked for 30 seconds after repeated incorrect PINs.'; }
      } else if(!document.body.contains(box)) {
        oaAttempts30 = 0; // dialog closed (success or cancel) -- reset the counter
      }
    }, 220);
  }, true);

  /* ---------- fix: apply due scheduled rates right before a sale commits, not only on the next render ---------- */
  const prevQuoteToInvoice35 = quoteToInvoice;
  quoteToInvoice = function(){
    render(); // harmless extra render; as a side effect this also runs applyScheduled26() if that layer is present
    return prevQuoteToInvoice35();
  };

  /* ---------- fix: purchase return date must fall between the purchase date and today ---------- */
  document.addEventListener('change', e=>{
    if(e.target && e.target.id === 'PR28_date'){
      const box = e.target.closest('.box');
      const todayStr = localISODate30 ? localISODate30() : new Date().toISOString().slice(0,10);
      if(e.target.value > todayStr){ toast('Return date cannot be in the future'); e.target.value = todayStr; }
    }
  }, true);
  document.addEventListener('click', e=>{
    const b = e.target.closest('.modal [data-x="save"]');
    if(!b) return;
    const dateInput = b.closest('.box') && b.closest('.box').querySelector('#PR28_date');
    if(!dateInput) return;
    const todayStr = localISODate30 ? localISODate30() : new Date().toISOString().slice(0,10);
    if(dateInput.value > todayStr){ e.stopImmediatePropagation(); e.preventDefault(); toast('Return date cannot be in the future'); }
  }, true);

  /* ---------- fix: warn about basic GSTIN format when saving a party ---------- */
  function validGstinFormat30(g){
    return /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z][Z][0-9A-Z]$/.test(g);
  }
  document.addEventListener('click', e=>{
    const b = e.target.closest('.modal [data-x="save"]');
    if(!b) return;
    const box = b.closest('.box');
    const gstinInput = box && box.querySelector('#p_gstin');
    if(!gstinInput) return;
    const g = gstinInput.value.trim().toUpperCase();
    if(g && !validGstinFormat30(g)){
      if(!confirm('This GSTIN does not look like a standard 15-character GSTIN. Save it anyway?')){
        e.stopImmediatePropagation(); e.preventDefault();
      }
    }
  }, true);

  /* ---------- fix: warn before cancelling a bill that already has payments allocated to it ---------- */
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="bill-cancel"]');
    if(!b) return;
    if(b.__skipPaidWarning30){ b.__skipPaidWarning30 = false; return; } // this exact click was already confirmed -- let it through
    const inv = (S.invoices||[]).find(x=>x.id===b.dataset.id);
    if(!inv || inv.cancelled) return;
    const paid = (S.payments||[]).reduce((sum,p)=>sum + (p.allocations||[]).filter(a=>a.invId===inv.id).reduce((s,a)=>s+(+a.amt||0),0), 0);
    if(paid > 0.5){
      e.stopImmediatePropagation(); e.preventDefault();
      if(confirm(`${inv.no} already has ${S.settings.currency}${money(paid)} paid against it. Cancelling will leave that amount sitting as an advance on the party's khata — it will NOT be refunded automatically. Continue?`)){
        b.__skipPaidWarning30 = true;
        b.click();
      }
    }
  }, true);

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_35};
})();
</script>

<script id="pm-v39-backup-reminder-script">
(()=>{
  const PM_VERSION_39 = '2.18 backup reminder — nudges to save a copy off the device';
  const DAY = 86400000;

  /* Stamp every successful backup download, from whichever button triggers it
     (Settings page "Backup" and any other spot that reuses the same action). */
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act="backup"]');
    if(!b) return;
    S.settings.lastBackupAt = Date.now();
    S.settings.backupSnoozeUntil = 0;
    save();
  }, true);

  function backupAge(){
    if(!S.settings.lastBackupAt) return Infinity;
    return Date.now() - S.settings.lastBackupAt;
  }
  function snoozed(){
    return S.settings.backupSnoozeUntil && Date.now() < S.settings.backupSnoozeUntil;
  }

  const prevViewDash39 = viewDash;
  viewDash = function(v,t,sub,act){
    prevViewDash39(v,t,sub,act);
    const hasData = S.products.length || (S.parties||[]).length || (S.invoices||[]).length;
    if(!hasData || snoozed() || backupAge() < 7*DAY) return;

    const never = !S.settings.lastBackupAt;
    const banner = document.createElement('div');
    banner.className = 'card';
    banner.style.cssText = 'margin-bottom:14px;border-color:#F0DDB6';
    banner.innerHTML = `<div class="bd" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#FFFBF3">
      <div>
        <b>${never ? "You haven't taken a backup yet" : "It's been a week since your last backup"}</b>
        <div class="note" style="margin-top:2px">This app only saves data on this device. Download a backup and save it somewhere else too — email it to yourself, WhatsApp it to yourself, or drop it in Google Drive. If this device is lost or its data is cleared, that copy is the only way back.</div>
      </div>
      <div style="display:flex;gap:8px;flex:none">
        <button class="btn ghost sm" data-act="backup-snooze-39">Remind me in 3 days</button>
        <button class="btn primary sm" data-act="backup">Download backup now</button>
      </div>
    </div>`;
    v.insertBefore(banner, v.firstChild);
  };

  document.addEventListener('click', e=>{
    if(e.target.closest('[data-act="backup-snooze-39"]')){
      S.settings.backupSnoozeUntil = Date.now() + 3*DAY;
      save(); render();
    }
  }, true);

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_39};
})();
</script>
<script id="pm-v40-data-folder-script">
(()=>{
  const PM_VERSION_40 = '2.19 optional data folder — writes a live copy to a folder on this computer/pendrive';
  const supported = 'showDirectoryPicker' in window;
  const FILE_NAME = 'tota-price-manager-data.json';
  const HANDLE_KEY = 'dataFolderHandle';
  let cachedHandle = null;

  async function getSavedHandle(){
    if(cachedHandle) return cachedHandle;
    try{ const r = await window.storage.get(HANDLE_KEY); return r ? r.value : null; }catch(e){ return null; }
  }
  async function permissionState(handle){
    try{ return await handle.queryPermission({mode:'readwrite'}); }catch(e){ return 'denied'; }
  }
  async function writeToFolder(handle){
    const fileHandle = await handle.getFileHandle(FILE_NAME, {create:true});
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(S, null, 1));
    await w.close();
  }

  window.chooseDataFolder30 = async function(){
    if(!supported) return toast('Your browser does not support this — works in Chrome or Edge only');
    if(S.settings.privacyEnabled) return toast('Turn off Privacy Mode first — folder sync would otherwise write unencrypted data outside this device');
    try{
      const handle = await window.showDirectoryPicker();
      const perm = await handle.requestPermission({mode:'readwrite'});
      if(perm !== 'granted') return toast('Permission not granted');
      cachedHandle = handle; // keep working for the rest of this session even if the line below has trouble
      await writeToFolder(handle);
      S.settings.dataFolderName = handle.name;
      S.settings.dataFolderSyncedAt = Date.now();
      save();
      try{ await window.storage.set(HANDLE_KEY, handle); }catch(e){ /* still works this session via cachedHandle */ }
      toast('Saving a live copy to "'+handle.name+'"');
      render();
    }catch(e){
      if(e.name !== 'AbortError') toast('Could not set up the folder: ' + e.message);
    }
  };

  window.forgetDataFolder30 = async function(){
    try{ await window.storage.remove(HANDLE_KEY); }catch(e){}
    delete S.settings.dataFolderName;
    delete S.settings.dataFolderSyncedAt;
    save(); render();

<script id="pm-v42-delete-safety-script">

    if((S.quotes||[]).some(q=>(q.items||[]).some(i=>i.productId===id))) found.push('saved quotations');
    if((S.invoices||[]).some(inv=>(inv.items||[]).some(i=>i.id===id))) found.push('past bills');
    if((S.quantityPriceSlabs||[]).some(x=>x.productId===id)) found.push('quantity slabs');
    if((S.customerRateLocks||[]).some(x=>x.productId===id)) found.push('customer rate locks');
    if((S.uomMaster||[]).some(x=>x.productId===id)) found.push('unit conversions');
    if((S.stockMoves||[]).some(x=>x.productId===id)) found.push('stock movement history');
    if((S.priceReviewQueue||[]).some(x=>x.productId===id||x.id===id)) found.push('price review history');
    if((S.supplierProductMap||[]).some(x=>x.productId===id)) found.push('supplier mappings');
    if((S.inventoryCost&&S.inventoryCost[id])||(S.purchaseCosts&&S.purchaseCosts[id])) found.push('cost history');
    for(const pb of (S.priceBooks||[])){for(const cfg of [pb.config,pb.scheduled230?.config].filter(Boolean)){for(const k of ['overrides','rateOnRequest230','productUoms227'])if(Object.prototype.hasOwnProperty.call(cfg?.[k]||{},id)){found.push('Price Book configuration');break}}}

  }
