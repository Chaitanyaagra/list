      if(heuristic) return Math.round((1/heuristic)*100)/100;         // invert to "pieces per unit"
    }
    return null;
  }
  window.piecesPerNativeUnit43 = piecesPerNativeUnit43;

  function availableUnitsFor43(p){
    const units = [];
    if(piecesPerNativeUnit43(p)) units.push('Pc');
    (S.uomMaster||[]).filter(x=>x.productId===p.id).forEach(x=>{ if(!units.includes(x.unit)) units.push(x.unit); });
    return units;
  }

  /* ---------- the one, final price-list conversion pass: purely per-product ---------- */
  const prevListConfig43 = listConfig;
  listConfig = function(){
    const cfg = prevListConfig43();
    const finalIdx = cfg.columns.findIndex(c=>c.key==='final');
    if(finalIdx<0) return cfg;
    const items = listItems();
    let idx = 0;
    cfg.groups.forEach(g=>g.rows.forEach(row=>{
      const p = items[idx++];
      if(!p || !p.priceListUnit) return; // nothing chosen for this product -- leave its native rate exactly as printed
      const target = p.priceListUnit;
      const rawMatch = String(row[finalIdx]||'').match(/[\d,]+(\.\d+)?/);
      if(!rawMatch) return;
      const raw = parseFloat(rawMatch[0].replace(/,/g,''));
      const nativePcs = piecesPerNativeUnit43(p);
      if(!nativePcs) return; // no way to convert this product safely -- leave as-is rather than guess
      const perPiece = raw / nativePcs;
      let converted, label;
      if(target === 'Pc'){ converted = perPiece; label = 'Pc'; }
      else{
        const targetPcs = uomFactorDirect43(p.id, target);
        if(!targetPcs) return;
        converted = perPiece * targetPcs; label = target;
      }
      converted = Math.max(0, Math.round(converted*100)/100);
      const fmt = (typeof money2dp33==='function' && ui.list.exactDecimal30!==false) ? money2dp33(converted) : money(converted);
      row[finalIdx] = S.settings.currency + fmt + '/' + label;
    }));
    return cfg;
  };

  /* ---------- per-product selector inside the existing "units" dialog ---------- */
  function injectPriceListUnitRow43(m, productId){
    if(m.querySelector('#U43_unit')) return;
    const p = S.products.find(x=>x.id===productId);
    if(!p) return;
    const bd = m.querySelector('.bd');
    if(!bd) return;
    const addRow = m.querySelector('.section-title');
    const units = availableUnitsFor43(p);
    const row = document.createElement('div');
    row.className = 'field';
    row.style.cssText = 'margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)';
    row.innerHTML = `<label>On the price list, show this product's rate as</label>
      <select id="U43_unit">
        <option value="">Native (${esc(p.priceUnit||'unit')}) — default</option>
        ${units.map(u=>`<option value="${esc(u)}" ${p.priceListUnit===u?'selected':''}>${esc(u)}</option>`).join('')}
      </select>
      ${!units.length?'<div class="note" style="margin-top:4px">Add a conversion above first (e.g. "Pc" or a suggested unit) to enable this.</div>':''}`;
    if(addRow) addRow.before(row); else bd.appendChild(row);
    row.querySelector('#U43_unit').onchange = e=>{
      p.priceListUnit = e.target.value || null;
      save();
      toast(e.target.value ? 'Price list will show '+p.code+' as /'+e.target.value : 'Price list will show '+p.code+' in its native unit');
    };
  }
  const prevUomDialog43 = window.uomDialog30;
  window.uomDialog30 = function(productId){
    prevUomDialog43(productId);
    setTimeout(()=>{
      const m = [...document.querySelectorAll('.modal')].pop();
      if(!m) return;
      injectPriceListUnitRow43(m, productId);
      // the base dialog replaces the WHOLE modal's innerHTML on every add/remove -- watch the modal itself
      const obs = new MutationObserver(()=>{
        if(!document.body.contains(m)){ obs.disconnect(); return; }
        injectPriceListUnitRow43(m, productId);
      });
      obs.observe(m, {childList:true, subtree:true});
    }, 20);
  };

  /* ---------- convenience: bulk-apply "Pc" to every Dozen/Kg product in one click,
     as an explicit, reviewable action rather than a silent global toggle ---------- */
  window.bulkApplyPerPiece43 = function(){
    const candidates = S.products.filter(p => !p.priceListUnit && piecesPerNativeUnit43(p) && ['doz','dozen','kg'].includes(String(p.priceUnit||'').trim().toLowerCase()));
    if(!candidates.length) return toast('No Dozen/Kg products without a price-list-unit setting were found');
    if(!confirm(`Set ${candidates.length} Dozen/Kg product(s) to show as per-piece on price lists? You can undo this for any single product from its "units" dialog.`)) return;
    candidates.forEach(p => { p.priceListUnit = 'Pc'; });
    save(); render();
    toast(candidates.length + ' product(s) set to per-piece');
  };

  const prevViewList43 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList43(v,t,sub,act);
    if(v.querySelector('#L_bulkPerPiece43')) return;
    const box = v.querySelector('#L_unitBox36') || v.querySelector('.card');
    if(!box) return;
    const bd = box.querySelector('.bd') || box;
    const note = document.createElement('div');
    note.style.marginTop = '8px';
    note.innerHTML = `<div class="note">Unit shown on the price list is set per product now (Inventory → "units"), not for the whole list at once.</div>
      <button id="L_bulkPerPiece43" class="btn ghost sm" style="margin-top:6px">Quick-apply: set per-piece for all Dozen/Kg products</button>`;
    bd.appendChild(note);
    note.querySelector('#L_bulkPerPiece43').onclick = window.bulkApplyPerPiece43;
  };

  /* ---------- small "→Pc" style badge in Inventory next to the "units" link ---------- */
  const prevViewInv43 = viewInv;
  viewInv = function(v,t,sub,act){
    prevViewInv43(v,t,sub,act);
    v.querySelectorAll('[data-act="uom-edit"]').forEach(link=>{
      const p = S.products.find(x=>x.id===link.dataset.id);
      if(p && p.priceListUnit && !link.nextSibling?.classList?.contains('tag')){
        const tag = document.createElement('span');
        tag.className = 'tag'; tag.style.marginLeft='4px'; tag.style.fontSize='10px';
        tag.textContent = '→' + p.priceListUnit;
        link.after(tag);
      }
    });
  };

  /* ================= Excel export for the price list ================= */
  window.downloadListExcel43 = function(){
    if(typeof XLSX === 'undefined') return toast('Excel library did not load — check your internet connection and reload');
    const cfg = listConfig();
    const header = cfg.columns.map(c=>c.label);
    const rows = [header];
    cfg.groups.forEach(g=>{
      if(g.name) rows.push([g.name]);
      g.rows.forEach(r=>rows.push(r));
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = cfg.columns.map(c=>({ wch: Math.max(10, Math.round((c.w||1)*9)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Price list');
    const name = (cfg.title||'price-list').replace(/[^\w\- ]+/g,'').trim() || 'price-list';
    XLSX.writeFile(wb, name + '.xlsx');
    if(typeof logShare34 === 'function') logShare34('excel download');
    toast('Excel file downloaded');
  };

  const prevViewList43b = viewList;
  viewList = function(v,t,sub,act){
    prevViewList43b(v,t,sub,act);
    if(act && !act.querySelector('[data-act="download-excel-43"]')){
      const btn = document.createElement('button');
      btn.className = 'btn ghost sm';
      btn.dataset.act = 'download-excel-43';
      btn.textContent = 'Download Excel';
      const pdfBtn = act.querySelector('[data-act="make-pdf"]');
      if(pdfBtn) pdfBtn.before(btn); else act.appendChild(btn);
    }
  };
  document.addEventListener('click', e=>{
    if(e.target.closest('[data-act="download-excel-43"]')) window.downloadListExcel43();
  }, true);

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_43};
})();
</script>
<script id="pm-v44-viewer-mode-script">
(()=>{
  const PM_VERSION_44 = '2.23 Price Books + restricted Viewer login (view/download only)';

  S.priceBooks = S.priceBooks || [];
  S.viewerUsers = S.viewerUsers || [];
  ui.viewerSession = ui.viewerSession || null;

  /* ================= Price Book: save/reuse a named price-list configuration ================= */
  const LIST_KEYS_44 = ['catalog','cats','party','excluded','customerCols','exactDecimal30','hideNoPrice','onlyStock','includeOnDemand','includeComingSoon','landscape','title','targetUnit30','extraPct','overrides','qtyBasis26','changedOnly26','productUoms227'];

  window.saveAsPriceBook44 = function(editId){
    const existing = editId ? S.priceBooks.find(x=>x.id===editId) : null;
    const name = prompt('Name this price book (e.g. "Wholesale - Rangoli", "Retail - Pooja")', existing ? existing.name : '');
    if(!name || !name.trim()) return;
    const existingCats = [...new Set(S.priceBooks.map(x=>x.category).filter(Boolean))];
    const suggestion = (existing && existing.category) || ui.list.catalog || existingCats[0] || '';
    const category = prompt('Category for this book (e.g. "Rangoli", "Pooja", "Holi", "Kapoor") — used to group books for viewers.'+(existingCats.length?'\nExisting categories: '+existingCats.join(', '):''), suggestion);
    if(category==null) return; // cancelled
    const cfg = {};
    LIST_KEYS_44.forEach(k=>{
      const v = ui.list[k];
      cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v==='object') ? {...v} : v;
    });
    if(existing){ existing.name = name.trim(); existing.category = category.trim()||'Other'; existing.config = cfg; existing.updatedAt = Date.now(); }
    else S.priceBooks.push({id:uid(), name:name.trim(), category: category.trim()||'Other', config:cfg, createdAt:Date.now()});
    save(); render();
    toast('Saved as "'+name.trim()+'"');

  window.loadPriceBook44 = function(id){
    const pb = S.priceBooks.find(x=>x.id===id);

    page = 'list'; render();
    toast('Loaded "'+pb.name+'" into the list builder');

  window.deletePriceBook44 = function(id){
    const pb = S.priceBooks.find(x=>x.id===id);

    S.priceBooks = S.priceBooks.filter(x=>x.id!==id);
    S.viewerUsers.forEach(u=>{ u.allowedPriceBookIds = (u.allowedPriceBookIds||[]).filter(pid=>pid!==id); });
    save(); render();
  };

  function priceBookListConfig44(pb){
    const saved = {};
    LIST_KEYS_44.forEach(k=>{ saved[k] = ui.list[k]; });
    Object.assign(ui.list, pb.config);
    let cfg;
    try{ cfg = listConfig(); } finally { Object.assign(ui.list, saved); }
    return cfg;
  }
  window.priceBookListConfig44 = priceBookListConfig44;

  window.downloadPriceBookPDF44 = function(id){
    const pb = S.priceBooks.find(x=>x.id===id); if(!pb) return;
    const cfg = priceBookListConfig44(pb);
    const safeName = pb.name.replace(/[^\w\- ]+/g,'').trim() || 'price-list';
    try{ buildPDF(cfg).save(safeName+'.pdf'); toast('Downloaded'); }
    catch(e){ download(safeName+'.html', htmlDoc(cfg), 'text/html'); toast('Downloaded (browser print format)'); }
  };
  window.downloadPriceBookExcel44 = function(id){
    const pb = S.priceBooks.find(x=>x.id===id); if(!pb) return;
    if(typeof XLSX === 'undefined') return toast('Excel library did not load — check your internet connection and reload');
    const cfg = priceBookListConfig44(pb);
    const rows = [cfg.columns.map(c=>c.label)];
    cfg.groups.forEach(g=>{ if(g.name) rows.push([g.name]); g.rows.forEach(r=>rows.push(r)); });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = cfg.columns.map(c=>({ wch: Math.max(10, Math.round((c.w||1)*9)) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Price list');
    const safeName = pb.name.replace(/[^\w\- ]+/g,'').trim() || 'price-list';
    XLSX.writeFile(wb, safeName+'.xlsx');
    toast('Downloaded');
  };

  /* Add a "Save as Price Book" button on the Make Price List screen */
  const prevViewList44 = viewList;
  viewList = function(v,t,sub,act){
    prevViewList44(v,t,sub,act);
    if(act && !act.querySelector('[data-act="save-pricebook-44"]')){
      const btn = document.createElement('button');
      btn.className = 'btn ghost sm'; btn.dataset.act = 'save-pricebook-44'; btn.textContent = 'Save as Price Book';
      act.appendChild(btn);
    }
  };
  document.addEventListener('click', e=>{
    if(e.target.closest('[data-act="save-pricebook-44"]')) window.saveAsPriceBook44();
  }, true);

  /* ================= Settings: manage Price Books + Viewer Users ================= */
  const prevViewSet44 = (typeof viewSet === 'function') ? viewSet : null;
  if(prevViewSet44){
    viewSet = function(v,t,sub,act){
      prevViewSet44(v,t,sub,act);
      // v2.28+: restricted-user management lives only in Users & access.
      // Keep the old code for data migration, but do not expose a second conflicting editor.
      if(window.__PM_SECURE_ACCESS_ONLY!==false) return;
      if(v.querySelector('#L_viewerBox44')) return;
      const box = document.createElement('div');
      box.className = 'card'; box.id = 'L_viewerBox44'; box.style.marginTop = '14px';
      const bookGroups = {};
      S.priceBooks.forEach(pb=>{ const cat = pb.category||'Other'; (bookGroups[cat]=bookGroups[cat]||[]).push(pb); });
      const catNames = Object.keys(bookGroups).sort();
      box.innerHTML = `<div class="hd"><h2>Price Books & Viewer logins</h2></div><div class="bd">
        <div class="note" style="margin-bottom:10px">Viewer logins can only see and download the Price Books you assign them — nothing else in this app. Build a list on "Make price list" first, then "Save as Price Book" there. Each book has a category (like "Rangoli", "Pooja", "Holi") so viewers see them grouped, not as one long list.</div>

        <div class="section-title">Price Books (${S.priceBooks.length})</div>
        ${S.priceBooks.length ? catNames.map(cat=>`
          <div style="margin-bottom:10px">
            <div class="metric-sub" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px">${esc(cat)}</div>
            <table><tbody>
              ${bookGroups[cat].map(pb=>`<tr><td>${esc(pb.name)}</td><td class="r">
                <button class="link" data-pb-load="${pb.id}">edit filters</button> ·
                <button class="link" data-pb-recat="${pb.id}">recategorise</button> ·
                <button class="link" data-pb-pdf="${pb.id}">PDF</button> ·
                <button class="link" data-pb-del="${pb.id}">delete</button>
              </td></tr>`).join('')}
            </tbody></table>
          </div>
        `).join('') : '<div class="empty-mini" style="margin-bottom:14px">No price books saved yet.</div>'}

        <div class="section-title">Viewer users (${S.viewerUsers.length})</div>
        <table style="margin-bottom:10px"><thead><tr><th>Name</th><th>Access</th><th></th></tr></thead><tbody>
          ${S.viewerUsers.length ? S.viewerUsers.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="metric-sub">PIN ${'•'.repeat(String(u.pin||'').length)}</div></td><td>${(u.allowedPriceBookIds||[]).map(id=>{const pb=S.priceBooks.find(x=>x.id===id); return pb?esc(pb.name):null}).filter(Boolean).join(', ')||'<span class="mut">none yet</span>'}${(u.allowedCatalogCategories||[]).length?' + catalog: '+u.allowedCatalogCategories.map(esc).join(', '):''}</td><td class="r"><button class="link" data-viewer-edit="${u.id}">edit</button> · <button class="link" data-viewer-del="${u.id}">remove</button></td></tr>`).join('') : '<tr><td colspan="3" class="empty-mini">No viewer users yet.</td></tr>'}
        </tbody></table>
        <button class="btn primary sm" data-act="add-viewer-44">Add viewer user</button>
        <div class="note" style="margin-top:10px">A viewer link is available from the sidebar ("Viewer login") and from the lock screen. Since this app runs entirely in the browser, treat this as a courtesy screen-lock for staff, not a hack-proof security boundary — anyone with real technical access to the device could still open developer tools.</div>
      </div>`;
      const anchor = v.querySelector('.card');
      if(anchor) anchor.after(box); else v.appendChild(box);
    };
  }

  function viewerEditorDialog44(userId){
    const existing = userId ? S.viewerUsers.find(x=>x.id===userId) : null;
    const bookGroups = {};
    S.priceBooks.forEach(pb=>{ const cat = pb.category||'Other'; (bookGroups[cat]=bookGroups[cat]||[]).push(pb); });
    const catalogCategories = [...new Set(S.products.map(p=>p.catalog).filter(Boolean))].sort();
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" style="max-width:480px"><div class="hd"><h2 style="margin:0">${existing?'Edit':'Add'} viewer user</h2></div>
      <div class="bd">
        <div class="cols2"><div class="field"><label>Name</label><input id="V44_name" value="${existing?esc(existing.name):''}"></div>
        <div class="field"><label>PIN</label><input id="V44_pin" inputmode="numeric" value="${existing?esc(existing.pin):''}" placeholder="e.g. 4821"></div></div>
        <div class="field"><label>Price books this user can see</label>
          ${Object.keys(bookGroups).length ? Object.keys(bookGroups).sort().map(cat=>`
            <div class="metric-sub" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:8px">${esc(cat)}</div>
            ${bookGroups[cat].map(pb=>`<label style="display:block;font-size:12.5px;margin-top:3px"><input type="checkbox" data-pb-check="${pb.id}" ${existing&&(existing.allowedPriceBookIds||[]).includes(pb.id)?'checked':''}> ${esc(pb.name)}</label>`).join('')}
          `).join('') : '<div class="note">No price books saved yet — create one from "Make price list" first.</div>'}
        </div>
        <div class="field" style="margin-top:10px"><label>Catalog categories this user can browse/download</label>
          ${catalogCategories.length ? catalogCategories.map(cat=>`<label style="display:block;font-size:12.5px;margin-top:3px"><input type="checkbox" data-cat-check="${esc(cat)}" ${existing&&(existing.allowedCatalogCategories||[]).includes(cat)?'checked':''}> ${esc(cat)}</label>`).join('') : '<div class="note">No catalogs found in inventory yet.</div>'}
        </div>
      </div>
      <div class="ft">${existing?'<button class="btn ghost" data-x="del">Remove user</button>':''}<button class="btn ghost" data-x="close">Cancel</button><button class="btn primary" data-x="save">Save</button></div></div>`;
    document.body.appendChild(m);
    m.onclick = e=>{
      const b = e.target.closest('[data-x]');
      if(!b){ if(e.target===m) m.remove(); return; }
      if(b.dataset.x==='close') return m.remove();

      if(b.dataset.x==='save'){

        else S.viewerUsers.push({id:uid(), name, pin, allowedPriceBookIds, allowedCatalogCategories, createdAt:Date.now()});
        save(); m.remove(); render();
        toast('Saved');
      }
    };
  }

  document.addEventListener('click', e=>{
    const loadBtn = e.target.closest('[data-pb-load]'); if(loadBtn) return window.loadPriceBook44(loadBtn.dataset.pbLoad);
    const pdfBtn = e.target.closest('[data-pb-pdf]'); if(pdfBtn) return window.downloadPriceBookPDF44(pdfBtn.dataset.pbPdf);
    const delBtn = e.target.closest('[data-pb-del]'); if(delBtn) return window.deletePriceBook44(delBtn.dataset.pbDel);

    if(recatBtn){
      const pb = S.priceBooks.find(x=>x.id===recatBtn.dataset.pbRecat);

    const vd = e.target.closest('[data-viewer-del]');
    if(vd){
      if(confirm('Remove this viewer user?')){ S.viewerUsers = S.viewerUsers.filter(x=>x.id!==vd.dataset.viewerDel); save(); render(); }

  }, true);

  /* ================= Viewer login + restricted read-only mode ================= */
  window.viewerLogin44 = function(name, pin){
    const lockEl = document.getElementById('pmLock');
    const isLocked = lockEl && !lockEl.hidden;
    if(!Array.isArray(S.viewerUsers) || isLocked){
      return toast('This device is locked. Ask the owner to unlock it first, then use Viewer login again.');
    }
    const u = S.viewerUsers.find(x => x.name.trim().toLowerCase()===String(name||'').trim().toLowerCase() && x.pin===String(pin||'').trim());
    if(!u) return toast('Name or PIN not recognised');
    ui.viewerSession = {userId: u.id};
    render();
  };
  window.viewerLogout44 = function(){
    ui.viewerSession = null;
    render();
  };

  function ensureViewerOverlay44(){
    let el = document.getElementById('viewerMode44');
    if(!el){
      el = document.createElement('div');
      el.id = 'viewerMode44';
      el.style.cssText = 'position:fixed;inset:0;background:var(--paper,#FBFAF7);z-index:100000;overflow-y:auto;overflow-x:hidden;';
      document.body.appendChild(el);
    }
    return el;
  }

  function catalogConfig44(category){
    const items = S.products.filter(p => p.catalog===category && (!p.status || p.status==='active')).sort((a,b)=>S.products.indexOf(a)-S.products.indexOf(b));
    const columns = [
      {key:'code', label:'Code', align:'left', w:1},
      {key:'name', label:'Product', align:'left', w:3.8},
      {key:'size', label:'Size', align:'left', w:1.2},
      {key:'packing', label:'Packing', align:'left', w:2.2},
      {key:'mrp', label:'MRP', align:'right', w:1, bold:true}
    ];
    const groups = []; let cur = null;
    items.forEach(p=>{
      if(!cur || cur.name !== p.category){ cur = {name:p.category||'Other', rows:[]}; groups.push(cur); }
      cur.rows.push([p.code, p.name, p.size||'', p.packing||'', p.mrp?S.settings.currency+money(p.mrp):'—']);
    });
    return { columns, groups, landscape:false, firm:S.settings.firm,
      meta:[S.settings.address, S.settings.phone].filter(Boolean).join('  ·  '),
      title: category+' Catalog', count: items.length, sub:'Catalog reference — MRP shown, no selling rate', footer:S.settings.footer };
  }
  window.downloadCatalogPDF44 = function(category){
    const cfg = catalogConfig44(category);
    try{ buildPDF(cfg).save(category.replace(/[^\w\- ]+/g,'').trim()+'-catalog.pdf'); toast('Downloaded'); }
    catch(e){ download(category+'-catalog.html', htmlDoc(cfg), 'text/html'); }
  };
  window.downloadCatalogExcel44 = function(category){

<script id="pm-v231-owner-tools">

  /* ================= 2) Bulk viewer import via pasted CSV ================= */
  function bulkImportDialog231(){

    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" style="max-width:640px"><div class="hd"><h2 style="margin:0">Bulk-create restricted logins</h2></div>
      <div class="bd">
        <div class="note" style="margin-bottom:8px">Paste rows as <b>name, pin, price book name</b> — one per line. The price book name must match a saved Price Book exactly (case-insensitive). Leave the third column blank to create the login without a Price Book assigned yet.</div>
        <textarea id="BULK231_text" rows="8" style="width:100%;font-family:monospace;font-size:12.5px" placeholder="Ramesh, 4821, Wholesale Rangoli
Suresh, 1234, Retail Pooja
Amit, 5566,"></textarea>

  }, true);

  /* ================= 3) revoke warning: 24h offline exposure note ================= */
  const modalObserver231 = new MutationObserver(muts => {
    muts.forEach(mut => mut.addedNodes.forEach(node => {
      if(!(node.nodeType === 1)) return;
      const modal = node.matches && node.matches('.modal') ? node : (node.querySelector ? node.querySelector('.modal') : null);
      if(!modal) return;

      const activeCb = modal.querySelector('#A45_active');

        const note = document.createElement('div');
        note.id = 'revokeWarn231';
        note.className = 'note';
        note.style.cssText = 'margin:-4px 0 8px 26px';
        note.textContent = 'If this device was used offline recently, it may keep showing cached rates for up to 24 hours after you turn this off — a fully offline device can\'t be reached to revoke instantly.';
        activeCb.closest('label').after(note);
      }

      // catalog upload: show a quick preview once a PDF is chosen
      const fileInput = modal.querySelector('#C47file');
      if(fileInput && !fileInput.dataset.preview231Wired){
        fileInput.dataset.preview231Wired = '1';
        fileInput.addEventListener('change', async () => {
          let box = modal.querySelector('#catalogPreview231');
          if(!box){

            box.innerHTML = '<b style="color:var(--kumkum-d)">This is not a PDF file.</b>';

            box.innerHTML = `<b>${esc(file.name)}</b> · ${(file.size/1024/1024).toFixed(2)} MB · ${doc.numPages} page(s)<div class="note" style="margin-top:4px">Confirm this is the right catalog before uploading.</div>`;

<script id="pm-v233-order-and-language">
(()=>{
  const PM_VERSION_233 = '2.76 private cart + locked order price context + smart viewer search';

  /* ================= shared helpers ================= */
  function inPreviewMode233(){ return !!window.__pmPreviewActive231; }
  function currentViewerSession233(){ return window.getCloudSession233 ? window.getCloudSession233() : null; }
  function currentViewerName233(){
    const cs=currentViewerSession233();
    const fromSession=String(cs?.loginName||cs?.payload?.user?.name||'').trim();
    if(fromSession) return fromSession;
    const el = document.querySelector('#cloudViewer46 .cv272-brand span, #cloudViewer46 .cv47-head .note');
    if(!el) return '';
    const m = el.textContent.match(/·\s*(.+?)(\s*·|$)/);
    return m ? m[1].trim() : '';
  }

  /* ================= 1) Order cart ================= */
  function cartIdentity233(){
    const cs=currentViewerSession233();
    if(cs?.uid && cs.uid!=='offline') return 'uid_'+String(cs.uid).replace(/[^a-zA-Z0-9_-]/g,'_');
    const n=String(cs?.loginName||cs?.payload?.user?.name||currentViewerName233()||'').trim().toLowerCase();
    return n ? 'name_'+n.replace(/[^a-z0-9._-]/g,'_') : 'anonymous';
  }
  function cartKey233(){ return 'pm-order-cart-233:' + cartIdentity233(); }
  function loadCart233(){ try{ const v=JSON.parse(localStorage.getItem(cartKey233())||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
  function saveCart233(cart){ try{ localStorage.setItem(cartKey233(), JSON.stringify(Array.isArray(cart)?cart:[])); }catch(e){} }
  function inferOrderMode233(book){
    if(typeof window.priceBookAudience283==='function')return window.priceBookAudience283(book);
    const explicit=String(book?.audience270||book?.audience||'').trim().toLowerCase();
    if(['retail','wholesale','custom'].includes(explicit)) return explicit;
    const t=String([book?.name,book?.category].filter(Boolean).join(' ')).toLowerCase();
    if(/wholesale|whole\s*sale|distributor|dealer|stockist|trade|bulk/.test(t))return'wholesale';
    if(/retail|consumer|counter|mrp/.test(t))return'retail';
    return'custom';
  }
  function cartContext233(cart=loadCart233()){
    const x=(cart||[])[0]||{};
    return {rateMode:String(x.rateMode||''),bookId:String(x.bookId||''),bookName:String(x.bookName||'')};
  }
  function sameOrderContext233(a,b){
    if(!a||!b)return true;
    if((b.rateMode||b.bookId) && (!a.rateMode||!a.bookId))return false; // legacy/missing context must never mix with a priced order
    if(a.rateMode&&b.rateMode&&a.rateMode!==b.rateMode)return false;
    if(a.bookId&&b.bookId&&a.bookId!==b.bookId)return false;
    return true;
  }
  window.guardOrderContext275=function(next={}){
    const cart=loadCart233();
    if(!cart.length)return true;
    const cur=cartContext233(cart),wanted={rateMode:String(next.rateMode||''),bookId:String(next.bookId||''),bookName:String(next.bookName||'')};
    if(sameOrderContext233(cur,wanted))return true;
    const curLabel=[cur.rateMode?cur.rateMode.toUpperCase():'',cur.bookName].filter(Boolean).join(' · ')||'current price list';
    const nextLabel=[wanted.rateMode?wanted.rateMode.toUpperCase():'',wanted.bookName].filter(Boolean).join(' · ')||'another price list';
    if(!confirm(`Your current order is locked to ${curLabel}.\n\nSwitching to ${nextLabel} will start a new empty order so rates cannot mix. Continue?`))return false;
    saveCart233([]); updateCartBar233(); return true;
  };

  window.orderRowExtra233 = function(r, i){
    if(inPreviewMode233()) return ''; // no ordering while the owner is just previewing
    return `<div class="ord233-add" style="margin-top:6px;display:flex;gap:6px;align-items:center">
      <input type="number" min="1" step="1" value="1" class="ord233-qty" data-ord233-qty="${i}" style="width:64px;padding:4px 6px;font-size:12.5px">
      <button class="btn ghost sm" data-ord233-add="${i}" style="padding:4px 10px;font-size:12px">+ Add to order</button>
    </div>`;
  };

  window.wireOrderRows233 = function(box, rows, p){
    if(inPreviewMode233()) return;
    box.querySelectorAll('[data-ord233-add]').forEach(btn => {
      btn.onclick = () => {
        const i = +btn.dataset.ord233Add;
        const r = rows[i]; if(!r||!r.it||!r.b)return;
        const qtyInput = box.querySelector(`[data-ord233-qty="${i}"]`);
        const qty = Math.max(1, Math.round(+qtyInput.value || 1));
        const uomSel = box.querySelector(`[data-uom47="${i}"]`);
        const uom = uomSel ? uomSel.value : r.it.defaultUom;
        let cart = loadCart233();
        const ctx={rateMode:inferOrderMode233(r.b),bookId:String(r.b.id||''),bookName:String(r.b.name||'')};
        if(cart.length&&!sameOrderContext233(cartContext233(cart),ctx)){
          if(!window.guardOrderContext275(ctx))return;
          cart=loadCart233();
        }
        const existing = cart.find(c => c.productId === r.it.id && c.uom === uom && String(c.bookId||'')===ctx.bookId && String(c.rateMode||'')===ctx.rateMode);
        const rawRate = r.it.rateOnRequest ? null : rawRate47safe(r.it, uom);
        if(existing) existing.qty += qty;
        else cart.push({
          productId: r.it.id, code: r.it.code, name: r.it.name, uom,
          rateOnRequest: !!r.it.rateOnRequest, rate: rawRate,
          rateText: r.it.rateOnRequest ? 'Rate on request' : selectedRate47safe(r.it, uom, p),
          bookId:ctx.bookId, bookName:ctx.bookName, rateMode:ctx.rateMode, qty
        });
        saveCart233(cart);
        updateCartBar233();
        toast(qty + ' × ' + r.it.code + ' added to your order');
      };
    });
  };
  // small local re-implementations to avoid depending on secure-access.js's private selectedRate()
  function selectedRate47safe(it, uom, p){
    const row = (it.uomRates||[]).find(x => x.u === uom) || (it.uomRates||[])[0];
    if(!row) return '';
    return (p.currency||'₹') + Number(row.r).toLocaleString('en-IN',{maximumFractionDigits:2}) + '/' + row.u;
  }
  function rawRate47safe(it, uom){
    const row = (it.uomRates||[]).find(x => x.u === uom) || (it.uomRates||[])[0];
    return row ? Number(row.r) : null;
  }

  function cartTotalQty233(){ return loadCart233().reduce((a,c)=>a+c.qty,0); }

  function ensureCartBar233(){
    let bar = document.getElementById('ord233Bar');
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'ord233Bar';
      bar.style.cssText = 'position:sticky;bottom:0;z-index:50;background:var(--ink,#151A22);color:#fff;padding:12px 18px;display:none;justify-content:space-between;align-items:center;box-shadow:0 -6px 18px rgba(0,0,0,.18);border-radius:14px 14px 0 0;margin-top:16px';
      bar.innerHTML = `<div id="ord233BarText" style="font-size:13px;font-weight:600"></div><button class="btn primary sm" id="ord233Review">Review order</button>`;
      const wrap = document.querySelector('#cloudViewer46 .cv47-wrap');
      if(wrap) wrap.appendChild(bar);
      bar.querySelector('#ord233Review').onclick = openOrderReview233;
    }
    return bar;
  }
  function updateCartBar233(){
    if(inPreviewMode233()) return;
    const overlay = document.getElementById('cloudViewer46');
    if(!overlay) return;
    const bar = ensureCartBar233();
    const n = cartTotalQty233();
    const items = loadCart233().length;
    const wantDisplay = n > 0 ? 'flex' : 'none';
    const ctx=cartContext233(loadCart233()),ctxText=[ctx.rateMode?ctx.rateMode.toUpperCase():'',ctx.bookName].filter(Boolean).join(' · '); const wantText = items + ' product(s) · ' + n + ' unit(s)' + (ctxText?' · '+ctxText:'');
    // only touch the DOM if something actually changed, to avoid retriggering the mutation observer below
    if(bar.style.display !== wantDisplay) bar.style.display = wantDisplay;
    const textEl = bar.querySelector('#ord233BarText');
    if(n > 0 && textEl.textContent !== wantText) textEl.textContent = wantText;
  }

  // Re-attach the cart bar only when show() has actually rebuilt the viewer from
  // scratch (the bar element goes missing) -- never react while the bar is
  // already present, so our own content updates above can't retrigger this.
  const cartObserver233 = new MutationObserver(() => {
    const overlay = document.getElementById('cloudViewer46');
    if(!overlay) return;
    if(!overlay.querySelector('.cv47-wrap')) return;
    if(!document.getElementById('ord233Bar')) updateCartBar233();
  });
  cartObserver233.observe(document.body, {childList:true, subtree:true});

  function openOrderReview233(){
    const cart = loadCart233();
    const m = document.createElement('div'); m.className = 'modal'; m.style.zIndex = '200010';
    const rows = cart.map((c, i) => `<tr>
      <td><b>${esc(c.code)}</b> · ${esc(c.name)}<div class="metric-sub">${esc(c.bookName)} · ${esc(c.rateText)}</div></td>
      <td style="width:90px"><input type="number" min="1" step="1" value="${c.qty}" data-cartqty="${i}" style="width:70px"></td>
      <td class="r"><button class="link" data-cartdel="${i}">remove</button></td>
    </tr>`).join('');
    const ctx=cartContext233(cart),ctxLabel=[ctx.rateMode?ctx.rateMode.toUpperCase():'',ctx.bookName].filter(Boolean).join(' · ');
    m.innerHTML = `<div class="box" style="max-width:600px"><div class="hd"><div><h2 style="margin:0">Your order</h2>${ctxLabel?`<div class="metric-sub" style="margin-top:3px">${esc(ctxLabel)} · locked rate context</div>`:''}</div></div>
      <div class="bd">
        ${cart.length ? `<div class="tbl-wrap"><table><tbody>${rows}</tbody></table></div>` : '<div class="empty-mini">Your order is empty.</div>'}
        <div class="field" style="margin-top:10px"><label>Note for the owner (optional)</label><textarea id="ord233Note" rows="2" placeholder="Delivery timing, special instructions..."></textarea></div>
        <div class="note" style="margin-top:6px">This sends a request to the owner — it does not create a confirmed bill. Rates shown are for reference; the owner will confirm the final order.</div>
      </div>
      <div class="ft"><button class="btn ghost" data-x="close">Close</button>${cart.length?'<button class="btn ghost" data-x="clear">Clear order</button><button class="btn primary" data-x="send">Send order request</button>':''}</div></div>`;
    document.body.appendChild(m);
    m.querySelectorAll('[data-cartqty]').forEach(inp => inp.onchange = () => {

<script id="pm-v235-connection-diagnostics">
(()=>{
  const PM_VERSION_235 = '2.38 Firebase connection diagnostics + simplified owner bootstrap';

  function describeFirestoreError235(e){
    const code = e && e.code || '';
    const msg = (e && e.message) || String(e);
    if(code === 'permission-denied' || /insufficient permission|missing or insufficient/i.test(msg)){
      return 'Firestore rejected this with "permission denied". This usually means the Firestore Rules have not been published correctly, or your account is not actually authenticated when the request reaches Firestore (see the sign-in check above — if it failed, fix that first, since a stale/expired session causes this exact error even when Rules are correct).';
    }
    if(/network-request-failed/i.test(msg)){
      return 'Network request failed — check your internet connection and try again.';
    }
    return msg;
  }

  async function runDiagnostics235(container){
    const steps = [];
    function render(){
      container.innerHTML = steps.map(s => `<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-2)">
        <div style="font-size:14px;line-height:1.4">${s.ok===null?'⏳':s.ok?'✅':'❌'}</div>
        <div><div style="font-weight:600;font-size:12.5px">${esc(s.label)}</div>${s.detail?`<div class="metric-sub" style="margin-top:2px;white-space:pre-wrap">${esc(s.detail)}</div>`:''}</div>
      </div>`).join('');
    }
    function step(label, ok, detail){ steps.push({label, ok, detail}); render(); }

    if('serviceWorker' in navigator){
      if(window.__swRegistration233) step('Offline caching (Service Worker)', true, 'Registered and active.');
      else if(window.__swRegistrationError233) step('Offline caching (Service Worker)', false, 'Registration failed: ' + (window.__swRegistrationError233.message||window.__swRegistrationError233));
      else step('Offline caching (Service Worker)', null, 'Still registering, or this page was opened before it finished — reload once to confirm.');
    } else {
      step('Offline caching (Service Worker)', false, 'Not supported in this browser.');
    }

    const a = window.PMFirebase41;
    if(!a){ step('Firebase module loaded', false, 'The app\'s own Firebase module did not load. Try reloading the page.'); return; }
    step('Firebase module loaded', true);

    let cfg;
    try{ cfg = await a.getSavedConfig(); }catch(e){}
    if(!cfg){ step('Firebase config saved', false, 'No config found yet. Paste your config above and click Connect first.'); return; }
    step('Firebase config saved', true, 'Project ID: ' + (cfg.projectId || '(missing)'));

    try{ a.ensureFirebase(cfg); }catch(e){ step('Firebase SDK initialized', false, e.message); return; }
    step('Firebase SDK initialized', true);

    if(!a.auth){ step('Signed in', false, 'Auth is not available.'); return; }
    // give Firebase a brief moment in case auth state is still resolving on first load
    if(!a.auth.currentUser) await new Promise(r => setTimeout(r, 400));
    if(!a.auth.currentUser){
      step('Signed in', false, 'No signed-in user. Go to the Cloud sync card above and sign in with the existing Owner account first.');
      return;
    }
    step('Signed in', true, a.auth.currentUser.email + '  ·  uid: ' + a.auth.currentUser.uid);

    // token freshness check -- this specifically catches the "looks signed in but token calls are failing" pattern
    try{
      const token = await a.auth.currentUser.getIdToken(true);
      step('Auth token refreshes correctly', true, 'Token length: ' + token.length + ' characters');
    }catch(e){
      step('Auth token refreshes correctly', false,
        'Refreshing your sign-in token failed: "' + (e.message||e) + '"\n\nThis points to a Google Cloud / Identity Toolkit problem, not a Firestore Rules problem. In Google Cloud Console for this project: (1) check API key restrictions allow "Identity Toolkit API", (2) confirm "Identity Toolkit API" is enabled, (3) confirm billing/quota is not blocked. Firestore checks below will likely also fail until this is fixed.');
    }

    try{
      const snap = await a.db.collection('meta').doc('security').get();
      if(!snap.exists){
        step('Can read from Firestore', true, 'The Owner security record is missing. Owner registration is locked in v2.74, so the app will not create a new Owner. Restore meta/security from your Firebase console/backup or use the already-initialized project.');
        step('Existing Owner record', false, 'No meta/security ownerUid exists. New Owner creation from the app is disabled.');
      }else{
        step('Can read from Firestore', true);
        const owner = snap.data().ownerUid;
        if(owner === a.auth.currentUser.uid) step('You are the owner of this project', true);
        else step('You are the owner of this project', false, 'This project already has a different owner (uid: '+owner+'). Sign in with that account instead, or start fresh with a new Firebase project.');
      }
    }catch(e){
      step('Can read from Firestore', false, describeFirestoreError235(e));
    }
  }

  const prevRender235 = render;
  render = function(){
    const out = prevRender235();
    setTimeout(() => {
      if(page !== 'set') return;
      const v = document.getElementById('view');
      if(!v || v.querySelector('#fbDiag235')) return;
      const cloudCard = v.querySelector('#L_cloudBox41');
      if(!cloudCard) return; // wait until the Cloud sync card itself exists
      const card = document.createElement('div');
      card.className = 'card'; card.id = 'fbDiag235'; card.style.marginTop = '14px';
      card.innerHTML = `<div class="hd"><h2>Firebase connection diagnostics</h2></div><div class="bd">
        <div class="note" style="margin-bottom:8px">If Owner verification or cloud sync is not working, run this — it checks each step and tells you exactly which one is failing, instead of a generic error.</div>
        <button class="btn primary sm" id="runDiag235">Run diagnostics</button>
        <div id="diagResults235" style="margin-top:10px"></div>

      cloudCard.after(card);
      card.querySelector('#runDiag235').onclick = () => {

    return out;
  };

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_235};
})();
</script>
<script id="pm-v238-login-gate-hardened">

  window.createPriceBookVersion242 = function(pb, label){

  function versionsForBook242(priceBookId){

  /* Rebuilds a listConfig()-shaped object from a flat snapshot (or from "live now"), grouped

  function snapshotToListConfig242(items, pb){
    const columns = [
      {key:'code', label:'Code', align:'left', w:1.0},
      {key:'name', label:'Product', align:'left', w:3.8},
      {key:'size', label:'Size', align:'left', w:1.2},

    let cur = null;
    items.forEach(it => {
      if(!cur || cur.name !== it.category){ cur = {name: it.category, rows: []}; groups.push(cur); }

        it.code, it.name, it.size, it.packing,
        it.mrp!=null ? (S.settings.currency+money(it.mrp)) : '—',

  window.downloadVersionPDF242 = function(version){

  window.restoreVersion242 = function(version, pb){

        ${added.length ? `<b>New since then</b><div class="tbl-wrap" style="margin:6px 0 12px"><table><tbody>${added.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td></tr>`).join('')}</tbody></table></div>` : ''}
        ${removed.length ? `<b>No longer in the price book</b><div class="tbl-wrap" style="margin:6px 0"><table><tbody>${removed.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td></tr>`).join('')}</tbody></table></div>` : ''}
        ${!changed.length && !added.length && !removed.length ? '<div class="empty-mini">No differences — identical to the current price book.</div>' : ''}
      </div>
      <div class="ft"><button class="btn primary" data-x="close">Close</button></div></div>`;
    document.body.appendChild(m);
    m.onclick = e => { if(e.target.closest('[data-x="close"]') || e.target===m) m.remove(); };
  };

  /* ================= inject controls into the Saved Price Books table ================= */
  const prevRender242 = render;
  render = function(){
    const out = prevRender242();
    setTimeout(() => {
      const v = document.getElementById('view');
      if(!v) return;
      v.querySelectorAll('[data-pb-versions-anchor]').forEach(el => el.remove()); // avoid dupes across re-renders
      const headers = [...v.querySelectorAll('.card .hd h2')].filter(h => h.textContent.trim() === 'Saved Price Books');
      headers.forEach(h => {
        const card = h.closest('.card');

          const loadBtn = tr.querySelector('[data-pb-load]');
          if(!loadBtn) return;

          const actionsCell = tr.querySelector('td:last-child');
          if(!actionsCell || actionsCell.querySelector('[data-versions-btn]')) return;
          const span = document.createElement('span');
          span.innerHTML = ` · <button class="link" data-versions-btn="${pbId}">versions</button>`;
          actionsCell.appendChild(span);

    return out;
  };

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-versions-btn]');
    if(b){ e.preventDefault(); window.versionListDialog242(b.dataset.versionsBtn); }
  });

  window.PriceManagerAPI = {...(window.PriceManagerAPI||{}), version: PM_VERSION_242};
})();
</script>
<script id="pm-v243-pricebook-edit-reset">

  // silently UPDATED the previously-saved book instead of creating a new one -- the modal

    window.loadPriceBook44 = function(id){
      window.__pmJustLoadedBook243 = true; // this call is ABOUT to set editingPriceBook230 intentionally
      return prevLoadPriceBook44_243(id);
    };
  }
})();
</script>



<script id="pm-v263-integrity-security-fixes">
(()=>{
