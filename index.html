(function(){
  if(window.storage) return;
  const DB='price-manager-pro', STORE='kv'; let dbp;
  function db(){return dbp||(dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}));}
  window.storage={
    async get(key){try{const d=await db();return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,'readonly'),q=t.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result==null?null:{value:q.result});q.onerror=()=>reject(q.error)})}catch(e){return null}},
    async set(key,value){const d=await db();return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,'readwrite'),q=t.objectStore(STORE).put(value,key);q.onsuccess=()=>resolve(true);q.onerror=()=>reject(q.error)})},
    async remove(key){const d=await db();return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,'readwrite'),q=t.objectStore(STORE).delete(key);q.onsuccess=()=>resolve(true);q.onerror=()=>reject(q.error)})}
  };
})();
</script>

/* global debounce shim -- several later feature blocks (search boxes on Inventory and
   Purchase Costing) call debounce(fn, wait) but only one of the many patch blocks
   defines it, and it defines it inside its own closure so it is invisible to the
   others. That throws 'debounce is not defined' and blanks the Inventory / Purchase
   Costing screens. Defining it once here, at plain top level, makes it available to
   every later <script> block on the page. */
function debounce(fn, wait=240){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }

<script>
/* ============================ PDF price-list parser ============================
   Reconstructs the table without ruling lines:
   1. text items -> lines (y buckets) -> cells (x gap merge)
   2. drop header/noise lines, detect centred section headings (= category)
   3. column separators from vertical whitespace across the page
   4. each line holding a product code is a record anchor; wrapped lines join it
   5. column roles decided by majority vote, fields pulled by regex

const RX = {
  code:/\b((?=[A-Z0-9-]{3,20}\b)(?=[A-Z0-9-]*[A-Z])(?=[A-Z0-9-]*\d)[A-Z0-9]+(?:-[A-Z0-9]+)*)\b/,
  price:/(?:Rs\.?\s*)([\d,]+(?:\.\d+)?)\s*(?:\/\s*([A-Za-z][A-Za-z .]*))?/,
  bare:/\b([\d,]+(?:\.\d+)?)\s*\/\s*([A-Za-z]+)/,
  bar:/\b(\d{10,15})\b/,
  unit:/^Per\b/i,
  size:/^\d+(\.\d+)?\s*(g|gm|gms|kg|ml|l|cm|"|inch|pcs?|items?|sticks?|cone|cup|diya|hrs?|ltr|x|pouch|bottle|batti|set)/i,
  num:/^\d+(\.\d+)?( ?Kg)?$/i,
  status:/ON DEMAND|COMING SOON|\bNET\b/i,
  noise:/S\.No|Product\s*Name|Barcode Individual|Carton Packing|Net Wt|Price List|W\.E\.F|Toll Free|Email:|Edition|This is Not Company|Wholesaler to Retailer|Product Link|Box packing|Inner Packing|Product price|Final Price|Product Price|MRP/i
};
const clean = s => (s||'').replace(/\s+/g,' ').trim();
const tidyUnit = u => clean((u||'').replace(/^per\s*/i,'').replace(/[^A-Za-z0-9 ]+$/,''));

function itemsToLines(items){
  const src=(items||[]).filter(it=>it&&it.text!=null).map(it=>({...it,height:Math.max(1,+it.height||+it.h||8)})).sort((a,b)=>a.top-b.top||a.x0-b.x0);
  if(!src.length)return [];
  const hs=src.map(x=>x.height).filter(Number.isFinite).sort((a,b)=>a-b), medH=hs.length?hs[Math.floor(hs.length/2)]:8;
  const rows=[];
  src.forEach(it=>{
    const last=rows[rows.length-1],tol=Math.max(1.15,Math.min(4.4,Math.min(medH,it.height)*0.34));
    if(last&&Math.abs(it.top-last.y)<=tol){last.items.push(it);last.y=(last.y*(last.items.length-1)+it.top)/last.items.length;last.h=Math.max(last.h,it.height)}
    else rows.push({y:it.top,h:it.height,items:[it]});
  });
  return rows.map(row=>{
    const ws=row.items.sort((a,b)=>a.x0-b.x0),cells=[];let cur=null;
    const rowHs=ws.map(x=>x.height).sort((a,b)=>a-b),rh=rowHs[Math.floor(rowHs.length/2)]||medH,gapTol=Math.max(3.2,Math.min(8,rh*.72));
    ws.forEach(w=>{
      if(cur&&w.x0-cur.x1<gapTol){cur.text+=' '+w.text;cur.x1=Math.max(cur.x1,w.x1)}
      else{if(cur)cells.push(cur);cur={text:w.text,x0:w.x0,x1:w.x1}}
    });
    if(cur)cells.push(cur);
    return {top:Math.min(...ws.map(w=>w.top)),height:rh,cells,text:cells.map(c=>c.text).join(' ')};
  });
}
function separators(lines, W){
  const bins = new Array(Math.ceil(W)+2).fill(0);
  lines.filter(l=>!l.head && !l.noise).forEach(l=>l.cells.forEach(c=>{
    for(let x=Math.max(0,Math.floor(c.x0)); x<=Math.min(bins.length-1,Math.ceil(c.x1)); x++) bins[x]++;
  }));
  const seps=[]; let run=null;
  for(let x=0;x<bins.length;x++){
    if(bins[x]===0){ if(run===null) run=x; }
    else { if(run!==null && x-run>=4) seps.push((run+x)/2); run=null; }
  }
  return seps;
}
const colOf = (x,seps)=>{ let i=0; while(i<seps.length && x>seps[i]) i++; return i; };

function recordsFromPage(items, W, state){
  const lines = itemsToLines(items);
  if(lines.length<3) return [];
  lines.forEach(l=>{
    l.anchor = l.cells.some(c=>RX.code.test(c.text.trim()) && /^[A-Z]{2}\s?\d{1,4}$/.test(c.text.trim()));
    l.noise = RX.noise.test(l.text);

  const noisetops = lines.filter(l=>l.noise).map(l=>l.top);
  lines.forEach(l=>{ if(!l.anchor && noisetops.some(t=>Math.abs(l.top-t)<22)) l.noise=true; });
  lines.forEach(l=>{
    const c0=l.cells[0], w=c0.x1-c0.x0, mid=(c0.x0+c0.x1)/2;
    l.head = l.cells.length===1 && !l.anchor && !l.noise && w>W*0.10 && Math.abs(mid-W/2)<W*0.18;
  });
  const seps = separators(lines,W);
  const anchors = lines.map((l,i)=>l.anchor?i:-1).filter(i=>i>=0);
  if(!anchors.length){ lines.forEach(l=>{ if(l.head){ const t=clean(l.text); if(t.length>2&&t.length<60) state.cat=t; } }); return []; }
  const groups = {}; anchors.forEach(a=>groups[a]=[a]);
  lines.forEach((l,i)=>{
    if(l.anchor||l.head||l.noise) return;
    let best=null,bd=1e9;
    anchors.forEach(a=>{
      const lo=Math.min(a,i), hi=Math.max(a,i); let block=false;
      for(let k=lo;k<=hi;k++){ if(lines[k].head || (k!==a && lines[k].anchor)){ block=true;break; } }
      if(block) return;
      const d=Math.abs(lines[a].top-l.top); if(d<bd){bd=d;best=a;}
    });
    if(best!==null && bd<30) groups[best].push(i);
  });

  lines.forEach((l,i)=>{
    if(l.head){ const t=clean(l.text); if(t.length>2&&t.length<60) state.cat=t; }
    if(l.anchor) catmap[i]=state.cat;
  });

    const cols={};
    groups[a].sort((x,y)=>lines[x].top-lines[y].top).forEach(i=>{
      lines[i].cells.forEach(c=>{
        const ci=colOf((c.x0+c.x1)/2,seps);
        (cols[ci]=cols[ci]||[]).push({top:lines[i].top,x0:c.x0,text:c.text});
      });
    });
    const arr = Object.keys(cols).map(Number).sort((x,y)=>x-y).map(ci=>{
      const v = cols[ci].sort((p,q)=> p.top-q.top || p.x0-q.x0).map(p=>p.text).join(' ');

  });
}
function decideRoles(recs){
  const st={};
  recs.forEach(r=>r.cols.forEach(([ci,v])=>{
    const d = st[ci] = st[ci]||{code:0,unit:0,price:0,bar:0,size:0,text:0,num:0,link:0,n:0,len:0};
    d.n++; d.len+=v.length; const s=v.trim();
    if(RX.code.test(s)) d.code++;
    if(RX.unit.test(s)) d.unit++;
    if(RX.price.test(s)||RX.status.test(s)) d.price++;
    if(RX.bar.test(s)) d.bar++;
    if(RX.size.test(s)) d.size++;
    if(s.toLowerCase()==='link') d.link++;
    if(RX.num.test(s)) d.num++;
    if(/[A-Za-z]{3}/.test(s)) d.text++;
  }));
  const keys = Object.keys(st).map(Number);
  if(!keys.length) return null;
  const rate=(ci,k)=>st[ci][k]/Math.max(st[ci].n,1);
  const avglen=ci=>st[ci].len/Math.max(st[ci].n,1);
  const best=(k,cond=()=>true,thr=0)=>{
    let bi=null,bv=-1;
    keys.forEach(ci=>{ if(!cond(ci)) return; const v=rate(ci,k); if(v>thr && (v>bv || (v===bv && ci<bi))){bv=v;bi=ci;} });
    return bi;
  };
  const R={};
  R.code = best('code',()=>true,.4); if(R.code===null) return null;
  R.unit = best('unit',ci=>ci>=R.code,.3);
  R.price = best('price',ci=>ci>=R.code && (R.unit===null||ci<=R.unit),.3);
  if(R.price===null) R.price=R.code;
  R.mrp = R.unit===null?null:best('price',ci=>ci>R.unit,.3);
  R.bar = best('bar',ci=>ci<=R.code,.3);
  R.link = best('link',ci=>ci<R.code,.3);
  const names = keys.filter(ci=>ci<R.code && ci!==R.link && ci!==R.bar && rate(ci,'text')>.4 && avglen(ci)>=7).sort((a,b)=>a-b);
  R.name = names.length?names[0]:null;
  const rest = keys.filter(ci=>ci<R.code && ci!==R.name && ci!==R.link && ci!==R.bar).sort((a,b)=>a-b);
  const sz = rest.filter(ci=>rate(ci,'size')>.3);
  R.size = sz.length ? sz[0] : (R.name!==null ? (rest.filter(ci=>ci>R.name)[0] ?? null) : null);
  const base = R.mrp!==null?R.mrp:R.price;
  const tail = keys.filter(ci=>ci>base).sort((a,b)=>a-b);
  R.netwt = (tail.length && rate(tail[tail.length-1],'num')>.4) ? tail[tail.length-1] : null;
  R.pack = tail.filter(ci=>ci!==R.netwt);
  return R;
}
function recordsToProducts(pageRecs, catalog){
  const out=[];
  const R = decideRoles(pageRecs);
  if(!R) return out;
  pageRecs.forEach(r=>{
    const d={}; r.cols.forEach(([ci,v])=>d[ci]=v);
    const g = k => (R[k]===null||R[k]===undefined) ? '' : clean(d[R[k]]||'');
    const codeTxt = g('code'); const mc = codeTxt.match(RX.code); if(!mc) return;
    const mb = (g('bar')||codeTxt).match(RX.bar);
    let ptxt = g('price');
    if(R.price===R.code) ptxt = ptxt.replace(new RegExp(RX.bar.source,'g'),' ').replace(new RegExp(RX.code.source,'g'),' ');
    let price=null, punit='';
    let mp = ptxt.match(RX.price);
    if(mp){ price=parseFloat(mp[1].replace(/,/g,'')); punit=clean(mp[2]||''); }
    else { const m2=ptxt.match(RX.bare); if(m2){ price=parseFloat(m2[1].replace(/,/g,'')); punit=m2[2]; } }
    const mm = g('mrp').match(RX.price);
    const mrp = mm?parseFloat(mm[1].replace(/,/g,'')):null;
    let name = g('name') || r.cols.filter(([ci])=>ci<R.code).map(([,v])=>v).join(' ');
    name = clean(name).replace(/^\d{1,3}\s+/,'').replace(/^(NEW|New)\s+/,'');
    const st = ptxt.match(RX.status);
    const r2 = x => x==null?null:Math.round(x*100)/100;
    out.push({
      id:uid(), code:mc[1], name, size:g('size'), barcode:mb?mb[1]:'',
      category:r.cat||'Uncategorised', catalog,
      price:r2(price), priceUnit: tidyUnit(punit || g('unit')),
      mrp:r2(mrp), packing: R.pack.map(ci=>clean(d[ci]||'')).filter(x=>x&&x!=='-').join(' / '),
      netWt:g('netwt'), stock:0, minStock:0, hsn:'', gst:null, discount:null,
      status: (price===null && st) ? st[0].toLowerCase() : 'active',
      note:'', updatedAt:Date.now()
    });
  });

}

  const catalog = file.name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim().slice(0,42);
  const state={cat:''}; let all=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale:1});
    const tc = await page.getTextContent();
    const items = tc.items.filter(i=>i.str && i.str.trim()).map(i=>({
      text:i.str.trim(), x0:i.transform[4], x1:i.transform[4]+(i.width||0),
      top: vp.height - i.transform[5], height:Math.max(1,Math.abs(i.transform[3]||i.transform[0]||i.height||8))
    }));
    const recs = recordsFromPage(items, vp.width, state);
    if(recs.length) all = all.concat(recordsToProducts(recs, catalog).map(x=>({...x, page:p})));
    if(onProgress) onProgress(p, pdf.numPages);
  }
  const seen={};
  return all.filter(p=>{ const k=p.code+'|'+p.name; if(seen[k]) return false; seen[k]=1; return true; });
}
</script>

<script>
/* ============================ pricing engine ============================ */
function roundPrice(n){
  if(n==null||isNaN(n)) return n;
  switch(S.settings.rounding){
    case 'nearest': return Math.round(n);
    case 'up': return Math.ceil(n);
    case 'down': return Math.floor(n);
    case 'half': return Math.round(n*2)/2;
    case 'five': return Math.round(n/5)*5;
    default: return Math.round(n*100)/100;
  }
}
const SPEC = {product:3, category:2, catalog:1, all:0};
function resolveRule(p, rules){
  let best=null, bestSpec=-1;
  (rules||[]).forEach(r=>{
    if(r.off) return;
    let hit=false;
    if(r.scope==='all') hit=true;
    else if(r.scope==='catalog') hit = p.catalog===r.target;
    else if(r.scope==='category') hit = p.category===r.target;
    else if(r.scope==='product') hit = pmNormCode(p.code)===pmNormCode(r.target);
    if(hit && SPEC[r.scope]>=bestSpec){ best=r; bestSpec=SPEC[r.scope]; }
  });
  return best;
}
/* profile: {rules:[], label:''} — party rules or the global rule list */
function priceOf(p, profile){
  const base = p.price;
  const rule = p.discount ? {...p.discount, scope:'product', src:'item'} : resolveRule(p, (profile&&profile.rules)||S.rules);
  if(base==null) return {base:null, net:null, rule, off:null, offPct:null};
  let net = base;
  if(rule){
    if(rule.type==='pct') net = base * (1 - (+rule.value||0)/100);
    else if(rule.type==='flat') net = base - (+rule.value||0);
    else if(rule.type==='set') net = +rule.value||0;
  }
  net = Math.max(0, roundPrice(net));
  const off = base-net;
  return {base, net, rule, off, offPct: base? (off/base*100) : 0};
}
function sizeGrams(size){
  const s=(size||'').trim();
  let m=s.match(/^([\d.]+)\s*(kg|KG)/); if(m) return parseFloat(m[1])*1000;
  m=s.match(/^([\d.]+)\s*(gms|gm|GM|g|G)\b/); if(m) return parseFloat(m[1]);
  return null;
}
/* a rate quoted per kg or per dozen is not comparable to a per-piece MRP;
   convert it to one piece so the margin means something */
function unitNet(p, net){
  if(net==null) return null;
  const u=(p.priceUnit||'').toLowerCase().replace(/[^a-z]/g,'');
  if(u==='kg'||u==='kilo'){ const g=sizeGrams(p.size); return g? net*g/1000 : null; }
  if(u==='doz'||u==='dozen') return net/12;
  return net;
}
function marginPct(p, net){
  const n = unitNet(p, net);
  if(!p.mrp || n==null) return null;
  return (p.mrp - n)/p.mrp*100;
}
function ruleLabel(r){
  if(!r) return '';
  const v = r.type==='pct' ? (+r.value)+'%' : (r.type==='set' ? 'Rs.'+r.value : 'Rs.'+r.value+' off');
  const scope = r.src==='item' ? 'item' : (r.scope==='all'?'all items':r.scope+': '+r.target);
  return v + ' · ' + scope;
}

function viewDash(v,t,sub){

      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn ghost sm" data-nav="import">Add another PDF</button>

        <div class="bar"><i style="width:${Math.round(n/max*100)}%"></i></div></div>`).join('')}
    </div></div>
  </div>`;
}

/* ============================ inventory ============================ */
function filtered(){
  const q = ui.q.toLowerCase().trim();
  let arr = S.products.filter(p=>{
    const st=(p.status||'active').toLowerCase();
    if(ui.only==='archived'){ if(st!=='archived') return false; } else if(st==='archived') return false;
    if(ui.catalog && p.catalog!==ui.catalog) return false;
    if(ui.cat && p.category!==ui.cat) return false;
    if(ui.only==='nostock' && (+p.stock||0)>0) return false;
    if(ui.only==='low' && !(+p.minStock>0 && (+p.stock||0)<=+p.minStock)) return false;
    if(ui.only==='noprice' && p.price!=null) return false;
    if(ui.only==='disc' && !p.discount && !resolveRule(p,S.rules)) return false;
    if(!q) return true;
    return (p.name+' '+p.code+' '+p.size+' '+p.category+' '+(p.barcode||'')).toLowerCase().includes(q);
  });
  const s = ui.sort;
  if(s==='orig') return arr.sort(orderInList);
  arr.sort((a,b)=>{
    if(s==='name') return (a.name||'').localeCompare(b.name||'');
    if(s==='price') return (b.price||0)-(a.price||0);
    if(s==='stock') return (+b.stock||0)-(+a.stock||0);
    if(s==='cat') return (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||'');
    return (a.catalog||'').localeCompare(b.catalog||'') || (a.code||'').localeCompare(b.code||'',undefined,{numeric:true});
  });
  return arr;
}

      <option value="name" ${ui.sort==='name'?'selected':''}>Sort by name</option>
      <option value="cat" ${ui.sort==='cat'?'selected':''}>Sort by category</option>

    </select>
    ${(ui.q||ui.cat||ui.catalog||ui.only)?'<button class="btn ghost sm" data-act="clear-filters">Clear</button>':''}
  </div>

    <thead><tr>

      <th class="r">Rate</th><th class="r">Discount</th><th class="r">Net rate</th>
      <th class="r">MRP</th><th class="r">Margin</th><th class="r">Stock</th><th></th>
    </tr></thead>
    <tbody>${rows.map(p=>{
      const r = priceOf(p, prof); const m = marginPct(p, r.net);
      const low = +p.minStock>0 && (+p.stock||0)<=+p.minStock;
      return `<tr class="${ui.sel.has(p.id)?'sel':''}" data-id="${p.id}">
        <td><input type="checkbox" class="rowsel" data-id="${p.id}" ${ui.sel.has(p.id)?'checked':''}></td>

          ${p.status!=='active'?`<span class="tag">${esc(p.status)}</span>`:''}</td>

  ${arr.length>rows.length?`<div style="padding:10px;text-align:center"><button class="btn ghost sm" data-act="more">Show ${Math.min(250,arr.length-rows.length)} more</button></div>`:''}

  $('#fOnly').onchange = e=>{ ui.only=e.target.value; render(); };
  $('#fSort').onchange = e=>{ ui.sort=e.target.value; render(); };
  $('#selAll').onchange = e=>{ if(e.target.checked) rows.forEach(p=>ui.sel.add(p.id)); else ui.sel.clear(); render(); };
  v.querySelectorAll('.rowsel').forEach(c=>c.onchange=e=>{

    const p=S.products.find(x=>x.id===e.target.dataset.id); p.stock=nz(e.target.value)||0; save(); render(); });

<script>
/* ============================ import ============================ */
function viewImport(v,t,sub,act){
  t.textContent='Import a price list PDF'; sub.textContent='Wholesaler PDFs are read directly — no typing';
  if(ui.review){ return reviewScreen(v,act); }
  v.innerHTML=`
  <div class="split">
    <div>
      <div class="drop" id="drop">
        <div style="font-size:15px;font-weight:600;margin-bottom:4px">Drop PDF files here</div>
        <div class="note" style="margin-bottom:12px">Several files at once is fine. Each becomes its own price list.</div>
        <input type="file" id="file" accept="application/pdf,.csv" multiple style="display:none">
        <button class="btn primary" data-act="pick">Choose files</button>
        <div class="note" style="margin-top:10px">A CSV export from this app also works.</div>
      </div>
      <div id="prog" style="margin-top:12px"></div>
    </div>
    <div class="card"><div class="hd"><h2>How importing works</h2></div><div class="bd">
      <ol style="margin:0;padding-left:18px;color:var(--muted);line-height:1.7">
        <li>Every row with a product code (PU12, RA47, DD31…) is picked up.</li>
        <li>Name, size, barcode, rate, MRP, packing and net weight are matched to their columns; section titles become categories.</li>
        <li>You check the result on the next screen before anything is saved.</li>
        <li>If a code already exists, choose whether to update its rate or skip it — that is how a whole list gets re-rated when the company sends a new edition.</li>
      </ol>
      <div class="warn" style="margin-top:12px">Scanned or photographed PDFs have no text layer and cannot be read. Rates are worth a quick check against the original either way.</div>
    </div></div>
  </div>`;
  const f=$('#file'), d=$('#drop');
  f.onchange = e=>handleFiles([...e.target.files]);
  d.ondragover = e=>{e.preventDefault(); d.classList.add('hot');};
  d.ondragleave = ()=>d.classList.remove('hot');
  d.ondrop = e=>{e.preventDefault(); d.classList.remove('hot'); handleFiles([...e.dataTransfer.files]);};
}
async function handleFiles(files){
  if(!files.length) return;
  const prog=$('#prog'); let got=[];
  for(const file of files){
    prog.innerHTML = `<div class="card"><div class="bd">Reading <b>${esc(file.name)}</b>…<div class="bar" style="margin-top:8px"><i id="pb" style="width:5%"></i></div></div></div>`;
    try{
      if(/\.csv$/i.test(file.name)){ got = got.concat(csvToProducts(await file.text(), file.name.replace(/\.csv$/i,''))); }
      else got = got.concat(await parsePriceListPDF(file,(p,n)=>{ const b=$('#pb'); if(b) b.style.width=Math.round(p/n*100)+'%'; }));
    }catch(err){ prog.innerHTML = `<div class="warn">${esc(file.name)}: ${esc(err.message||err)}</div>`; return; }
  }
  if(!got.length){ prog.innerHTML=`<div class="warn">No product rows found. The file may be a scan, or use a layout this reader does not recognise. A CSV import is the reliable alternative.</div>`; return; }
  ui.review = { items:got, mode:'merge', drop:new Set() };
  render();
}

    <div><b class="num" style="font-size:19px">${dup.length}</b> <span class="mut">codes already in stock list</span></div>
    <div style="flex:1"></div>
    <label class="note">Existing codes:
      <select id="mode">
        <option value="merge" ${R.mode==='merge'?'selected':''}>update rate, MRP and packing</option>
        <option value="skip" ${R.mode==='skip'?'selected':''}>leave untouched</option>
        <option value="dupe" ${R.mode==='dupe'?'selected':''}>add as separate products</option>
      </select></label>
  </div></div>
  <div class="tbl-wrap"><table><thead><tr>
    <th>Keep</th><th>Code</th><th>Product</th><th>Size</th><th>Category</th><th class="r">Rate</th><th class="r">MRP</th><th>Packing</th><th></th>
  </tr></thead><tbody>
  ${R.items.map((p,i)=>{
    const ex = findByCode(p.code);
    return `<tr class="${R.drop.has(i)?'':'sel'}">
      <td><input type="checkbox" class="keep" data-i="${i}" ${R.drop.has(i)?'':'checked'}></td>
      <td class="num mut">${esc(p.code)}</td>
      <td>${esc(p.name)} ${ex?'<span class="tag">exists</span>':''}</td>
      <td class="mut">${esc((p.size||'').slice(0,26))}</td>
      <td><span class="chip">${esc(p.category)}</span></td>
      <td class="r num">${p.price==null?`<span class="bad">${esc(p.status!=='active'?p.status:'—')}</span>`:money(p.price)}</td>
      <td class="r num mut">${p.mrp?money(p.mrp):'—'}</td>
      <td class="mut" style="font-size:11.5px">${esc((p.packing||'').slice(0,40))}</td>
      <td class="mut" style="font-size:11px">p.${p.page}</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
  $('#mode').onchange = e=>{ R.mode=e.target.value; };
  v.querySelectorAll('.keep').forEach(c=>c.onchange=e=>{
    const i=+e.target.dataset.i; e.target.checked?R.drop.delete(i):R.drop.add(i);
    e.target.closest('tr').classList.toggle('sel', e.target.checked);
    $('#topActions').querySelector('[data-act="confirm-import"]').textContent = `Import ${R.items.length-R.drop.size} products`;
  });
}
function confirmImport(){
  const R=ui.review; let added=0, updated=0; const changes=[]; const newOnes=[];
  const r2 = x => (x==null||isNaN(x))?null:Math.round(x*100)/100;
  R.items.forEach(p=>{ p.price=r2(p.price); p.mrp=r2(p.mrp); });
  R.items.forEach((p,i)=>{
    if(R.drop.has(i)) return;
    const ex = findByCode(p.code);
    if(ex && R.mode!=='dupe'){
      if(R.mode==='merge'){
        if(p.price!=null && p.price!==ex.price) changes.push({code:ex.code,name:ex.name,catalog:ex.catalog,old:ex.price,now:p.price});
        ex.price = p.price!=null?p.price:ex.price; ex.mrp = p.mrp!=null?p.mrp:ex.mrp;
        ex.packing=p.packing||ex.packing; ex.size=p.size||ex.size; ex.netWt=p.netWt||ex.netWt;
        ex.barcode=p.barcode||ex.barcode; ex.priceUnit=p.priceUnit||ex.priceUnit;
        ex.category=p.category||ex.category; ex.updatedAt=Date.now(); updated++;
      }
      return;
    }
    S.products.push(p); added++; newOnes.push(p.code);
  });
  S.imports.unshift({at:Date.now(), catalog:R.items[0].catalog, added, updated});
  logHistory({type:'import', title:R.items[0].catalog, added, updated, newCodes:newOnes.slice(0,60), changes});
  ui.review=null; save(); go('inv');
  toast(`${added} added, ${updated} updated`);
}
function csvToProducts(text, catalog){
  const rows = parseCSV(text); if(rows.length<2) return [];
  const head = rows[0].map(h=>h.toLowerCase().trim());
  const ix = n => head.findIndex(h=>h===n||h.replace(/[^a-z]/g,'')===n);
  return rows.slice(1).filter(r=>r.length>1).map(r=>({
    id:uid(), code:r[ix('code')]||'', name:(ix('product')>-1?r[ix('product')]:r[ix('name')])||'',
    size:r[ix('size')]||'', category:r[ix('category')]||'Uncategorised', catalog,
    barcode:r[ix('barcode')]||'', price:nz(r[ix('rate')]!==undefined?r[ix('rate')]:r[ix('price')]),
    mrp:nz(r[ix('mrp')]), packing:r[ix('packing')]||'', netWt:r[ix('netwt')]||'',
    stock:nz(r[ix('stock')])||0, minStock:0, hsn:'', gst:null, discount:null,
    priceUnit:r[ix('unit')]||'', status:'active', note:'', updatedAt:Date.now(), page:0
  })).filter(p=>p.code||p.name);
}
function parseCSV(text){
  const out=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); out.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){ row.push(cur); out.push(row); }
  return out;
}
function exportCSV(items){
  const head=['Code','Product','Size','Category','Catalog','Barcode','Rate','Unit','Discount','Net','MRP','Margin%','Packing','NetWt','Stock','MinStock','HSN','GST'];
  const prof={rules:S.rules};
  const lines=[head.join(',')].concat(items.map(p=>{
    const r=priceOf(p,prof), m=marginPct(p,r.net);
    return [p.code,p.name,p.size,p.category,p.catalog,p.barcode,p.price??'',p.priceUnit,r.rule?ruleLabel(r.rule):'',r.net??'',p.mrp??'',(m==null||m<0)?'':m.toFixed(1),p.packing,p.netWt,p.stock||0,p.minStock||0,p.hsn||'',p.gst??'']
      .map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',');
  }));
  download('inventory-'+new Date().toISOString().slice(0,10)+'.csv', lines.join('\n'), 'text/csv');
}

function editProduct(id){

}
function newProduct(){

function norm44(s){ return String(s||'').trim().toLowerCase(); }
function openProduct(p, isNew){
  const d = p.discount||{type:'pct',value:''};

      </div>
      <div class="cols3">
        <div class="field"><label>Rate (wholesale)</label><input id="e_price" class="num" value="${p.price??''}"></div>
        <div class="field"><label>Rate unit</label>
          <select id="e_unit_select">
            ${['Pc','Box','Carton','Dozen','Kg','Gram','Tray','Bag','Set','Pack','Bottle','Unit'].map(u=>`<option value="${u}" ${norm44(p.priceUnit)===norm44(u)?'selected':''}>${u}</option>`).join('')}
            <option value="__custom__" ${p.priceUnit && !['Pc','Box','Carton','Dozen','Kg','Gram','Tray','Bag','Set','Pack','Bottle','Unit'].some(u=>norm44(u)===norm44(p.priceUnit)) ? 'selected' : ''}>Custom…</option>
          </select>
          <input id="e_unit" value="${esc(p.priceUnit||'')}" placeholder="type the unit" style="margin-top:6px;display:${p.priceUnit && !['Pc','Box','Carton','Dozen','Kg','Gram','Tray','Bag','Set','Pack','Bottle','Unit'].some(u=>norm44(u)===norm44(p.priceUnit)) ? '' : 'none'}">
        </div>
        <div class="field"><label>MRP</label><input id="e_mrp" class="num" value="${p.mrp??''}"></div>
      </div>
      <div class="cols3">
        <div class="field"><label>Pieces per unit <span class="mut">(e.g. 1 Box = 12 Pc — leave blank if not applicable)</span></label><input id="e_pcsPerUnit" class="num" placeholder="e.g. 12" value="${(()=>{const row=(S.uomMaster||[]).find(x=>x.productId===p.id && norm44(x.unit)===norm44(p.priceUnit)); return row?row.pcsPerUnit:''})()}"></div>
      </div>
      <div class="cols3">
        <div class="field"><label>Item discount</label>
          <select id="e_dtype"><option value="">none</option>
            <option value="pct" ${p.discount&&d.type==='pct'?'selected':''}>% off</option>
            <option value="flat" ${p.discount&&d.type==='flat'?'selected':''}>amount off</option>
            <option value="set" ${p.discount&&d.type==='set'?'selected':''}>fixed net rate</option></select></div>
        <div class="field"><label>Discount value</label><input id="e_dval" class="num" value="${p.discount?d.value:''}"></div>
        <div class="field"><label>GST %</label><input id="e_gst" class="num" value="${p.gst??''}" placeholder="${S.settings.gstDefault}"></div>
      </div>
      <div class="cols3">
        <div class="field"><label>Stock</label><input id="e_stock" class="num" value="${p.stock||0}"></div>
        <div class="field"><label>Minimum stock</label><input id="e_min" class="num" value="${p.minStock||0}"></div>
        <div class="field"><label>HSN</label><input id="e_hsn" value="${esc(p.hsn||'')}"></div>
      </div>
      <div class="cols2">
        <div class="field"><label>Packing</label><input id="e_pack" value="${esc(p.packing||'')}"></div>
        <div class="field"><label>Barcode</label><input id="e_bar" value="${esc(p.barcode||'')}"></div>
      </div>
      <div class="cols2">
        <div class="field"><label>Net weight (kg per carton)</label><input id="e_wt" value="${esc(p.netWt||'')}"></div>
        <div class="field"><label>Status</label><select id="e_status">
          ${['active','on demand','coming soon','discontinued','archived'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Note</label><textarea id="e_note" rows="2">${esc(p.note||'')}</textarea></div>
      ${isNew?'':(()=>{const hs=historyOf(p.code);
        return `<div style="border-top:1px solid var(--line-2);padding-top:10px">
          <label class="note">Rate history</label>
          ${hs.length?`<table style="margin-top:4px"><tbody>${hs.slice(0,8).map(x=>`<tr>
            <td class="mut" style="font-size:11.5px">${esc(whenStr(x.at))}</td>
            <td class="mut">${esc(x.type)}</td>
            <td class="r num">${x.c.old==null?'—':money(x.c.old)}</td>
            <td class="r num">&rarr; <b>${x.c.now==null?'—':money(x.c.now)}</b></td>
            <td class="r num ${(x.c.now||0)>(x.c.old||0)?'bad':'good'}">${(x.c.old&&x.c.now)?(((x.c.now-x.c.old)/x.c.old*100).toFixed(1)+'%'):''}</td>

  document.body.appendChild(m);
  const unitSelectEl = m.querySelector('#e_unit_select');
  const unitCustomEl = m.querySelector('#e_unit');
  if(unitSelectEl.value !== '__custom__' && !unitCustomEl.value) unitCustomEl.value = unitSelectEl.value || 'Pc';
  unitSelectEl.onchange = () => {
    if(unitSelectEl.value === '__custom__'){ unitCustomEl.style.display = ''; unitCustomEl.value=''; unitCustomEl.focus(); }
    else { unitCustomEl.style.display = 'none'; unitCustomEl.value = unitSelectEl.value; }
    // v2.79: a primary-UOM change must not silently reuse the old unit's conversion.
    const nextUnit = unitSelectEl.value === '__custom__' ? '' : unitSelectEl.value;
    const factorEl = m.querySelector('#e_pcsPerUnit');
    if(factorEl){
      if(['pc','pcs','piece','pieces'].includes(norm44(nextUnit))) factorEl.value = '1';
      else { const row=(S.uomMaster||[]).find(x=>x.productId===p.id && norm44(x.unit)===norm44(nextUnit)); factorEl.value=row&&+row.pcsPerUnit>0?String(row.pcsPerUnit):''; }
    }
  };
  m.onclick = e=>{
    const b=e.target.closest('[data-x]'); if(!b){ if(e.target===m) m.remove(); return; }

    if(b.dataset.x==='del'){ const refs=window.productReferences30?window.productReferences30(p.id):[]; const extra=refs.length?`\n\nReferenced in: ${refs.join(', ')}.`:''; if(confirm(`Archive "${p.name||p.code||'this product'}"?${extra}\n\nIt will be hidden from active use but all history will be preserved.`)){ p.status='archived'; p.updatedAt=Date.now(); save(); m.remove(); render(); toast('Product archived · history preserved'); } }
    if(b.dataset.x==='save'){
      const g=i=>m.querySelector('#'+i).value;
      if(!g('e_name').trim()) return toast('Give the product a name');
      const newCode = g('e_code').trim();
      if(newCode){
        const codeClash = S.products.find(x=>x.id!==p.id && x.code && x.code.trim().toUpperCase()===newCode.toUpperCase());
        if(codeClash) return toast('Code '+newCode+' is already used by "'+codeClash.name+'" — pick a different code');
      }
      const newBar = g('e_bar').trim();
      if(newBar){
        const barClash = S.products.find(x=>x.id!==p.id && x.barcode && x.barcode.trim()===newBar);
        if(barClash) return toast('Barcode '+newBar+' is already used by "'+barClash.name+'" ('+barClash.code+') — use a unique barcode');
      }
      const price=nz(g('e_price')), mrp=nz(g('e_mrp')), gst=nz(g('e_gst')), stock=nz(g('e_stock')), minStock=nz(g('e_min'));
      const dt=g('e_dtype'), dval=nz(g('e_dval'));
      if(price!=null && price<0) return toast('Selling rate cannot be negative');
      if(mrp!=null && mrp<0) return toast('MRP cannot be negative');
      if(gst!=null && (gst<0 || gst>100)) return toast('GST must be between 0 and 100');
      if(stock!=null && stock<0) return toast('Stock cannot be negative');
      if(minStock!=null && minStock<0) return toast('Minimum stock cannot be negative');
      if(dt && dval!=null && dval<0) return toast('Discount value cannot be negative');
      if(dt==='pct' && dval!=null && dval>100) return toast('Percentage discount cannot exceed 100%');
      const pcsPerUnit = nz(m.querySelector('#e_pcsPerUnit').value);

      const oldPrice = p.price;
      Object.assign(p,{ name:g('e_name').trim(), code:g('e_code').trim(), size:g('e_size'), category:g('e_cat')||'Uncategorised',
        catalog:g('e_catalog'), price, priceUnit:g('e_unit')||unitSelectEl.value||'Pc', mrp,
        gst, stock:stock??0, minStock:minStock??0, hsn:g('e_hsn'),
        packing:g('e_pack'), barcode:g('e_bar').trim(), netWt:g('e_wt'), status:g('e_status'), note:g('e_note'), updatedAt:Date.now() });
      p.discount = dt ? {type:dt, value:dval||0} : null;
      S.uomMaster = S.uomMaster || [];
      if(['pc','pcs','piece','pieces'].includes(norm44(p.priceUnit))){
        // Piece-priced products are the base unit. Do not retain a bogus 12 Pc = 1 Pc master row.
        S.uomMaster = S.uomMaster.filter(x=>!(x.productId===p.id && ['pc','pcs','piece','pieces'].includes(norm44(x.unit))));
        p.uom = {perUnit:1, source:'manual'};
      } else if(p.priceUnit && pcsPerUnit && pcsPerUnit > 0){
        const existingUom = S.uomMaster.find(x => x.productId===p.id && norm44(x.unit)===norm44(p.priceUnit));
        if(existingUom){ existingUom.pcsPerUnit = pcsPerUnit; existingUom.updatedAt=Date.now(); }
        else S.uomMaster.push({id: uid(), productId: p.id, unit: p.priceUnit, pcsPerUnit, createdAt:Date.now(), updatedAt:Date.now()});
        // Keep the legacy/native conversion source in sync because pricing/UOM helpers still consult it first.
        p.uom = {perUnit:pcsPerUnit, source:'manual'};
      } else if(p.uom){
        // Blank conversion means "not configured"; never leave a stale previous-primary factor behind.
        delete p.uom;
      }
      if(isNew){
        if(!p.code){ let n=S.products.length+1; while(S.products.some(x=>x.code==='M'+String(n).padStart(3,'0'))) n++; p.code='M'+String(n).padStart(3,'0'); }
        S.products.unshift(p);
        logHistory({type:'added by hand', title:p.name, added:1, updated:0,
          changes:[{code:p.code,name:p.name,catalog:p.catalog,old:null,now:p.price}]});
      } else if(oldPrice!==p.price){
        logHistory({type:'manual', title:'Rate edited by hand',
          changes:[{code:p.code,name:p.name,catalog:p.catalog,old:oldPrice,now:p.price}]});
      }
      save(); m.remove(); render(); toast(isNew?'Product added':'Saved');
    }
  };
}

<script>
/* ============================ PDF writer ============================ */
function buildPDF(cfg){
  const J = (window.jspdf||{}).jsPDF;
  if(!J) throw new Error('PDF writer could not load. Use "Download as web page" and print it to PDF instead.');
  const doc = new J({unit:'pt', format:'a4', orientation: cfg.landscape?'landscape':'portrait'});
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight(), M=26;
  const W = PW-M*2, cols=cfg.columns;
  const sum = cols.reduce((a,c)=>a+(c.w||1),0);
  const widths = cols.map(c=>(c.w||1)/sum*W);
  const x0 = i => M + widths.slice(0,i).reduce((a,b)=>a+b,0);
  let y=0, pageNo=0;

  const header = ()=>{
    pageNo++; y=M;
    doc.setFillColor(21,26,34); doc.rect(0,0,PW,54,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(cfg.firm||'', M, 24);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(205,205,200);
    doc.text(cfg.meta||'', M, 38);
    doc.setTextColor(255,255,255); doc.setFontSize(10.5); doc.setFont('helvetica','bold');
    doc.text(cfg.title||'', PW-M, 24, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(205,205,200);
    doc.text(cfg.sub||'', PW-M, 38, {align:'right'});
    doc.setFillColor(196,42,28); doc.rect(0,54,PW,2.5,'F');
    y = 70;
    tableHead();
  };
  const tableHead = ()=>{
    doc.setFillColor(243,240,233); doc.rect(M,y,W,17,'F');
    doc.setTextColor(70,68,62); doc.setFont('helvetica','bold'); doc.setFontSize(7.6);
    cols.forEach((c,i)=>{
      const tx = c.align==='right' ? x0(i)+widths[i]-4 : x0(i)+4;
      doc.text(String(c.label), tx, y+11, {align:c.align==='right'?'right':'left'});
    });
    y+=17; doc.setFont('helvetica','normal'); doc.setTextColor(30,34,40);
  };
  const footer = ()=>{
    doc.setFontSize(7.5); doc.setTextColor(130,128,122);
    doc.text(cfg.footer||'', M, PH-14);
    doc.text('Page '+pageNo, PW-M, PH-14, {align:'right'});
  };
  const space = h => { if(y+h > PH-30){ footer(); doc.addPage(); header(); } };

  header();
  cfg.groups.forEach(g=>{
    if(g.name){
      space(30);
      doc.setFillColor(232,238,246); doc.rect(M,y,W,15,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2); doc.setTextColor(30,50,90);
      doc.text(String(g.name).toUpperCase(), M+4, y+10.5); y+=15;
      doc.setFont('helvetica','normal'); doc.setTextColor(30,34,40);
    }
    g.rows.forEach((row,ri)=>{
      doc.setFontSize(8.2);
      const lines = row.map((cell,i)=>doc.splitTextToSize(String(cell==null?'':cell), widths[i]-8));
      const h = Math.max(15, Math.max(...lines.map(l=>l.length))*9.6+6);
      space(h);
      if(ri%2===1){ doc.setFillColor(250,249,246); doc.rect(M,y,W,h,'F'); }
      doc.setDrawColor(228,224,215); doc.line(M,y+h,M+W,y+h);
      lines.forEach((ls,i)=>{
        const right = cols[i].align==='right';
        if(cols[i].bold) doc.setFont('helvetica','bold'); else doc.setFont('helvetica','normal');
        doc.text(ls, right?x0(i)+widths[i]-4:x0(i)+4, y+11, {align:right?'right':'left'});
      });
      doc.setFont('helvetica','normal');
      y+=h;
    });
  });
  if(cfg.totals){
    space(24); doc.setFillColor(21,26,34); doc.rect(M,y,W,20,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text(cfg.totals.label, M+6, y+13.5);
    doc.text(cfg.totals.value, M+W-6, y+13.5, {align:'right'}); y+=20;
  }
  footer();
  return doc;
}
function htmlDoc(cfg){
  const th = cfg.columns.map(c=>`<th style="text-align:${c.align==='right'?'right':'left'}">${esc(c.label)}</th>`).join('');
  const body = cfg.groups.map(g=>
    (g.name?`<tr class="g"><td colspan="${cfg.columns.length}">${esc(g.name)}</td></tr>`:'')+
    g.rows.map(r=>`<tr>${r.map((c,i)=>`<td style="text-align:${cfg.columns[i].align==='right'?'right':'left'}">${esc(c)}</td>`).join('')}</tr>`).join('')
  ).join('');
  return `<!doctype html><meta charset="utf-8"><title>${esc(cfg.title)}</title>
<style>body{font-family:Arial,Helvetica,sans-serif;font-size:12px;margin:22px;color:#22262c}
h1{font-size:17px;margin:0}.sub{color:#666;font-size:11px;margin:2px 0 14px}

/* ============================ discounts ============================ */
function viewDisc(v,t,sub,act){
  t.textContent='Discounts'; sub.textContent='Applied to the wholesale rate';
  act.innerHTML = `<button class="btn primary sm" data-act="add-rule">Add a discount</button>`;
  const prof={rules:S.rules};
  const affected = r => S.products.filter(p=>resolveRule(p,S.rules)===r).length;
  v.innerHTML = `
  <div class="split">
    <div class="card"><div class="hd"><h2>How they stack</h2></div><div class="bd note" style="line-height:1.7">
      The most specific discount wins: an item discount beats a category discount, which beats a price-list discount, which beats an all-items discount.
      Party discounts sit on top of the general ones and only apply when you make a list for that party.
      <div style="margin-top:10px">Rounding: <b>${esc(S.settings.rounding)}</b> — <button class="link" data-nav="set">change</button></div>
    </div></div>
    <div>
      <ul class="rules">${S.rules.length?S.rules.map(r=>`
        <li>
          <div style="flex:1">
            <b>${r.type==='pct'?(+r.value)+'% off':r.type==='flat'?S.settings.currency+r.value+' off':'fixed rate '+S.settings.currency+r.value}</b>
            <span class="mut"> · ${r.scope==='all'?'all items':esc(r.scope+': '+r.target)}</span>
            ${r.party?`<span class="tag">${esc((S.parties.find(p=>p.id===r.party)||{}).name||'party')}</span>`:''}
            <div class="note">${affected(r)} products take this rate${r.off?' · switched off':''}</div>
          </div>
          <button class="btn ghost sm" data-act="toggle-rule" data-id="${r.id}">${r.off?'Turn on':'Turn off'}</button>
          <button class="btn ghost sm" data-act="del-rule" data-id="${r.id}">Remove</button>
        </li>`).join(''):'<div class="empty"><b>No discounts yet</b>Add one and every price list you make will use it.</div>'}
      </ul>
      <div class="card"><div class="hd"><h2>Effect preview</h2></div><div class="bd">
        <table><thead><tr><th>Product</th><th class="r">Rate</th><th class="r">Net</th><th class="r">MRP</th><th class="r">Retailer margin</th></tr></thead><tbody>
        ${S.products.filter(p=>p.price!=null).slice(0,8).map(p=>{const r=priceOf(p,prof),m=marginPct(p,r.net);
          return `<tr><td>${esc(p.name.slice(0,44))}</td><td class="r num mut">${money(p.price)}</td>
          <td class="r num"><b>${money(r.net)}</b></td><td class="r num mut">${p.mrp?money(p.mrp):'—'}</td>
          <td class="r num ${m!=null&&m<15?'bad':'good'}">${m==null||m<0?'—':m.toFixed(0)+'%'}</td></tr>`;}).join('')}
        </tbody></table>
      </div></div>
    </div>
  </div>`;
}
function ruleDialog(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><div class="hd"><h2 style="margin:0;font-size:14px">New discount</h2></div><div class="bd">
    <div class="cols2">
      <div class="field"><label>Applies to</label><select id="r_scope">
        <option value="all">every product</option><option value="catalog">one price list</option>
        <option value="category">one category</option><option value="product">one product code</option></select></div>
      <div class="field"><label>Which one</label><input id="r_target" list="tlist" placeholder="—" disabled>
        <datalist id="tlist"></datalist></div>
    </div>
    <div class="cols3">
      <div class="field"><label>Type</label><select id="r_type">
        <option value="pct">% off the rate</option><option value="flat">amount off the rate</option><option value="set">fixed net rate</option></select></div>
      <div class="field"><label>Value</label><input id="r_value" class="num" placeholder="10"></div>
      <div class="field"><label>Only for a party</label><select id="r_party"><option value="">everyone</option>
        ${S.parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    </div>
    <div class="note" id="r_prev">Pick a scope to see how many products this covers.</div>
  </div><div class="ft"><button class="btn ghost" data-x="close">Cancel</button><button class="btn primary" data-x="add">Add discount</button></div></div>`;
  document.body.appendChild(m);
  const sc=m.querySelector('#r_scope'), tg=m.querySelector('#r_target'), dl=m.querySelector('#tlist');
  const fill=()=>{
    const s=sc.value; tg.disabled = s==='all'; tg.value='';
    dl.innerHTML = (s==='catalog'?catalogs():s==='category'?categories():s==='product'?S.products.map(p=>p.code):[])
      .map(x=>`<option>${esc(x)}</option>`).join('');
    prev();
  };
  const prev=()=>{
    const fake={scope:sc.value,target:tg.value,type:'pct',value:0};
    const n = S.products.filter(p=>{
      if(fake.scope==='all') return true;
      if(fake.scope==='catalog') return p.catalog===fake.target;
      if(fake.scope==='category') return p.category===fake.target;
      return (p.code||'').toUpperCase()===fake.target.toUpperCase();
    }).length;
    m.querySelector('#r_prev').textContent = `${n} products match.`;
  };
  sc.onchange=fill; tg.oninput=prev; fill();
  m.onclick=e=>{
    const b=e.target.closest('[data-x]'); if(!b){ if(e.target===m) m.remove(); return; }
    if(b.dataset.x==='close') return m.remove();
    const scope=sc.value, target=tg.value.trim();
    if(scope!=='all' && !target) return toast('Choose what this applies to');
    const value=nz(m.querySelector('#r_value').value);
    if(value==null) return toast('Enter a value');
    S.rules.push({id:uid(), scope, target, type:m.querySelector('#r_type').value, value,
      party:m.querySelector('#r_party').value||null, off:false});
    save(); m.remove(); render(); toast('Discount added');
  };
}
</script>

<script>
/* ============================ rate history ============================ */
function viewHist(v,t,sub,act){
  t.textContent='Rate history';
  const H = S.history||[];
  sub.textContent = H.length? `${H.length} entries · last change ${whenStr(H[0].at)}` : 'Nothing recorded yet';
  act.innerHTML = H.length? `<button class="btn ghost sm" data-act="hist-csv">Export history CSV</button>
    <button class="btn ghost sm" data-act="hist-clear">Clear history</button>` : '';
  const lastByCatalog = {};
  H.forEach(e=>(e.changes||[]).forEach(c=>{ if(!lastByCatalog[c.catalog]) lastByCatalog[c.catalog]=e.at; }));
  if(!H.length){
    v.innerHTML = `<div class="card"><div class="bd empty"><b>No rate changes recorded yet</b>
      Every PDF import, bulk change and hand edit will be written here with the old and new rate.
      <div style="margin-top:12px"><button class="btn primary" data-nav="import">Import a new edition</button></div></div></div>`;
    return;
  }
  v.innerHTML = `
  <div class="grid stats" style="margin-bottom:16px">
    ${catalogs().map(c=>`<div class="stat"><b style="font-size:14px">${esc(c)}</b>
      <span>rates last touched ${lastByCatalog[c]?esc(whenStr(lastByCatalog[c])):'— not since import'}</span></div>`).join('')}
  </div>
  ${H.map(e=>{
    const ch = e.changes||[];
    const up = ch.filter(c=>c.old!=null && c.now!=null && c.now>c.old).length;
    const dn = ch.filter(c=>c.old!=null && c.now!=null && c.now<c.old).length;
    return `<div class="card" style="margin-bottom:10px"><div class="hd">
      <span class="tag">${esc(e.type)}</span>
      <h2>${esc(e.title||'')}</h2>
      <div class="spacer"></div>
      <span class="note">${esc(whenStr(e.at))}</span>
    </div><div class="bd">
      <div class="note" style="margin-bottom:${ch.length?'8px':'0'}">
        ${e.added?`${e.added} new products · `:''}${e.updated?`${e.updated} matched existing codes · `:''}
        ${ch.length?`${ch.length} rate${ch.length>1?'s':''} changed`:'no rate changed'}
        ${up?` · <span class="bad">${up} up</span>`:''}${dn?` · <span class="good">${dn} down</span>`:''}
      </div>
      ${ch.length?`<table><thead><tr><th>Code</th><th>Product</th><th class="r">Old rate</th><th class="r">New rate</th><th class="r">Change</th></tr></thead>
      <tbody>${ch.slice(0, e.open?9999:12).map(c=>{
        const pct = (c.old&&c.now)? (c.now-c.old)/c.old*100 : null;
        return `<tr><td class="num mut">${esc(c.code)}</td><td>${esc((c.name||'').slice(0,52))}</td>
          <td class="r num mut">${c.old==null?'new':money(c.old)}</td>
          <td class="r num"><b>${c.now==null?'—':money(c.now)}</b></td>
          <td class="r num ${pct==null?'mut':(pct>0?'bad':'good')}">${pct==null?'—':(pct>0?'+':'')+pct.toFixed(1)+'%'}</td></tr>`;
      }).join('')}</tbody></table>
      ${ch.length>12 && !e.open?`<div style="text-align:center;padding-top:8px"><button class="link" data-act="hist-open" data-id="${e.id}">show all ${ch.length} changes</button></div>`:''}`:''}
    </div></div>`;
  }).join('')}`;
}
function historyCSV(){
  const rows=[['Date','Type','What','Code','Product','Price list','Old rate','New rate','Change %'].join(',')];
  (S.history||[]).forEach(e=>(e.changes||[]).forEach(c=>{
    const pct=(c.old&&c.now)?((c.now-c.old)/c.old*100).toFixed(1):'';
    rows.push([whenStr(e.at),e.type,e.title||'',c.code,c.name,c.catalog||'',c.old??'',c.now??'',pct]
      .map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(','));
  }));
  download('rate-history-'+new Date().toISOString().slice(0,10)+'.csv', rows.join('\n'), 'text/csv');
}

/* ============================ price list maker ============================ */
ui.list = {party:'', catalog:'', cats:[], onlyStock:false, hideNoPrice:true, extraPct:'',
  cols:{code:true,size:true,packing:false,mrp:true,rate:true,disc:true,net:true,margin:true,stock:false},
  landscape:true, title:'Wholesale price list'};
function profileFor(partyId, extraPct){
  const rules = [...S.rules.filter(r=>!r.party), ...(partyId?S.rules.filter(r=>r.party===partyId):[])];
  if(extraPct) rules.push({id:'adhoc', scope:'all', type:'pct', value:+extraPct, party:null});
  return {rules};
}
function listItems(){
  const L=ui.list;
  return S.products.filter(p=>{
    if(L.catalog && p.catalog!==L.catalog) return false;
    if(L.cats.length && !L.cats.includes(p.category)) return false;
    if(L.onlyStock && !(+p.stock>0)) return false;
    if(L.hideNoPrice && p.price==null) return false;
    return true;
  }).sort(orderInList);
}
/* keep the sequence of the original PDF: same price list, same order it was imported in */
function orderInList(a,b){
  const ci = S.products.indexOf(a) - S.products.indexOf(b);
  return (a.catalog||'').localeCompare(b.catalog||'') || ci;
}
function listConfig(){
  const L=ui.list, prof=profileFor(L.party, nz(L.extraPct));
  const party = S.parties.find(p=>p.id===L.party);
  const defs = [
    ['code','Code','left',1.0],['name','Product','left',3.6],['size','Size','left',1.2],
    ['packing','Packing','left',2.2],['mrp','MRP','right',1.0],['rate','Rate','right',1.0],
    ['disc','Less','right',1.0],['net','Net rate','right',1.15],['margin','Margin','right',0.95],['stock','Stock','right',0.9]
  ];
  const cols = defs.filter(([k])=> k==='name' || L.cols[k]).map(([key,label,align,w])=>({key,label,align,w,bold:key==='net'}));
  const items = listItems(); const groups=[]; let cur=null;
  items.forEach(p=>{
    const r=priceOf(p,prof), m=marginPct(p,r.net);
    if(!cur || cur.name!==p.category){ cur={name:p.category,rows:[]}; groups.push(cur); }
    cur.rows.push(cols.map(c=>({
      code:p.code, name:p.name + (p.priceUnit?'':''), size:p.size, packing:p.packing,
      mrp:p.mrp?S.settings.currency+money(p.mrp):'—',
      rate:p.price==null?'—':S.settings.currency+money(p.price),
      disc:r.rule?(r.rule.type==='pct'?(+r.rule.value)+'%':S.settings.currency+r.rule.value):'—',
      net:r.net==null?(p.status!=='active'?p.status:'—'):S.settings.currency+money(r.net)+(p.priceUnit?'/'+p.priceUnit:''),
      margin:(m==null||m<0)?'—':m.toFixed(0)+'%', stock:String(p.stock||0)
    })[c.key]));
  });
  const st=S.settings;
  return { columns:cols, groups, landscape:L.landscape, firm:st.firm,
    meta:[st.address,st.phone,st.email,st.gstin?'GSTIN '+st.gstin:''].filter(Boolean).join('  ·  '),
    title:L.title||'Price list', count:items.length,
    sub:[party?'For '+party.name:'', st.wef?'W.E.F '+st.wef:'Issued '+today(), L.catalog||'All price lists'].filter(Boolean).join('  ·  '),
    footer:st.footer };
}
function viewList(v,t,sub,act){
  t.textContent='Make a price list'; 
  const cfg = listConfig(); sub.textContent = `${cfg.count} products will be printed`;
  act.innerHTML = `<button class="btn ghost sm" data-act="make-html">Download as web page</button>
    <button class="btn primary sm" data-act="make-pdf">Download PDF</button>`;
  const L=ui.list;
  v.innerHTML=`<div class="split">
    <div class="card"><div class="hd"><h2>What goes in</h2></div><div class="bd">
      <div class="field"><label>Party (uses their discount)</label><select id="L_party">
        <option value="">— general list —</option>
        ${S.parties.map(p=>`<option value="${p.id}" ${L.party===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Price list</label><select id="L_catalog"><option value="">All</option>
        ${catalogs().map(c=>`<option ${L.catalog===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Categories (none ticked = all)</label>
        <div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px">
        ${categories(L.catalog).map(c=>`<label style="display:block;font-size:12.5px"><input type="checkbox" class="Lcat" value="${esc(c)}" ${L.cats.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')||'<span class="note">none</span>'}
        </div></div>
      <div class="field"><label>Extra discount on top (%)</label><input id="L_extra" class="num" value="${esc(L.extraPct)}" placeholder="e.g. 5"></div>
      <label class="note"><input type="checkbox" id="L_stock" ${L.onlyStock?'checked':''}> only items in stock</label><br>
      <label class="note"><input type="checkbox" id="L_np" ${L.hideNoPrice?'checked':''}> hide items without a rate</label><br>
      <label class="note"><input type="checkbox" id="L_land" ${L.landscape?'checked':''}> landscape page</label>
      <div class="field" style="margin-top:10px"><label>Heading</label><input id="L_title" value="${esc(L.title)}"></div>
      <div class="field"><label>Columns</label>
        ${Object.keys(L.cols).map(k=>`<label style="display:inline-block;margin-right:10px;font-size:12.5px"><input type="checkbox" class="Lcol" value="${k}" ${L.cols[k]?'checked':''}> ${k}</label>`).join('')}
      </div>
    </div></div>
    <div class="card"><div class="hd"><h2>Preview</h2><div class="spacer"></div><span class="note">first 30 rows</span></div>
    <div class="bd" style="overflow:auto">
      <table><thead><tr>${cfg.columns.map(c=>`<th class="${c.align==='right'?'r':''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>
      ${(()=>{let n=0,out='';for(const g of cfg.groups){ if(n>30) break;
        out+=`<tr><td colspan="${cfg.columns.length}" style="background:#E8EEF6;color:#1E3258;font-weight:600">${esc(g.name)}</td></tr>`;
        for(const r of g.rows){ if(n++>30) break; out+=`<tr>${r.map((c,i)=>`<td class="${cfg.columns[i].align==='right'?'r num':''}">${esc(c)}</td>`).join('')}</tr>`; } }
        return out||'<tr><td class="empty">Nothing selected yet.</td></tr>';})()}
      </tbody></table>
    </div></div>
  </div>`;
  $('#L_party').onchange=e=>{L.party=e.target.value;render()};
  $('#L_catalog').onchange=e=>{L.catalog=e.target.value;L.cats=[];render()};
  $('#L_extra').onchange=e=>{L.extraPct=e.target.value;render()};
  $('#L_title').onchange=e=>{L.title=e.target.value;render()};
  $('#L_stock').onchange=e=>{L.onlyStock=e.target.checked;render()};
  $('#L_np').onchange=e=>{L.hideNoPrice=e.target.checked;render()};
  $('#L_land').onchange=e=>{L.landscape=e.target.checked};
  v.querySelectorAll('.Lcat').forEach(c=>c.onchange=()=>{ L.cats=[...v.querySelectorAll('.Lcat:checked')].map(x=>x.value); render(); });
  v.querySelectorAll('.Lcol').forEach(c=>c.onchange=()=>{ Object.keys(L.cols).forEach(k=>L.cols[k]=false);
    v.querySelectorAll('.Lcol:checked').forEach(x=>L.cols[x.value]=true); render(); });
}

/* ============================ parties ============================ */
function viewParty(v,t,sub,act){
  t.textContent='Parties'; sub.textContent='Retailers and distributors with their own rates';
  act.innerHTML=`<button class="btn primary sm" data-act="add-party">Add party</button>`;
  v.innerHTML = S.parties.length? `<div class="tbl-wrap"><table><thead><tr>
    <th>Name</th><th>Type</th><th>Place</th><th>Phone</th><th>Own discounts</th><th class="r">Baqi (due)</th><th></th></tr></thead><tbody>
    ${S.parties.map(p=>`<tr>
      <td><b>${esc(p.name)}</b></td><td class="mut">${esc(p.type||'')}</td><td class="mut">${esc(p.city||'')}</td>
      <td class="num mut">${esc(p.phone||'')}</td>
      <td>${S.rules.filter(r=>r.party===p.id).map(r=>`<span class="tag">${r.type==='pct'?r.value+'%':S.settings.currency+r.value}${r.scope==='all'?'':' · '+esc(r.target)}</span>`).join(' ')||'<span class="mut">general rates</span>'}</td>
      <td class="r num ${partyBalance(p.id)>0?'bad':'mut'}">${partyBalance(p.id)?S.settings.currency+money(Math.abs(partyBalance(p.id)))+(partyBalance(p.id)<0?' adv':''):'—'}</td>
      <td class="r"><button class="link" data-act="party-open" data-id="${p.id}"><b>khata</b></button> ·
        <button class="link" data-act="party-rules" data-id="${p.id}">discounts</button> ·
        <button class="link" data-act="party-list" data-id="${p.id}">price list</button> ·
        <button class="link" data-act="party-quote" data-id="${p.id}">quotation</button> ·
        <button class="link" data-act="edit-party" data-id="${p.id}">edit</button> ·
        <button class="link" data-act="del-party" data-id="${p.id}">remove</button></td></tr>`).join('')}
    </tbody></table></div>`
  : `<div class="card"><div class="bd empty"><b>No parties yet</b>Add a retailer to keep their discount and print a list made for them.
     <div style="margin-top:12px"><button class="btn primary" data-act="add-party">Add the first party</button></div></div></div>`;
}
function partyDialog(id){
  const p = id? S.parties.find(x=>x.id===id) : {id:uid(),name:'',type:'Retailer',city:'',phone:'',note:'',
    gstin:'',state:'',address:'',openingBalance:0,creditDays:null,creditLimit:null};
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><div class="hd"><h2 style="margin:0;font-size:14px">${id?'Edit party':'New party'}</h2></div>
  <div class="bd"><div class="cols2">
    <div class="field"><label>Name</label><input id="p_name" value="${esc(p.name)}"></div>
    <div class="field"><label>Type</label><select id="p_type">${['Retailer','Distributor','Wholesaler','Institution'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>City</label><input id="p_city" value="${esc(p.city||'')}"></div>
    <div class="field"><label>Phone</label><input id="p_phone" value="${esc(p.phone||'')}"></div></div>
    <div class="cols2">
      <div class="field"><label>GSTIN</label><input id="p_gstin" value="${esc(p.gstin||'')}"></div>
      <div class="field"><label>State (for CGST/SGST vs IGST)</label><input id="p_state" value="${esc(p.state||'')}" placeholder="Rajasthan"></div>
    </div>
    <div class="field"><label>Billing address</label><input id="p_addr" value="${esc(p.address||'')}"></div>
    <div class="cols3">
      <div class="field"><label>Opening balance (Rs., they owe you)</label><input id="p_open" class="num" value="${p.openingBalance||0}"></div>
      <div class="field"><label>Credit days</label><input id="p_days" class="num" value="${p.creditDays??''}" placeholder="${S.settings.creditDays}"></div>
      <div class="field"><label>Credit limit</label><input id="p_limit" class="num" value="${p.creditLimit??''}" placeholder="optional"></div>
    </div>
    <div class="field"><label>Standing discount on all items (%) — optional</label><input id="p_disc" class="num" placeholder="e.g. 8"></div>
    <div class="field"><label>Note</label><textarea id="p_note" rows="2">${esc(p.note||'')}</textarea></div>
  </div><div class="ft"><button class="btn ghost" data-x="close">Cancel</button><button class="btn primary" data-x="save">Save</button></div></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b){ if(e.target===m) m.remove(); return; }
    if(b.dataset.x==='close') return m.remove();
    p.name=m.querySelector('#p_name').value.trim(); if(!p.name) return toast('Name is needed');
    p.type=m.querySelector('#p_type').value; p.city=m.querySelector('#p_city').value;
    p.phone=m.querySelector('#p_phone').value; p.note=m.querySelector('#p_note').value;
    p.gstin=m.querySelector('#p_gstin').value.trim(); p.state=m.querySelector('#p_state').value.trim();
    p.address=m.querySelector('#p_addr').value.trim();

}

/* one party, their own discounts — these beat the general ones */
function partyRules(id){
  const party = S.parties.find(x=>x.id===id); if(!party) return;
  const m=document.createElement('div'); m.className='modal';
  const draw = ()=>{
    const rules = S.rules.filter(r=>r.party===id);
    m.innerHTML = `<div class="box"><div class="hd"><h2 style="margin:0;font-size:14px">Discounts for ${esc(party.name)}</h2>
      <div class="spacer"></div><span class="note">${esc(party.type||'')}${party.city?', '+esc(party.city):''}</span></div>
    <div class="bd">
      <ul class="rules">${rules.length?rules.map(r=>`<li>
        <div style="flex:1"><b>${r.type==='pct'?(+r.value)+'% off':r.type==='flat'?S.settings.currency+r.value+' off':'fixed rate '+S.settings.currency+r.value}</b>

        <button class="btn ghost sm" data-r="${r.id}">Remove</button></li>`).join('')

        <div class="cols3">

        .map(x=>`<option>${esc(x)}</option>`).join(''); };
  };
  draw();
  m.onclick=e=>{
    const rm=e.target.closest('[data-r]');
    if(rm){ S.rules=S.rules.filter(r=>r.id!==rm.dataset.r); save(); draw(); render(); return; }
    const b=e.target.closest('[data-x]'); if(!b){ if(e.target===m) m.remove(); return; }
    const x=b.dataset.x;
    if(x==='close'){ m.remove(); render(); }
    if(x==='list'){ ui.list.party=id; m.remove(); go('list'); }
    if(x==='quote'){ ui.quote.party=id; m.remove(); go('quote'); }
    if(x==='add'){

      if(value==null) return toast('Enter a value');

<script>
/* ============================ actions ============================ */
function handleAct(a, el){
  const id = el.dataset.id, v = el.dataset.v;
  switch(a){
    case 'pick': $('#file').click(); break;
    case 'cancel-import': ui.review=null; render(); break;
    case 'confirm-import': confirmImport(); break;
    case 'edit': editProduct(id); break;
    case 'add-product': newProduct(); break;
    case 'more': ui.limit+=250; render(); break;
    case 'clear-filters': ui.q='';ui.cat='';ui.catalog='';ui.only='';render(); break;
    case 'filter-cat': ui.cat=v; ui.catalog=''; go('inv'); break;
    case 'filter-catalog': ui.catalog=v; ui.cat=''; go('inv'); break;
    case 'export-csv': exportCSV(filtered()); break;
    case 'export-all-csv': exportCSV(S.products); break;
    case 'bulk-clear': ui.sel.clear(); render(); break;
    case 'bulk-run': bulkRun(); break;
    case 'bulk-quote': {
      [...ui.sel].forEach(pid=>{ if(!ui.quote.items.find(i=>i.id===pid)) ui.quote.items.push({id:pid,qty:1}); });
      ui.sel.clear(); go('quote'); break; }
    case 'add-rule': ruleDialog(); break;
    case 'del-rule': S.rules=S.rules.filter(r=>r.id!==id); save(); render(); break;
    case 'toggle-rule': { const r=S.rules.find(x=>x.id===id); r.off=!r.off; save(); render(); break; }
    case 'add-party': partyDialog(); break;
    case 'edit-party': partyDialog(id); break;
    case 'del-party': if(confirm('Remove this party and their discounts?')){ S.parties=S.parties.filter(p=>p.id!==id); S.rules=S.rules.filter(r=>r.party!==id); save(); render(); } break;
    case 'party-list': ui.list.party=id; go('list'); break;
    case 'make-pdf': {
      const cfg=listConfig();
      if(!cfg.count) return toast('Nothing to print with these filters');
      try{ buildPDF(cfg).save((cfg.title||'price-list').toLowerCase().replace(/\s+/g,'-')+'-'+new Date().toISOString().slice(0,10)+'.pdf'); toast('PDF downloaded'); }
      catch(e){ download('price-list.html', htmlDoc(cfg),'text/html'); toast(e.message); }
      break; }
    case 'make-html': { const cfg=listConfig(); download('price-list.html', htmlDoc(cfg),'text/html'); toast('Open the file and print it to PDF'); break; }
    case 'quote-pdf': quotePDF(); break;
    case 'quote-clear': ui.quote.items=[]; render(); break;
    case 'q-del': ui.quote.items=ui.quote.items.filter(i=>i.id!==id); render(); break;
    case 'save-settings': {
      const g=i=>document.querySelector('#'+i).value;
      Object.assign(S.settings,{firm:g('s_firm'),phone:g('s_phone'),address:g('s_addr'),email:g('s_email'),
        gstin:g('s_gstin'),wef:g('s_wef'),rounding:g('s_round'),gstDefault:nz(g('s_gst'))||0,footer:g('s_footer'),
        state:g('s_state'),invPrefix:g('s_prefix'),nextInvNo:nz(g('s_next'))||1,creditDays:nz(g('s_credit'))||30});
      save(); render(); toast('Details saved'); break; }
    case 'hist-csv': historyCSV(); break;
    case 'hist-open': { const e=(S.history||[]).find(x=>x.id===id); if(e){ e.open=true; render(); } break; }
    case 'hist-clear': if(confirm('Clear the whole rate history? Products and rates stay as they are.')){ S.history=[]; save(); render(); } break;
    case 'party-quote': ui.quote.party=id; go('quote'); break;
    case 'party-rules': partyRules(id); break;
    case 'backup': download('price-manager-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(S,null,1),'application/json'); break;
    case 'restore': {
      const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
      inp.onchange=async e=>{ try{ const d=JSON.parse(await e.target.files[0].text());
        if(!d.products) throw new Error('Not a backup file');
        S={...S,...d,settings:{...DEF_SETTINGS,...(d.settings||{})}}; save(); render(); toast('Backup restored');
      }catch(err){ toast(err.message); } };
      inp.click(); break; }
    case 'reset': if(window.resetAllData265){ window.resetAllData265(el); break; } if(confirm('Delete every product, discount and party? Take a backup first.')){
        S={products:[],rules:[],parties:[],quotes:[],invoices:[],payments:[],settings:{...DEF_SETTINGS},imports:[],history:[]}; save(); go('dash'); } break;
    default: accountsAct(a, el);
  }
}
function bulkRun(){
  const act=$('#bulkAct').value, raw=$('#bulkVal').value, val=nz(raw);
  const items=S.products.filter(p=>ui.sel.has(p.id));
  const before = new Map(items.map(p=>[p.id,p.price]));
  if(!act) return toast('Choose an action');
  if(['price-pct','price-flat','disc-pct','disc-flat','stock','min','gst'].includes(act) && val==null) return toast('Enter a value');
  items.forEach(p=>{
    switch(act){
      case 'price-pct': if(p.price!=null) p.price=Math.round(p.price*(1+val/100)*100)/100; break;
      case 'price-flat': if(p.price!=null) p.price=Math.max(0,Math.round((p.price+val)*100)/100); break;
      case 'disc-pct': p.discount={type:'pct',value:val}; break;
      case 'disc-flat': p.discount={type:'flat',value:val}; break;
      case 'disc-clear': p.discount=null; break;
      case 'cat': p.category=raw.trim()||p.category; break;
      case 'stock': p.stock=val; break;
      case 'min': p.minStock=val; break;
      case 'gst': p.gst=val; break;
    }
    p.updatedAt=Date.now();
  });
  if(['price-pct','price-flat'].includes(act)){
    const ch = items.map(p=>({code:p.code,name:p.name,catalog:p.catalog,old:before.get(p.id),now:p.price})).filter(c=>c.old!==c.now);
    if(ch.length) logHistory({type:'bulk', title:(act==='price-pct'?(val>0?'+':'')+val+'% on selected items':'Rs.'+val+' on selected items'), changes:ch});
  }
  if(act==='del'){ if(!confirm(`Archive ${items.length} products?`)) return; items.forEach(p=>{p.status='archived';p.updatedAt=Date.now()}); }
  ui.sel.clear(); save(); render();
  toast(act==='del'?'Archived · history preserved':`${items.length} products updated`);
}

(async function init(){
  const had = await loadState();
  // Later script blocks provide screens and wrap render/save. Do not call them
  // while the parser is still loading the rest of the application.
  if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));
  window.__pmStateReady284=true;
  if(window.__PM_VAULT_PENDING)window.__pmActivateVault284?.();
  S.history = S.history || [];
  if(S.settings.firm==='Tota Trading Co.') S.settings.firm='My Trading Company';
  if(!had && SEED.length){
    S.products = SEED.map(p=>({...p, priceUnit:tidyUnit(p.priceUnit), id:uid(), stock:0, minStock:0, hsn:'', gst:null, discount:null, note:'', updatedAt:Date.now(), isSample:true}));
    S.imports=[{at:Date.now(), catalog:'sample import', added:S.products.length, updated:0}];
    save();
  }
  render();
  if(dirty&&!window.__PM_VAULT_PENDING)save();
  window.dispatchEvent(new Event('pm-state-ready284'));
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && !/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); if(page!=='inv') go('inv'); const q=$('#q'); if(q) q.focus(); }
  });
})();
</script>

<script>
/* ==================== bills, payments and party khata ==================== */
const CUR = () => S.settings.currency;
const dstr = ts => new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});
const partyOf = id => S.parties.find(p=>p.id===id);

function sameState(party){
  const a=(S.settings.state||'').trim().toLowerCase(), b=((party&&party.state)||'').trim().toLowerCase();
  return a && b && a===b;
}
/* one bill, split the way the tax rules ask for */
function taxParts(inv){
  const party = partyOf(inv.partyId);
  const t = inv.gstAmt||0;
  return sameState(party) ? [['CGST', t/2],['SGST', t/2]] : [['IGST', t]];
}
const invPaid = inv => (S.payments||[]).filter(p=>!(p.date>Date.now())).reduce((a,p)=>a + (p.allocations||[]).filter(x=>x.invId===inv.id).reduce((s,x)=>s+x.amt,0), 0);
const invDue  = inv => Math.max(0, Math.round(((inv.total||0) - invPaid(inv))*100)/100);
function invStatus(inv){
  if(inv.cancelled) return 'cancelled';
  const due = invDue(inv);
  if(due<=0.5) return 'paid';
  const days = overdueDays(inv);
  if(invPaid(inv)>0) return days>0?'part · overdue':'part paid';
  return days>0 ? 'overdue '+days+'d' : 'unpaid';
}
function overdueDays(inv){
  const party = partyOf(inv.partyId);
  const days = (party && party.creditDays!=null ? party.creditDays : S.settings.creditDays) || 0;
  const d = Math.floor((Date.now() - inv.date)/86400000) - days;
  return d>0 ? d : 0;
}
function partyBalance(pid){
  const party = partyOf(pid); if(!party) return 0;
  const bills = (S.invoices||[]).filter(i=>i.partyId===pid && !i.cancelled).reduce((a,i)=>a+i.total,0);
  const paid  = (S.payments||[]).filter(p=>p.partyId===pid).reduce((a,p)=>a+p.amount,0);
  return Math.round(((+party.openingBalance||0) + bills - paid)*100)/100;
}
function totalReceivable(){ return S.parties.reduce((a,p)=>a+Math.max(0,partyBalance(p.id)),0); }

/* ---------- making a bill out of the current quotation ---------- */
function quoteToInvoice(){
  const Q = ui.quote;
  if(!Q.party) return toast('Choose the party first');
  const items = Q.items.map(it=>{
    const p = S.products.find(x=>x.id===it.id); if(!p) return null;
    const r = priceOf(p, profileFor(Q.party));
    return {id:p.id, code:p.code, name:p.name, size:p.size, hsn:p.hsn||'', qty:+it.qty||0,
      rate:r.net||0, gst:(p.gst??S.settings.gstDefault), amt:Math.round((r.net||0)*(+it.qty||0)*100)/100};
  }).filter(x=>x && x.qty>0);
  if(!items.length) return toast('Add at least one item with a quantity');
  const party = partyOf(Q.party);
  const subtotal = items.reduce((a,i)=>a+i.amt,0);
  const gstAmt = Q.gst ? items.reduce((a,i)=>a + i.amt*(i.gst/100), 0) : 0;
  const raw = subtotal + gstAmt;
  const total = Math.round(raw);
  const inv = {
    id:uid(), no:(S.settings.invPrefix||'INV-')+String(S.settings.nextInvNo||1).padStart(4,'0'),
    date:Date.now(), partyId:party.id, partyName:party.name, items,
    subtotal:Math.round(subtotal*100)/100, gstAmt:Math.round(gstAmt*100)/100,
    roundOff:Math.round((total-raw)*100)/100, total, withGst:!!Q.gst, cancelled:false, note:''
  };
  S.settings.nextInvNo = (S.settings.nextInvNo||1)+1;
  S.invoices.unshift(inv);
  items.forEach(i=>{ const p=S.products.find(x=>x.id===i.id); if(p) p.stock = Math.max(0,(+p.stock||0) - i.qty); });
  ui.quote.items=[]; save();
  ui.partyId = party.id; go('party1');
  toast('Bill '+inv.no+' made · stock reduced');
  return inv;
}

/* ---------- ledger ---------- */
function getLedger(pid, from, to){
  const party = partyOf(pid); if(!party) return {party:null, rows:[], closing:0};
  const inRange = ts => (!from || ts>=from) && (!to || ts<=to);
  const txns = [];
  (S.invoices||[]).filter(i=>i.partyId===pid && !i.cancelled).forEach(i=>
    txns.push({date:i.date, type:'Bill', ref:i.no, desc:i.items.length+' items', debit:i.total, credit:0, invId:i.id}));
  (S.payments||[]).filter(p=>p.partyId===pid).forEach(p=>
    txns.push({date:p.date, type:'Payment', ref:p.mode+(p.ref?' '+p.ref:''), desc:p.note||'received', debit:0, credit:p.amount, payId:p.id}));
  txns.sort((a,b)=>a.date-b.date);
  let bal = +party.openingBalance||0;
  const rows=[{date:null, type:'Opening', ref:'—', desc:'Opening balance', debit:bal>0?bal:0, credit:bal<0?-bal:0, balance:bal}];
  txns.forEach(t=>{ bal += t.debit - t.credit; if(inRange(t.date)) rows.push({...t, balance:Math.round(bal*100)/100}); });
  return {party, rows, closing:Math.round(bal*100)/100};
}

function waQuote(){
  const Q=ui.quote, party=partyOf(Q.party), prof=profileFor(Q.party);
  let total=0, gst=0, lines=[];
  Q.items.forEach((it,idx)=>{ const p=S.products.find(x=>x.id===it.id); if(!p) return;
    const r=priceOf(p,prof), amt=(r.net||0)*(+it.qty||0); total+=amt;
    if(Q.gst) gst+=amt*((p.gst??S.settings.gstDefault)/100);
    lines.push(`${idx+1}. ${p.name}${p.size?' ('+p.size+')':''}\n   ${it.qty} x ${CUR()}${money(r.net)} = ${CUR()}${money(amt)}`); });
  if(!lines.length) return toast('Nothing in the quotation yet');
  const txt = `*${S.settings.firm}*\nQuotation${party?' for '+party.name:''}\n${today()}\n\n${lines.join('\n')}\n\n`+
    (Q.gst?`Subtotal: ${CUR()}${money(total)}\nGST: ${CUR()}${money(gst)}\n`:'')+
    `*Total: ${CUR()}${money(total+gst)}*`;
  shareBox('Send this quotation', txt, party&&party.phone);
}
function waInvoice(inv){
